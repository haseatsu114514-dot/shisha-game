<svg xmlns="http://www.w3.org/2000/svg" width="460" height="704" viewBox="0 0 460 704">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1a1040" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030610" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="nightglow" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#2a184a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#030610" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="smokeblur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- Base background -->
  <rect width="460" height="704" fill="url(#glow)"/>
