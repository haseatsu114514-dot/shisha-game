<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1828" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#060d18" stop-opacity="0.97"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Panel background -->
  <rect x="0" y="0" width="480" height="220" rx="14" ry="14" fill="url(#panelGrad)"/>
  <!-- Top accent border -->
  <rect x="0" y="0" width="480" height="3" rx="2" ry="2" fill="#feae34" opacity="0.7"/>
  <!-- Left accent -->
  <rect x="0" y="0" width="3" height="220" rx="2" ry="2" fill="#feae34" opacity="0.4"/>
  <!-- Corner dots -->
  <circle cx="14" cy="14" r="4" fill="#feae34" opacity="0.5"/>
  <circle cx="466" cy="14" r="4" fill="#feae34" opacity="0.3"/>
  <!-- Divider line -->
  <line x1="20" y1="46" x2="460" y2="46" stroke="#feae34" stroke-width="0.5" opacity="0.3"/>
  <!-- Map icon placeholder -->
  <path d="M20 18 L30 12 L40 18 L30 24 Z" stroke="#feae34" stroke-width="1.2" fill="none" opacity="0.6"/>
  <circle cx="30" cy="18" r="3" fill="#feae34" opacity="0.4"/>
</svg>
