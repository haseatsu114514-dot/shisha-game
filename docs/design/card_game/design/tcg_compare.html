<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>一台勝負・札の比較</title>
<link rel="stylesheet" href="../../../../remake/css/base.css">
<link rel="stylesheet" href="../../../../remake/css/ichidai.css">
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#150d22; }
#stage { position:absolute; width:1280px; height:720px; transform-origin:top left; }
.compare { display:flex; align-items:start; justify-content:space-around; gap:12px; height:100%; padding:20px 26px; }
.compare-col { display:grid; justify-items:center; align-content:start; gap:9px; width:290px; }
.compare-col h2 { margin:0; min-height:28px; color:#f6f1fa; font-size:18px; }
.compare-row { display:flex; gap:10px; align-items:center; }
.compare-row .ichi-card.s-big { --cw:240px; }
.compare-row .ichi-card.s-hand { --cw:112px; }
.compare-row .ichi-card.s-mini { --cw:64px; }
.compare-footer { position:absolute; bottom:8px; left:22px; color:#fff; font-size:14px; font-weight:700; }
</style></head><body><div id="stage"><section class="ichi-game" id="compare"><div class="compare" id="cards"></div><div class="compare-footer" id="caption"></div></section></div>
<script type="module">
import { tcg } from '../../../../remake/js/minigames/ichidai.js';
const params = new URLSearchParams(location.search), skin = params.get('skin') === 'b' ? 'b' : 'a';
const link = document.createElement('link'); link.rel='stylesheet'; link.href=`../../../../remake/css/ichidai-skin-${skin}.css`; document.head.append(link);
document.getElementById('compare').dataset.skin=skin;
const types = [
  ['炭','card','cube'], ['技・手番','card','read'], ['技・一口','card','heat_in'], ['器具','card','windguard'],
  ['イベント','card','hype'], ['人物 SR','card','sumi'], ['ボウル','bowl','funnel'], ['HMD','hmd','lotus'],
  ['葉・フルーツ','flavor','lemon'], ['葉・清涼','flavor','mint'], ['葉・スパイス','flavor','cinnamon'],
  ['葉・フローラル','flavor','rose'], ['葉・スイート','flavor','vanilla'],
];
const rar = ['C','U','R','SR'];
const make = (label, kind, id, rarity=null) => {
  const col=document.createElement('div'); col.className='compare-col';
  const h=document.createElement('h2'); h.textContent=label; col.append(h);
  for(const size of ['big','hand','mini']) { const row=document.createElement('div'); row.className='compare-row'; const card=tcg(kind,id,{size}); if(rarity) { for(const cl of [...card.classList]) if(cl.startsWith('r-')) card.classList.remove(cl); card.classList.add(`r-${rarity}`); card.querySelectorAll('.ichi-rar').forEach(e=>e.textContent=rarity); } row.append(card); col.append(row); }
  return col;
};
const view=params.get('view')||'types', offset=Math.max(0,Number(params.get('offset'))||0), cards=document.getElementById('cards');
if(view==='rarity') { for(const r of rar) cards.append(make(r,'card','sumi',r)); document.getElementById('caption').textContent='同じ札の C・U・R・SR（見た目のみ比較）'; }
else { for(const [label,kind,id] of types.slice(offset,offset+4)) cards.append(make(label,kind,id)); document.getElementById('caption').textContent=`札の一覧 ${offset+1}〜${Math.min(offset+4,types.length)} / ${types.length}`; }
function fit(){ const s=Math.min(innerWidth/1280,innerHeight/720); const el=document.getElementById('stage'); el.style.transform=`scale(${s})`; el.style.left=`${(innerWidth-1280*s)/2}px`; el.style.top=`${(innerHeight-720*s)/2}px`; } addEventListener('resize',fit); fit();
</script></body></html>
