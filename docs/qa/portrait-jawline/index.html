<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>立ち絵のフェイスライン比較</title>
<style>
body{font:15px system-ui;margin:24px;background:#eee;color:#222}header{position:sticky;top:0;background:#eee;padding:12px;z-index:2}select{font:inherit;margin:6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}article{background:white;padding:12px;overflow:auto}h2{font-size:17px;margin:4px 0}a{display:block;overflow-wrap:anywhere;font-size:12px}.images{display:flex;gap:12px;align-items:start}figure{margin:8px 0}canvas{display:block}figcaption{font-size:12px}small{display:block}#status{padding:8px}
</style>
<header><h1>立ち絵のフェイスライン比較</h1>
<p>22キャラ100表情を個別点検。みんと通常v4・あげは悲しみv1の先行2枚をローカル反映済みです。みんとは顔を正面寄りに変更。公開反映と最終の見た目確認は未了です。各画像に判定理由を記録しています。</p>
<label>キャラ<select id="character"><option value="">全員</option></select></label>
<label>対象<select id="priority"><option value="">全表情</option><option value="candidates">残る修正・調整候補</option><option value="corrected">先行修正済み</option><option value="low">濃さを経過確認</option></select></label>
<label>背景<select id="background"><option value="#888888">灰</option><option value="#ffffff">白</option><option value="#16121c">暗</option></select></label>
<label>倍率<select id="scale"><option value="1">原寸 100%</option><option value=".5">縮小 50%（比較用）</option><option value="2">拡大 200%</option></select></label>
<p>左：現在の素材PNG／右：ゲーム用WebP。縮小倍率は比較用で、実ゲームは画面サイズ・シーンで変わります。目視点検の範囲と残課題はREADME、修正前の全表情はaudit/の連絡シートに保存しています。パペットで隠れる顔は判定対象外です。</p>
<div id="status" role="status"></div></header><main></main>
<script type="module">
const root='../../../', rows=await fetch('./catalog.json').then(r=>r.json());
const char=document.querySelector('#character'),bg=document.querySelector('#background'),scale=document.querySelector('#scale'),priority=document.querySelector('#priority');
const names=new Map(rows.map(r=>[r.character,r.name]));
for(const [id,name] of names){const o=new Option(name,id);char.add(o)}
const cache=new Map();
function getImage(path){if(!cache.has(path))cache.set(path,new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error(path));im.src=root+path}));return cache.get(path)}
let renderId=0;
async function render(){
 const id=++renderId, selected=rows.filter(r=>(!char.value||r.character===char.value)&&(!priority.value||(priority.value==='candidates'?['high','medium'].includes(r.priority):r.priority===priority.value))), main=document.querySelector('main');main.replaceChildren();
 const k=Number(scale.value),color=bg.value;let failures=0;
 await Promise.all(selected.map(async r=>{
  const article=document.createElement('article'),title=document.createElement('h2'),note=document.createElement('small'),images=document.createElement('div');
  title.textContent=`${r.name} / ${r.expression}`;note.textContent=r.classification+'。'+r.note;images.className='images';article.append(title,note,images);main.append(article);
  for(const [label,path] of [['素材PNG',r.source],['ゲーム用WebP',r.runtime]]){
   const fig=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=label;fig.append(caption,canvas);images.append(fig);
   try{const im=await getImage(path);if(id!==renderId)return;const [x,y,x2,y2]=r.crop;canvas.width=Math.round((x2-x)*k);canvas.height=Math.round((y2-y)*k);const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,-x*k,-y*k,im.width*k,im.height*k)}catch(e){failures++;caption.textContent+=' 読込失敗: '+path}
  }
  for(const path of [r.source,r.runtime]){const a=document.createElement('a');a.href=root+path;a.textContent=path;article.append(a)}
 }));
 if(id===renderId)document.querySelector('#status').textContent=`${selected.length}表情・${failures}件の読込失敗`;
}
for(const input of [char,bg,scale,priority])input.addEventListener('change',render);
render();
</script></html>
