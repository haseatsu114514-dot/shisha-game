<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../../remake/css/daily.css">
<style>
* { box-sizing:border-box; }
body { margin:24px; background:#243045; color:white; font:16px sans-serif; }
.row { display:flex; gap:50px; padding:24px; align-items:center; }
.before img.lime-face[src$="/face_hiyori.png"] { padding-left:0 !important; object-position:50% 50% !important; }
.sample { display:flex; flex-direction:column; align-items:center; gap:12px; }
.zoom { margin:50px; transform:scale(3); }
</style>
<h1>786 static icon crop fixture</h1>
<h2>Before</h2>
<div class="row before">
<div class="sample"><img class="lime-face" src="../../../assets/ui/face_icons/face_hiyori.png"><span>32px</span></div>
<div class="sample"><img class="lime-face sm" src="../../../assets/ui/face_icons/face_hiyori.png"><span>28px</span></div>
<div class="sample lcr-face"><img class="lime-face" src="../../../assets/ui/face_icons/face_hiyori.png"><span>42px</span></div>
<div class="sample zoom"><img class="lime-face" src="../../../assets/ui/face_icons/face_hiyori.png"></div>
<div class="sample"><img class="lime-face" src="../../../assets/ui/face_icons/face_hiyori.png?control"><span>Other URL control</span></div>
</div>
<h2>After</h2>
<div class="row after">
<div class="sample"><img class="lime-face" src="../../../assets/ui/face_icons/face_hiyori.png"><span>32px</span></div>
<div class="sample"><img class="lime-face sm" src="../../../assets/ui/face_icons/face_hiyori.png"><span>28px</span></div>
<div class="sample lcr-face"><img class="lime-face" src="../../../assets/ui/face_icons/face_hiyori.png"><span>42px</span></div>
<div class="sample zoom"><img class="lime-face" src="../../../assets/ui/face_icons/face_hiyori.png"></div>
<div class="sample"><img class="lime-face" src="../../../assets/ui/face_icons/face_hiyori.png?control"><span>Other URL control</span></div>
</div>
<pre id="result"></pre>
<script>
onload = () => {
  const rows = [...document.querySelectorAll('.row')].map(row => [...row.querySelectorAll('img')].map(img => {
    const r=img.getBoundingClientRect(), s=getComputedStyle(img);
    return {width:r.width,height:r.height,padding:s.paddingLeft,position:s.objectPosition,loaded:img.complete&&img.naturalWidth===160};
  }));
  document.querySelector('#result').textContent = JSON.stringify(rows,null,2);
};
</script>
