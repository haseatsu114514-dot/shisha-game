<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レベルアップ体験モック（使い捨て）</title>
<!--
  使い捨ての評価用モック。SPEC（docs/stat-design/SPEC.md 案A）の数値で
  経験値→寝る時のレベルアップ→火種→心得の盤→効果の実感 を一通り触るためのもの。
  ゲーム本体のコードは読まない・書かない。画像素材は使わない（図形と文字だけ）。
  ?flow=sleep-first のように URL で既定を変えない。操作はすべて画面のボタンで行う。
-->
<style>
:root{
  --bg:#141019;--panel:#1e1826;--panel2:#271f31;--line:#4a3d58;--text:#efe9f4;--dim:#a99bb8;
  --gold:#e8c27a;--gold-hi:#ffe2a6;--gold-lo:#7a6236;--amber:#f0a64a;--danger:#ff6b6b;--good:#8ee6a8;
  --technique:#f2c34c;--sense:#6cc6e8;--guts:#ef7a5e;--charm:#b49aef;--insight:#65c9bb;
  --font:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;height:100%;min-height:380px;overflow:hidden;background:
  radial-gradient(ellipse at 30% 20%,#2b2238 0,#141019 70%)}
/* ---------- HUD ---------- */
.hud{position:absolute;left:12px;top:12px;display:flex;gap:10px;background:rgba(20,15,26,.92);border:1px solid var(--gold-lo);
  border-radius:8px;padding:8px 10px;z-index:5}
.hud .day{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px}
.hud .day b{font-size:26px;line-height:1}
.hud .day small{color:var(--dim)}
.hud .rows{display:flex;flex-direction:column;gap:4px;min-width:210px}
.hud .row{display:flex;align-items:center;gap:6px;font-size:12px}
.hud .row>span:first-child{color:var(--dim);width:3.2em}
.bar{position:relative;height:8px;border-radius:4px;background:#0b0810;border:1px solid #3a2f46;flex:1;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar .st{background:var(--good)}
.bar .done{background:var(--gold)}
.bar .today{background:rgba(232,194,122,.42)}
.bar.full{box-shadow:0 0 8px var(--gold-hi);border-color:var(--gold)}
.lvrow b{color:var(--gold-hi);min-width:3.6em}
.lvrow .left{min-width:5.6em;text-align:right;color:var(--gold)}
.lvrow .left.tonight{color:var(--gold-hi);font-weight:700;animation:pulse 1.2s infinite}
.mile{color:var(--amber);font-size:11px}
.hidane{display:inline-flex;align-items:center;gap:3px}
.flame{display:inline-block;width:10px;height:13px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3c4 0,#ffb347 40%,#e0602c 80%);vertical-align:-1px}
.flame.c-technique{background:radial-gradient(circle at 50% 70%,#fff 0,var(--technique) 55%,#8a6a1c)}
.flame.c-sense{background:radial-gradient(circle at 50% 70%,#fff 0,var(--sense) 55%,#2d6b84)}
.flame.c-guts{background:radial-gradient(circle at 50% 70%,#fff 0,var(--guts) 55%,#8a3a28)}
.flame.c-charm{background:radial-gradient(circle at 50% 70%,#fff 0,var(--charm) 55%,#5b4a8a)}
.flame.c-insight{background:radial-gradient(circle at 50% 70%,#fff 0,var(--insight) 55%,#2b6b62)}
.wind{color:var(--sense);font-size:12px}
.topright{position:absolute;right:12px;top:12px;display:flex;gap:8px;z-index:5}
.icon-btn{position:relative;width:46px;height:46px;border-radius:8px;border:1px solid var(--gold-lo);background:rgba(20,15,26,.92);display:grid;place-items:center}
.icon-btn.menu{width:auto;padding:0 12px;letter-spacing:.12em}
.badge{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;border-radius:9px;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
.badge.red{background:var(--danger);color:#fff}
.badge.ember{background:radial-gradient(circle at 50% 65%,#ffe9a8,#f08a2c 70%);color:#3a1a00;font-weight:700;box-shadow:0 0 6px #f0a64a}
.badge.lime{background:var(--danger);color:#fff}
/* ---------- map (simplified) ---------- */
.map{position:absolute;inset:0;padding:96px 16px 16px;display:grid;grid-template-columns:1fr 280px;gap:12px}
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;overflow:auto}
.spot{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;min-height:68px}
.spot:hover{border-color:var(--gold)}
.spot b{display:block;font-size:15px}
.spot small{color:var(--dim)}
.tag{display:inline-block;font-size:11px;border-radius:3px;padding:0 5px;margin-left:4px;border:1px solid}
.tag.first{color:var(--gold-hi);border-color:var(--gold)}
.tag.fam{color:var(--dim);border-color:#5c506a}
.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.side h3{margin:0;font-size:13px;color:var(--gold)}
.side .log{font-size:12px;color:var(--dim);line-height:1.6;flex:1;overflow:auto}
.side button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px}
.side button.primary{border-color:var(--gold);color:var(--gold-hi)}
.devrow{display:flex;flex-wrap:wrap;gap:4px}
.devrow button{font-size:11px;padding:4px 6px}
.respec-band{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(108,198,232,.15);border:1px solid var(--sense);
  color:var(--sense);border-radius:14px;padding:3px 12px;font-size:12px;z-index:4;white-space:nowrap}
/* ---------- chips & cards ---------- */
.chips{position:absolute;left:12px;top:100px;display:flex;flex-direction:column;gap:4px;z-index:6;pointer-events:none}
.chip{background:rgba(30,22,40,.95);border:1px solid var(--gold);color:var(--gold-hi);border-radius:12px;padding:2px 10px;font-size:12px;
  animation:chipIn .25s ease-out,chipOut .4s ease-in 2.2s forwards;white-space:nowrap}
.chip em{font-style:normal;color:var(--dim);margin-left:4px}
.chip .w{color:var(--sense)}
.cards{position:absolute;right:12px;top:70px;display:flex;flex-direction:column;gap:8px;z-index:7;pointer-events:none}
.card{width:272px;min-height:68px;background:linear-gradient(135deg,#2b2235,#18121f);border:2px solid var(--c,var(--gold));border-radius:6px;padding:8px 10px 8px 56px;position:relative;
  animation:cardIn .3s ease-out,chipOut .4s ease-in 3s forwards}
.card .k{position:absolute;left:10px;top:12px;width:36px;height:36px;border:2px solid var(--c);border-radius:4px;display:grid;place-items:center;font-weight:800;color:var(--c)}
.card small{color:var(--c);letter-spacing:.12em;font-size:11px}
.card b{display:block;font-size:16px}
.card span{font-size:12px;color:var(--dim)}
@keyframes chipIn{from{opacity:0;transform:translateX(-12px)}}
@keyframes chipOut{to{opacity:0}}
@keyframes cardIn{from{opacity:0;transform:translateX(20px)}}
@keyframes pulse{50%{opacity:.55}}
/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;background:rgba(8,5,12,.86);z-index:20;display:flex;align-items:center;justify-content:center}
.ov[hidden]{display:none}
.sleep{width:min(560px,92vw);text-align:center}
.sleep h2{font-size:34px;letter-spacing:.2em;color:var(--gold-hi);margin:6px 0;min-height:44px}
.sleep .big{height:14px}
.sleep .lv{font-size:20px;margin:8px 0}
.sleep .learned{color:var(--dim);font-size:13px;margin:10px 0;line-height:1.7}
.sleep .got{margin:8px 0;font-size:15px}
.sleep .btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.sleep .btns button{padding:9px 20px;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
.sleep .btns button.primary{border-color:var(--gold);color:var(--gold-hi)}
.sleep .hint{font-size:11px;color:var(--dim);margin-top:10px}
.flyer{position:absolute;z-index:30;width:16px;height:20px;transition:all .7s cubic-bezier(.5,0,.2,1)}
/* ---------- board（秘孔盤ふう: 能力ごとの盤を入れ替える。2026-10-30 オーナー指示） ---------- */
.board{position:absolute;inset:0;z-index:15;background:#120d17;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto auto}
.board[hidden]{display:none}
.bhead{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:13px}
.bhead .sp{flex:1}
.bhead .bar{max-width:260px}
.bhead button,.bfoot button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px}
.btabs{grid-column:1/3;display:flex;gap:6px;padding:6px 12px;align-items:stretch}
.btab{flex:1;display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;text-align:left;position:relative}
.btab.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--panel2)}
.btab .t{display:flex;align-items:center;gap:6px;font-size:12px}
.btab .pg{height:4px;background:#0b0810;border-radius:2px;overflow:hidden}
.btab .pg i{display:block;height:100%;background:var(--c)}
.btab .dot{position:absolute;right:4px;top:3px}
.bsvg{min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
.bsvg svg{width:100%;height:100%;max-height:100%}
.bdetail{min-height:0;overflow:auto;padding:8px 12px 8px 4px;display:flex;flex-direction:column;gap:8px}
.emb{position:relative;flex:0 0 auto;height:150px;border:2px solid var(--c);border-radius:6px;overflow:hidden;
  background:radial-gradient(ellipse at 70% 40%,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%),linear-gradient(135deg,#2b2235,#120d17)}
.emb .big{position:absolute;right:14px;top:-6px;font-size:120px;font-weight:900;color:var(--c);opacity:.85;line-height:1.1;text-shadow:0 0 18px color-mix(in srgb,var(--c) 70%,transparent)}
.emb .ttl{position:absolute;left:12px;top:10px;font-size:13px;color:var(--gold-hi);background:rgba(0,0,0,.45);padding:2px 8px;border-radius:3px}
.emb .art{position:absolute;left:12px;bottom:8px;font-size:11px;color:var(--dim)}
.dtext{font-size:13px;line-height:1.6}
.dtext h4{margin:0;font-size:16px}
.dtext small{color:var(--dim)}
.bcur{grid-column:1/3;display:flex;flex-wrap:wrap;gap:14px;padding:6px 12px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.bcur .z{color:var(--dim)}
.bfoot{grid-column:1/3;border-top:1px solid var(--line);padding:6px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bfoot .sp{flex:1}
.bfoot button.primary{border-color:var(--gold);color:var(--gold-hi)}
.bfoot button:disabled{opacity:.4;cursor:default}
.node{cursor:pointer}
.node text{pointer-events:none;font-family:var(--font)}
.legend{font-size:11px;color:var(--dim)}
@keyframes blink{50%{stroke-opacity:.25}}
.can{animation:blink 1.1s infinite}
/* ---------- feel (炭焼き) ---------- */
.feel{width:min(640px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.feel h3{margin:0 0 6px;color:var(--gold)}
.track{position:relative;height:42px;background:#0b0810;border:1px solid var(--line);border-radius:6px;margin:16px 0 6px;overflow:hidden}
.track .base{position:absolute;top:0;bottom:0;background:rgba(239,233,244,.18);border-left:1px solid #fff;border-right:1px solid #fff}
.track .ext{position:absolute;top:0;bottom:0;background:var(--sense);opacity:.55}
.track .needle{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--gold-hi);box-shadow:0 0 6px var(--gold-hi)}
.track .ghost{position:absolute;top:0;bottom:0;width:10px;background:linear-gradient(90deg,transparent,var(--technique));opacity:.6}
.feel .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feel button{padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
.feel button.primary{border-color:var(--gold);color:var(--gold-hi)}
.feel .res{min-height:22px;font-size:13px;margin-top:6px}
.cap{position:absolute;z-index:40;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,15,26,.97);border:1px dashed var(--gold);
  border-radius:8px;padding:8px 14px;max-width:min(560px,92vw);font-size:13px;line-height:1.5}
.cap[hidden]{display:none}
/* 盤を開いている間は下の帯（決定ボタン）と重ならないよう上に出す。844×390 で重なった反省 */
#app.boardopen .cap{bottom:auto;top:96px}
/* 案内文は文字の部分ではタップを素通りさせ、下の札やボタンを塞がない（ボタンだけ押せる） */
.cap{pointer-events:none}.cap button{pointer-events:auto}
.cap button{margin-left:8px;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.ring-pulse{outline:2px dashed var(--gold);outline-offset:3px;animation:pulse 1s infinite}
/* ---------- narrow ---------- */
@media (max-width:720px),(max-height:460px){
  .map{grid-template-columns:1fr 210px;padding-top:86px}
  .hud .rows{min-width:170px}
  .emb{height:84px}.emb .big{font-size:72px}.emb .art{display:none}
  .btab .t span.n{display:none}
  .bhead{padding:3px 10px}.btabs{padding:3px 10px}.bcur,.bfoot{padding:3px 10px}
}
/* スマホ横（高さが低い）: 見出しと札を1行、所持数と操作を1行にまとめて盤を大きくする */
@media (max-height:460px) and (min-width:621px){
  .board{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .bhead{grid-column:1;grid-row:1;border-bottom:1px solid var(--line)}
  .bhead .bar,.bhead>span[style]{display:none}
  .btabs{grid-column:2;grid-row:1;border-bottom:1px solid var(--line);gap:3px}
  .btab{padding:2px 4px}.btab .t{font-size:11px;gap:2px}
  .bsvg{grid-row:2;padding:2px}.bdetail{grid-row:2}
  .bcur{grid-column:1;grid-row:3;gap:8px;font-size:12px}
  .bfoot{grid-column:2;grid-row:3;gap:6px}.bfoot .legend{display:none}
  .bfoot button{padding:5px 8px}
}
@media (max-width:620px){
  .map{grid-template-columns:1fr;grid-template-rows:1fr 180px}
  .board{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr) auto auto auto}
  .bhead,.btabs,.bcur,.bfoot{grid-column:1}
  .bdetail{padding:0 10px;max-height:260px}
}
</style>
</head>
<body>
<div id="app">
  <div class="hud" id="hud"></div>
  <div class="respec-band" id="respecBand" hidden>組み直し：最初の行動まで</div>
  <div class="topright">
    <button class="icon-btn" id="radarBtn" title="ステータス（五角形）／盤"></button>
    <button class="icon-btn" title="LIME（未読の例）">LIME<span class="badge lime">2</span></button>
    <button class="icon-btn menu" id="menuBtn">MENU</button>
  </div>
  <div class="map" id="map">
    <div class="spots" id="spots"></div>
    <div class="side">
      <h3>モックの操作</h3>
      <div class="devrow">
        <button id="sleepBtn" class="primary">家に帰って寝る</button>
        <button id="feelBtn">炭焼きを試す（効果の実感）</button>
      </div>
      <div class="devrow">
        <button data-dev="exp">+EXP 500</button>
        <button data-dev="tourn">大会を終える（限定の火種）</button>
        <button data-dev="chapter">次の章へ（輪が開く）</button>
        <button data-dev="mid">中央の大会前（Lv.9・火種8）</button>
        <button data-dev="reset">最初から</button>
      </div>
      <label class="legend"><input type="checkbox" id="addenda"> 追加要件の札も盤に重ねる（修行・色ロックの仮置き）</label>
      <label class="legend"><input type="checkbox" id="redDot"> 未使用の火種を「赤丸」で出す（既定は火の色）</label>
      <h3>記録</h3>
      <div class="log" id="log"></div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="cards" id="cards"></div>

  <div class="ov" id="sleepOv" hidden><div class="sleep" id="sleepBox"></div></div>

  <div class="board" id="board" hidden>
    <div class="bhead" id="bhead"></div>
    <div class="btabs" id="btabs"></div>
    <div class="bsvg"><svg id="bsvg" viewBox="-50 -50 520 520" role="img" aria-label="心得の盤"></svg></div>
    <div class="bdetail" id="bdetail"></div>
    <div class="bcur" id="bcur"></div>
    <div class="bfoot" id="bfoot"></div>
  </div>

  <div class="ov" id="feelOv" hidden><div class="feel" id="feelBox"></div></div>
  <div class="cap" id="cap" hidden></div>
</div>

<script>
"use strict";
// ======================= SPEC の数値 =======================
const KEYS=["technique","sense","guts","charm","insight"];
const JA={technique:"技術",sense:"センス",guts:"根性",charm:"魅力",insight:"洞察"};
const K1={technique:"技",sense:"感",guts:"根",charm:"魅",insight:"察"};
const LETTER={technique:"T",sense:"S",guts:"G",charm:"C",insight:"I"};
// 2.1: 時計回りに 技術→センス→洞察→魅力→根性
const ANG={technique:-90,sense:-18,insight:54,charm:126,guts:198};
const M=[1,1.25,1.5,1.75,2]; // 章倍率
const need=L=>200+5*L;       // 1.5
const RING_STAT=[0,4,2,1,1,1]; // 各輪の各色の能力ノード数
const RANK={technique:["見習い","様になってきた","一人前","職人肌","神業"],sense:["ふつう","光るものがある","冴えてる","唯一無二","天才肌"],
  guts:["三日坊主","粘り気味","へこたれない","不屈","鋼メンタル"],charm:["影うすい","親しみやすい","華がある","目が離せない","カリスマ"],
  insight:["鈍め","気が利く","よく見てる","見抜く目","千里眼"]};
const TIER={ // 3.7
 technique:["まだゲージは速い","ゲージがほんの少しゆっくりに","ゲージが少しゆっくりに","ゲージがゆっくりに","ゲージがだいぶゆっくりに","ゲージがかなりゆっくりに","針の動きがよく見える","ゲージがとてもゆっくりに","ほとんど止まって見える","ゲージが最もゆっくりに"],
 sense:["ジャスト帯は狭め","ジャスト帯がほんの少し広く","ジャスト帯が少し広く","ジャスト帯が広く","ジャスト帯がだいぶ広く","ジャスト帯がかなり広く","いい瞬間を掴みやすい","ジャスト帯がとても広く","外す方が難しい","ジャスト帯が最も広く"],
 guts:["体力はふつう・小さな範囲の弾を消す","体力が少し増えた","体力が増え、弾消しの範囲が広がった","疲れにくくなった","弾消しでメンタルも回復する","体力と範囲が大きく増えた","弾消しがかなり広い","一日中動いてもへこたれない","体力ほぼ最大・弾消しがとても広い","体力最大・画面全体の弾消し"],
 charm:["指名ボーナスはまだなし","指名ボーナスが少しつく","指名ボーナス＋少し好かれやすく","指名が増えてきた","指名ボーナス増・好かれやすい","常連に覚えられてきた","指名ボーナス大","好かれやすい","指名が途切れない","指名ボーナス最大"],
 insight:["配合も炭も、まだ勘だのみ","炭の気配がかすかに分かる","配合の相性ヒントが出るように","蒸らしの弾が少し減った","黄金比まで何を足すか分かる","炭の気配に早めに気づける","蒸らしの読みが当たってきた","熱の読み違いがかなり減った","炭も配合も、ほとんど読める","読めるものは全部読める"]};
const WHERE={technique:"穴あけ・吸い出し",sense:"穴あけ・炭焼き・吸い出し",guts:"体力・蒸らし",charm:"バイト・好感度",insight:"配合・炭焼き・蒸らし"};
// 段ごとに「新しくできること」が増える段（3.4〜3.6 の ○ の入口）。評価で見通しの印に使う

// 能力ごとに1枚、計5枚の盤を入れ替える。各盤は 7×7 の格子で、段のノード（2〜9段）が外側から渦を巻いて中央へ向かい、
// 中央の大きなノードが10段（第5輪）。その色のスキルは、同じ輪の段から枝分かれした位置に置く（2色のスキルは両方の盤に出る）。
// 取れる条件は SPEC 2.2 の玉方式のまま（輪・火種・段の順）。線は段の順と所属を見せる飾りで、つながっていなくても取れる。
function pol(a,r){const t=a*Math.PI/180;return [Math.cos(t)*r,Math.sin(t)*r];}
const LADDER=[[1,5],[1,3],[1,1],[3,1],[5,1],[5,3],[5,5],[3,5],[3,3]]; // 2段→10段
const SLOT={1:[0,3],2:[6,2],3:[6,5],4:[3,6.2]};
function buildNodes(){
  const n=[];
  for(const k of KEYS){let step=2;for(let ring=1;ring<=5;ring++)for(let i=0;i<RING_STAT[ring];i++){
    n.push({id:LETTER[k]+(step-1),kind:"stat",stat:k,step,ring,cost:1});step++;}}
  for(const [id,name,colors,ring,cost,fx,scene] of SKILLS)n.push({id,kind:"skill",name,colors,ring,cost,fx,scene});
  return n;
}
const NODES=buildNodes();
// 追加要件の札（仮）: ADDENDUM-0035 修行で開く／0042 色ロック。形と数は第二弾の詳細設計で決まる。見え方の評価用に3つだけ置く

 {id:"X-train",kind:"extra",lock:"train",board:"technique",gx:4,gy:2.6,ring:2,cost:2,label:"修行",desc:"（仮）スミさんの修行で開く技。修行を終えると火種で取れる"},

 {id:"X-color2",kind:"extra",lock:"color",color:"charm",board:"charm",gx:4,gy:2.6,ring:3,cost:1,label:"みんと",desc:"（仮）みんとの火種でしか開かない（好感度MAXでもらう）"}];
function boardOf(k){ // その盤に並ぶノードと格子の位置
  const out=NODES.filter(n=>n.kind==="stat"&&n.stat===k).map((n,i)=>({n,gx:LADDER[i][0],gy:LADDER[i][1]}));
  for(const n of NODES.filter(n=>n.kind==="skill"&&n.colors.includes(k))){const [gx,gy]=SLOT[n.ring];out.push({n,gx,gy});}
  return out;
}
/** 五角形の各軸＝その盤の進捗度（解放した火種÷盤の火種の合計。スキルを含む） */
function progress(k,owned=S.owned){const ns=boardOf(k).map(b=>b.n);const tot=ns.reduce((a,n)=>a+n.cost,0);
  return ns.filter(n=>owned.has(n.id)).reduce((a,n)=>a+n.cost,0)/tot;}

function stepOf(k,owned=S.owned){let s=1;for(const n of NODES)if(n.kind==="stat"&&n.stat===k&&owned.has(n.id))s=Math.max(s,n.step);return s;}

function freshMult(key){const c=(S.freshCount[key]||0)+1;return c<=2?1:c===3?.8:c===4?.6:.4;}
function gainExp(amount,{boost=true,label=""}={}){
  let v=amount*M[S.chapter-1];let w="";
  if(boost&&S.boost.left>0){v*=S.boost.mult;w=` 追い風×${S.boost.mult}`;}
  v=Math.round(v);S.exp+=v;S.today.sum=(S.today.sum||0)+v;
  return {v,w};
}
function doAction(sp){
  if(S.slot>=2){toast("今日はもう動けない。家に帰って寝よう");return;}
  if(S.respecOpen){S.respecOpen=false;log("最初の行動をしたので、この章の組み直しは閉じた");}
  const parts=[];const mult=freshMult(sp.key);
  const base=gainExp(30*mult);let lbl=`EXP +${base.v}`;if(mult<1)lbl+=" <em>（なじみ）</em>";if(base.w)lbl+=` <span class="w">${base.w}</span>`;parts.push(lbl);
  S.freshCount[sp.key]=(S.freshCount[sp.key]||0)+1;
  if(!S.firsts.has(sp.key)){S.firsts.add(sp.key);const f=gainExp(40);parts.push(`はじめて +${f.v}${f.w?` <span class="w">${f.w}</span>`:""}`);}
  const reads=S.readCount[sp.key]||0;
  if(reads<3&&S.freshCount[sp.key]<=3){S.readCount[sp.key]=reads+1;const r=gainExp(20);parts.push(`${sp.spot?"場面":"会話"}を読んだ +${r.v}`);}
  if(!sp.spot&&sp.id!=="sumi"){S.affPts[sp.key]=(S.affPts[sp.key]||0)+1;if(S.affPts[sp.key]%2===0){const a=gainExp(30);parts.push(`仲が深まった +${a.v}`);}}
  if(S.boost.left>0){S.boost.left--;if(!S.boost.left)S.boost.mult=1;}
  S.today[sp.key]=(S.today[sp.key]||0)+base.v;
  S.slot++;S.stamina=Math.max(0,S.stamina-sp.stamina);
  parts.forEach((p,i)=>setTimeout(()=>chip(p),i*260));
  log(`${S.day}日目: ${sp.label} → ${parts.map(p=>p.replace(/<[^>]+>/g,"")).join("／")}`);
  // スロット（1章30回転・ペカ合算 約1/9.4 を雑に再現）
  const r=Math.random();
  if(r<1/9.4){const big=Math.random()<.6;addBoost(big?1.5:1.5,big?5:3,big?"BIG":"REG");}
  else if(r<1/9.4+.12){addBoost(1.25,Math.random()<.5?1:2,"小役");}
  render();
}
function addBoost(mult,n,role){const before=S.boost.left;S.boost.mult=Math.max(S.boost.mult,mult);S.boost.left=Math.min(10,S.boost.left+n);
  setTimeout(()=>card({c:"var(--sense)",k:"P",top:"PAKKI SLOT",main:`追い風 ×${S.boost.mult}`,sub:before?`あと${before} → あと${S.boost.left}`:`あと${S.boost.left}回 経験値の入りが増える`}),900);
  log(`スロット ${role}: 追い風 ×${S.boost.mult} あと${S.boost.left}`);}

function lvProgress(){ // 精算済みレベル S.lv に対する、ゲージの中身
  let lv=S.lv,acc=0;for(let L=1;L<lv;L++)acc+=need(L);
  const inLv=S.exp-acc, settledIn=Math.min(S.settled-acc,need(lv));
  let over=0,lvs=0,x=inLv;let L=lv;while(L<80&&x>=need(L)){x-=need(L);L++;lvs++;}
  return {lv,inLv,settledIn:Math.max(0,settledIn),need:need(lv),lvs,over:x};
}
function radarSvg(size=34,owned=S.owned){ // 五角形＝各盤の進捗度（2026-10-30 オーナー指示）
  const c=size/2,pts=KEYS.map(k=>{const [x,y]=pol(ANG[k],2+(c-4)*progress(k,owned));return `${c+x},${c+y}`;}).join(" ");
  const out=KEYS.map(k=>{const [x,y]=pol(ANG[k],c-2);return `${c+x},${c+y}`;}).join(" ");
  const mid=KEYS.map(k=>{const [x,y]=pol(ANG[k],(c-2)/2);return `${c+x},${c+y}`;}).join(" ");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><polygon points="${out}" fill="none" stroke="#7a6236"/><polygon points="${mid}" fill="none" stroke="#4a3d58"/><polygon points="${pts}" fill="rgba(232,194,122,.55)" stroke="#ffe2a6" stroke-width="1"/></svg>`;
}

let skipAnim=false;
async function wait(ms){if(skipAnim)return;await new Promise(r=>setTimeout(r,ms));}
async function sleepFlow(){
  const ov=$("#sleepOv"),box=$("#sleepBox");ov.hidden=false;skipAnim=false;
  ov.onclick=()=>{skipAnim=true;};
  box.innerHTML=`<p>ぐっすり眠って、体力が回復した</p>`;await wait(900);
  const p=lvProgress();

  if(p.lvs>0){
    const from=S.lv,gained={any:0};let milestone=null;
    box.innerHTML=`<h2 id="lvTitle"></h2><div class="bar big"><i class="done" id="lvFill" style="width:${p.settledIn/p.need*100}%"></i></div>
      <div class="lv" id="lvText">Lv.${from}</div><div class="got" id="got"></div>
      <div class="learned">今日学んだこと：${learned.join("／")||"—"}</div><div class="btns" id="btns"></div><div class="hint">画面のどこかを押すと最後まで早送り</div>`;

    for(let i=0;i<p.lvs;i++){

      S.hidane.any++;gained.any++;
      if(S.lv%10===0&&S.lv<=70){const k=milestoneColor();S.hidane[k]++;milestone=k;S.spent10={};}
      flyHidane(milestone);
      $("#lvFill").style.transition="none";$("#lvFill").style.width="0%";await wait(250);
    }
    $("#lvFill").style.transition=skipAnim?"none":"width .4s";$("#lvFill").style.width=`${x/need(S.lv)*100}%`;
    $("#got").innerHTML=`<span class="flame"></span> 火種 ＋${gained.any+(milestone?1:0)}`+(milestone?`<br><span style="color:var(--${milestone})">節目のレベル！ 火種がもうひとつ（${K1[milestone]}の火種）— この10レベルで一番伸ばした${JA[milestone]}の火種</span>`:"");
    S.settled=S.exp;S.today={};
    log(`寝る: Lv.${from}→Lv.${S.lv}・火種＋${gained.any+(milestone?1:0)}`);
    const first=!S.tutorial.board;
    $("#btns").replaceChildren(h("button",{class:"primary",text:"盤を開く",onclick:e=>{e.stopPropagation();ov.hidden=true;nextDay();openBoard({tutorial:first});}}),
      h("button",{text:"あとで",onclick:e=>{e.stopPropagation();ov.hidden=true;nextDay();if(first)caption("火種はたまったまま持ち越せる。盤は右上の五角形かMENUから開ける。",[["わかった",()=>hideCap()]],"#radarBtn");}}));
  }else{
    S.settled=S.exp;S.today={};
    box.innerHTML=`<p>今夜はレベルは上がらなかった。</p><div class="bar big"><i class="done" style="width:${p.inLv/p.need*100}%"></i></div><div class="lv">Lv.${S.lv}　あと ${p.need-p.inLv}</div>`;
    await wait(1100);ov.hidden=true;nextDay();log(`寝る: レベルは上がらず（あと${p.need-p.inLv}）`);
  }
  render();
}

function flyHidane(color){const r=$("#hud").getBoundingClientRect();const f=h("div",{class:"flyer"},[h("span",{class:"flame"+(color?" c-"+color:""),style:"width:16px;height:20px"})]);

function nodeState(n,owned,hid){
  if(owned.has(n.id))return "own";
  if(n.kind==="extra")return n.ring>ringsOpen()?"ring":n.lock==="train"?"train":"colorlock";
  if(n.ring>ringsOpen())return "ring";
  if(n.kind==="stat"&&stepOf(n.stat,owned)!==n.step-1)return "order";
  return payable(n,hid)?"can":"short";
}
function payable(n,hid){if(n.kind==="extra")return false;const cols=n.kind==="stat"?[n.stat]:n.colors;
  let lim=cols.reduce((a,k)=>a+hid[k],0);return lim+hid.any>=n.cost;}
function pay(n,hid,{forceAny=false}={}){const cols=n.kind==="stat"?[n.stat]:n.colors;let left=n.cost;const used={};
  if(!forceAny)for(const k of cols){const u=Math.min(hid[k],left);if(u){hid[k]-=u;used[k]=u;left-=u;}}
  const u=Math.min(hid.any,left);if(u){hid.any-=u;used.any=u;left-=u;}
  if(left>0){for(const k of cols){const v=Math.min(hid[k],left);if(v){hid[k]-=v;used[k]=(used[k]||0)+v;left-=v;}}}
  return used;}
function payText(used){return Object.entries(used).map(([k,v])=>k==="any"?`万能の火種${v}`:`${K1[k]}の火種${v}`).join("＋");}

  B=null;$("#board").hidden=true;$("#app").classList.remove("boardopen");hideCap();render();
}
function commit(){
  const ups=[];
  for(const p of B.pend){S.owned.add(p.id);S.paid[p.id]=p.used;const n=NODES.find(x=>x.id===p.id);
    const cols=n.kind==="stat"?[n.stat]:n.colors;cols.forEach(k=>S.spent10[k]=(S.spent10[k]||0)+n.cost/cols.length);
    ups.push(n);S.lastNode=n.id;}
  S.hidane=B.hid;const wasTut=B.tutorial;
  B=null;$("#board").hidden=true;$("#app").classList.remove("boardopen");hideCap();render();
  ups.forEach((n,i)=>setTimeout(()=>{
    if(n.kind==="stat")card({c:`var(--${n.stat})`,k:K1[n.stat],top:"STEP UP",main:`${JA[n.stat]} ${n.step}段`,sub:TIER[n.stat][n.step-1]});
    else card({c:`var(--${n.colors[0]})`,k:"技",top:"SKILL",main:n.name,sub:n.fx});
  },i*400));
  log(`盤で決定: ${ups.map(n=>n.kind==="stat"?`${JA[n.stat]}${n.step}段`:n.name).join("、")||"なし"}`);
  if(wasTut&&ups.length){const n=ups.find(u=>u.kind==="stat")||ups[0];
    setTimeout(()=>caption(n.kind==="stat"?`${JA[n.stat]}が${n.step}段になった。${TIER[n.stat][n.step-1]}。作りの画面では、効いているところがこの色で光る。`:`${n.name}を覚えた。${n.fx}。`,
      [["試してみる",()=>{hideCap();openFeel(n.kind==="stat"?n.stat:"sense",true);}],["あとで",()=>hideCap()]]),1200);}
}
function drawBoard(){
  const own=B.owned,hid=B.hid,k=B.k;const pendIds=new Set(B.pend.map(p=>p.id));const ownP=new Set([...own,...pendIds]);
  const extras=$("#addenda").checked?EXTRA.filter(x=>x.board===k):[];
  const cell=64,P=(v)=>v*cell;
  const items=[...boardOf(k),...extras.map(n=>({n,gx:n.gx,gy:n.gy}))];
  let g=`<rect x="-40" y="-40" width="${P(6)+80}" height="${P(6)+80}" rx="14" fill="#1a1420" stroke="var(--${k})" stroke-opacity=".5" stroke-width="2"/>
    <rect x="-30" y="-30" width="${P(6)+60}" height="${P(6)+60}" rx="10" fill="none" stroke="#4a3d58" stroke-dasharray="2 4"/>`;
  // 段の順の線（渦）: 両端とも解放済みなら能力色で太く
  const lad=items.filter(b=>b.n.kind==="stat");
  for(let i=0;i<lad.length-1;i++){const a=lad[i],b=lad[i+1];const lit=ownP.has(a.n.id)&&ownP.has(b.n.id);
    g+=`<line x1="${P(a.gx)}" y1="${P(a.gy)}" x2="${P(b.gx)}" y2="${P(b.gy)}" stroke="${lit?`var(--${k})`:"#4a3d58"}" stroke-width="${lit?5:3}" stroke-linecap="round"/>`;}
  // 入口（盤の外から最初の段へ）
  g+=`<line x1="${P(1)}" y1="${P(6.4)}" x2="${P(1)}" y2="${P(5)}" stroke="${ownP.has(lad[0].n.id)?`var(--${k})`:"#4a3d58"}" stroke-width="3" stroke-dasharray="4 3"/>`;
  // スキル・追加の札は、同じ輪の最初の段へ細い線（飾り）
  for(const b of items.filter(b=>b.n.kind!=="stat")){const to=lad.find(l=>l.n.ring===b.n.ring)||lad[0];
    g+=`<line x1="${P(b.gx)}" y1="${P(b.gy)}" x2="${P(to.gx)}" y2="${P(to.gy)}" stroke="#4a3d58" stroke-width="1.5" stroke-dasharray="3 3"/>`;}
  for(const {n,gx,gy} of items){
    const st=pendIds.has(n.id)?"pend":nodeState(n,ownP,hid);const sel=B.sel===n.id;
    const center=n.kind==="stat"&&n.step===10;
    const col=n.kind==="stat"?`var(--${n.stat})`:n.kind==="skill"?`var(--${n.colors[0]})`:n.lock==="color"?`var(--${n.color})`:"var(--gold)";
    const col2=n.kind==="skill"&&n.colors[1]?`var(--${n.colors[1]})`:null;
    const r=center?34:n.kind==="stat"?17:20;
    const shape=n.kind==="stat"?`<circle r="${r}"`:`<polygon points="${[0,1,2,3,4,5].map(i=>pol(i*60-90,r).join(",")).join(" ")}"`;
    let fill="#140f19",stroke=col,sw=2.5,op=1,dash="",cls="";
    if(st==="own")fill=col;else if(st==="pend"){fill=col;op=.6;dash="4 3";}else if(st==="can"){cls="can";sw=4;}
    else if(st==="short"){sw=2;op=.9;}else if(st==="order"){stroke="#6b6274";op=.55;}else if(st==="ring"){stroke="#5a4a2a";op=.5;}
    else if(st==="train"||st==="colorlock"){dash="2 3";op=.85;}
    const lab=n.kind==="stat"?(center?"極":n.step):n.kind==="skill"?n.name.slice(0,2):n.label;
    g+=`<g class="node" data-id="${n.id}" transform="translate(${P(gx)},${P(gy)})" opacity="${op}">
      ${sel?`<circle r="${r+8}" fill="none" stroke="var(--gold-hi)" stroke-width="2.5"/>`:""}
      ${col2?`<polygon points="${[0,1,2,3,4,5].map(i=>pol(i*60-90,r+4).join(",")).join(" ")}" fill="none" stroke="${col2}" stroke-width="2.5"/>`:""}
      ${center?`<circle r="${r+6}" fill="none" stroke="${col}" stroke-opacity=".5" stroke-width="2"/>`:""}
      ${shape} class="${cls}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${dash?`stroke-dasharray="${dash}"`:""}/>
      <text y="${center?10:n.kind==="stat"?5:4}" font-size="${center?28:n.kind==="stat"?14:11}" font-weight="800" text-anchor="middle" fill="${st==="own"||st==="pend"?"#140f19":col}">${lab}</text>
      ${n.kind==="skill"?`<text y="${r+13}" font-size="10" text-anchor="middle" fill="var(--dim)">${["","","②","③","④"][n.cost]}</text>`:""}
      ${st==="ring"?`<text x="${r-4}" y="${-r+6}" font-size="12">🔒</text>`:""}
      ${n.kind==="stat"&&NEWTHING[n.stat]?.[n.step]&&st!=="own"?`<text x="${-r-2}" y="${-r+6}" font-size="13" fill="var(--gold-hi)">✦</text>`:""}
    </g>`;
  }
  $("#bsvg").innerHTML=g;
  $("#bsvg").querySelectorAll(".node").forEach(e=>e.onclick=()=>{B.sel=e.dataset.id;drawBoard();});
  // 上の帯: Lv・ゲージ・進捗の五角形
  const p=lvProgress();
  $("#bhead").innerHTML=`<span title="五角形＝各盤の進み具合">${radarSvg(40,ownP)}</span><b style="color:var(--gold-hi)">心得の盤</b><b>Lv.${S.lv}</b>
    <div class="bar"><i class="done" style="width:${Math.min(100,p.inLv/p.need*100)}%"></i></div><span style="color:var(--dim)">${p.lvs?"今夜 Lv UP":`次のLvまで EXP ${p.need-p.inLv}`}</span>
    <span class="sp"></span>${S.respecOpen?`<button id="respec">組み直す</button>`:""}<button id="help">？</button><button id="bclose">閉じる</button>`;
  $("#bclose").onclick=()=>closeBoard();
  $("#help").onclick=()=>alert("盤は能力ごとに5枚。札か ◀ ▶（Q／E）で入れ替える。\n数字＝その段になるノード、極＝10段（中央）\n● 塗り＝解放済み／明滅＝今取れる／縁だけ＝火種が足りない\n薄い灰＝下の段がまだ／🔒＝章で開く／✦＝新しくできることが増える段\n六角形＝スキル（下の②③④が火種の数）\n線は段の順の飾り。つながっていなくても取れる");
  if($("#respec"))$("#respec").onclick=()=>{if(!confirm("全部の火種が戻ります。組み直しますか？"))return;
    for(const id of B.owned){const u=S.paid[id]||{any:NODES.find(n=>n.id===id).cost};for(const[kk,v]of Object.entries(u))B.hid[kk]+=v;}B.owned=new Set();B.pend=[];drawBoard();};
  // 盤の札（入れ替え）
  $("#btabs").replaceChildren(...KEYS.map(kk=>{const pr=progress(kk,ownP);const can=boardOf(kk).some(b=>!pendIds.has(b.n.id)&&nodeState(b.n,ownP,hid)==="can");
    const t=h("button",{class:"btab"+(kk===k?" on":""),style:`--c:var(--${kk})`,onclick:()=>{B.k=kk;S.lastBoard=kk;B.sel=null;drawBoard();}});
    t.innerHTML=`<span class="t"><span class="kb">${K1[kk]}</span><span class="n">${JA[kk]}</span><span style="margin-left:auto">${stepOf(kk,ownP)}段・${Math.round(pr*100)}%</span></span><span class="pg"><i style="width:${pr*100}%"></i></span>${can?'<span class="dot flame" title="今取れるノードがある"></span>':""}`;return t;}));
  // 右の大きな説明（秘孔盤の右パネル）
  const sel=items.find(b=>b.n.id===B.sel)?.n||NODES.find(n=>n.kind==="stat"&&n.stat===k&&n.step===Math.min(10,stepOf(k,ownP)+1))||lad[lad.length-1].n;
  const st=pendIds.has(sel.id)?"pend":nodeState(sel,ownP,hid);
  const ecol=sel.kind==="stat"?sel.stat:sel.kind==="skill"?sel.colors[0]:(sel.color||k);
  let title,big,body;
  if(sel.kind==="stat"){title=sel.step===10?`極み・${JA[sel.stat]}`:`${JA[sel.stat]} ${sel.step}段`;big=K1[sel.stat];
    body=`<h4>${title}</h4><small>第${sel.ring}輪・火種1</small><br>${TIER[sel.stat][sel.step-1]}<br><small>効くところ：${WHERE[sel.stat]}</small>`+
     (NEWTHING[sel.stat]?.[sel.step]?`<br><span style="color:var(--gold-hi)">✦新しく「${NEWTHING[sel.stat][sel.step]}」</span>`:"")+
     (Math.ceil(sel.step/2)!==Math.ceil((sel.step-1)/2)?`<br><small>ランク名が「${RANK[sel.stat][Math.ceil(sel.step/2)-1]}」に</small>`:"");}
  else if(sel.kind==="skill"){title=sel.name;big=sel.name[0];body=`<h4>${sel.name}</h4><small>スキル・${sel.colors.map(c=>JA[c]).join("×")}・第${sel.ring}輪・火種${sel.cost}</small><br>${sel.fx}<br><small>効く場面：${sel.scene}</small>`;}
  else {title=sel.lock==="train"?"修行で開く":"キャラの火種";big=sel.lock==="train"?"修":sel.label[0];body=`<h4>${sel.lock==="train"?"修行で開くノード（仮）":`${sel.label}の火種のノード（仮）`}</h4><small>火種${sel.cost}</small><br>${sel.desc}`;}
  const tag={own:"解放済み",pend:"仮置き中",ring:`第${sel.ring}章で開く`,order:"先に下の段が要る",short:`火種が${sel.cost}つ要る。貯めてから取れる`,train:"修行がまだ",colorlock:"そのキャラの火種がない"}[st];
  let payLine="";if(st==="can"){const tmp={...hid};payLine=`<br><small>${payText(pay(sel,tmp,{forceAny:B.forceAny}))}で払う</small>`;}
  $("#bdetail").innerHTML=`<div class="emb" style="--c:var(--${ecol})"><span class="ttl">${title}</span><span class="big">${big}</span><span class="art">（ここに一枚絵：素材の依頼は REPORT 7章）</span></div>
    <div class="dtext">${body}${tag?`<br><small style="color:var(--amber)">${tag}</small>`:""}${payLine}</div>`;
  // 下: 火種の所持（色別）
  $("#bcur").innerHTML=`<span><span class="flame"></span> 万能×${hid.any}</span>`+KEYS.map(kk=>`<span class="${hid[kk]?"":"z"}"><span class="flame c-${kk}"></span> ${K1[kk]}×${hid[kk]}</span>`).join("")+
    ($("#addenda").checked?`<span class="z">キャラの火種×0</span>`:"")+(B.pend.length?`<span style="color:var(--dim)">（仮置き ${B.pend.length}）</span>`:"");
  // 下: 操作
  const canPlace=st==="can",isPend=st==="pend";
  $("#bfoot").innerHTML="";
  const prev=h("button",{text:"◀",title:"前の盤（Q）",onclick:()=>switchBoard(-1)}),next=h("button",{text:"▶",title:"次の盤（E）",onclick:()=>switchBoard(1)});
  const place=h("button",{text:isPend?"取り消す":"仮置きする",onclick:()=>{
    if(isPend){const i=B.pend.findIndex(q=>q.id===sel.id);const later=B.pend.slice(i);for(const q of later.reverse()){for(const[kk,v]of Object.entries(q.used))B.hid[kk]+=v;}B.pend=B.pend.slice(0,i);}
    else{const used=pay(sel,B.hid,{forceAny:B.forceAny});B.pend.push({id:sel.id,used});}
    B.sel=sel.id;drawBoard();}});
  if(!(canPlace||isPend))place.disabled=true;
  const anyT=h("label",{class:"legend"},[]);anyT.innerHTML=`<input type="checkbox" ${B.forceAny?"checked":""}> 万能を使う`;anyT.querySelector("input").onchange=e=>{B.forceAny=e.target.checked;drawBoard();};
  const ok=h("button",{class:"primary",text:"決定して閉じる",onclick:()=>commit()});
  $("#bfoot").append(prev,h("span",{class:"legend",text:"盤の入れ替え"}),next,h("span",{class:"sp"}),anyT,place,ok);
}
function switchBoard(d){const i=KEYS.indexOf(B.k);B.k=KEYS[(i+d+5)%5];S.lastBoard=B.k;B.sel=null;drawBoard();}
document.addEventListener("keydown",e=>{if(!B||$("#board").hidden)return;if(e.key==="q"||e.key==="ArrowLeft")switchBoard(-1);if(e.key==="e"||e.key==="ArrowRight")switchBoard(1);});

// ======================= 効果の実感: 炭焼きの取り出し（7.3 の色付け込み） =======================
let feelTimer=null;
function openFeel(stat="sense",fromTut=false){
  const ov=$("#feelOv");ov.hidden=false;const box=$("#feelBox");
  const s=stepOf("sense"),t=stepOf("technique");
  box.innerHTML=`<h3>炭焼きの取り出し（モック）</h3>
   <div style="font-size:12px;color:var(--dim)">ジャスト帯で「取る」。白枠＝素の帯、<span style="color:var(--sense)">水色＝センスで広がった分</span>。針の残像が<span style="color:var(--technique)">金</span>なら技術でゆっくり（本当の炭焼きは技術を読まない：比較用）。</div>
   <div class="row" style="margin-top:8px">
     <label>センス <select id="fs">${Array.from({length:10},(_,i)=>`<option ${i+1===s?"selected":""}>${i+1}</option>`).join("")}</select>段</label>
     <label>技術 <select id="ft">${Array.from({length:10},(_,i)=>`<option ${i+1===t?"selected":""}>${i+1}</option>`).join("")}</select>段</label>
     <label><input type="checkbox" id="fcol" checked> 能力の効き目を色で表示</label>
   </div>
   <div class="track" id="track"><div class="base" id="fbase"></div><div class="ext" id="fextL"></div><div class="ext" id="fextR"></div><div class="ghost" id="fghost"></div><div class="needle" id="fneedle"></div></div>
   <div class="row"><button class="primary" id="ftake">取る（Space）</button><button id="fbefore">1段と今を並べて試す</button><span class="sp" style="flex:1"></span><button id="fclose">閉じる</button></div>
   <div class="res" id="fres"></div><div class="legend" id="fstat"></div>`;
  let hits=0,tries=0,pos=0,dir=1,lastT=performance.now();
  const layout=()=>{const S1=+$("#fs").value,T1=+$("#ft").value;const tS=(S1-1)/9,tT=(T1-1)/9;
    const W=$("#track").clientWidth;const base=W*0.11;const full=base*(1+.45*tS);const c=W*.62;
    const show=$("#fcol").checked&&S1>1;
    Object.assign($("#fbase").style,{left:(c-base/2)+"px",width:base+"px"});
    Object.assign($("#fextL").style,{left:(c-full/2)+"px",width:show?((full-base)/2)+"px":"0"});
    Object.assign($("#fextR").style,{left:(c+base/2)+"px",width:show?((full-base)/2)+"px":"0"});
    $("#fghost").style.display=$("#fcol").checked&&T1>1?"block":"none";
    return {c,full,W,speed:W/1.6/(1+.18*tT)};};
  let L=layout();["#fs","#ft","#fcol"].forEach(q=>$(q).onchange=()=>{L=layout();});
  cancelAnimationFrame(feelTimer);
  const tick=now=>{const dt=(now-lastT)/1000;lastT=now;pos+=dir*L.speed*dt;if(pos>L.W-3){pos=L.W-3;dir=-1;}if(pos<0){pos=0;dir=1;}
    $("#fneedle").style.left=pos+"px";$("#fghost").style.left=(pos-10*dir)+"px";feelTimer=requestAnimationFrame(tick);};
  feelTimer=requestAnimationFrame(tick);
  const take=()=>{tries++;const ok=Math.abs(pos-L.c)<=L.full/2;if(ok)hits++;$("#fres").innerHTML=ok?`<b style="color:var(--good)">ジャスト！</b>`:`<span style="color:var(--amber)">${pos<L.c?"早い":"遅い"}</span>`;
    $("#fstat").textContent=`${hits}/${tries} 成功（帯の幅：素の ×${(1+.45*(+$("#fs").value-1)/9).toFixed(2)}　針の速さ：×${(1/(1+.18*(+$("#ft").value-1)/9)).toFixed(2)}）`;};
  $("#ftake").onclick=take;
  document.onkeydown=e=>{if(!ov.hidden&&e.code==="Space"){e.preventDefault();take();}};
  $("#fbefore").onclick=()=>{const cur=+$("#fs").value;$("#fs").value=1;L=layout();$("#fres").textContent="1段の帯。もう一度押すと今の段に戻る";
    $("#fbefore").onclick=()=>{$("#fs").value=cur;L=layout();$("#fres").textContent=`${cur}段の帯`;};};
  $("#fclose").onclick=()=>{cancelAnimationFrame(feelTimer);ov.hidden=true;document.onkeydown=null;};
}

// ======================= キャプション（チュートリアルの雰囲気だけ） =======================
function caption(text,buttons=[],targetSel){const c=$("#cap");c.hidden=false;c.innerHTML="";c.append(h("span",{text}));
  for(const[l,f]of buttons)c.append(h("button",{text:l,onclick:f}));
  document.querySelectorAll(".ring-pulse").forEach(e=>e.classList.remove("ring-pulse"));if(targetSel)$(targetSel)?.classList.add("ring-pulse");}
function hideCap(){$("#cap").hidden=true;document.querySelectorAll(".ring-pulse").forEach(e=>e.classList.remove("ring-pulse"));}

// ======================= 開発用 =======================
function dev(k){
  if(k==="exp"){S.exp+=500;log("EXP +500（開発用）");}
  if(k==="tourn"){const best=KEYS[Math.floor(Math.random()*KEYS.length)];S.hidane[best]++;
    S.exp+=Math.round((100+200+150)*M[S.chapter-1]);card({c:`var(--${best})`,k:K1[best],top:"大会の火種",main:`${K1[best]}の火種`,sub:`いちばん良かったのは${{technique:"穴あけ",sense:"炭焼き",guts:"蒸らし",charm:"提供後の調整",insight:"完成品"}[best]}`});log(`大会: ${K1[best]}の火種＋1・EXP+${Math.round(450*M[S.chapter-1])}（章末の精算は寝る時にまとめた扱い）`);}
  if(k==="chapter"){if(S.chapter<5){S.chapter++;S.day=1;S.slot=0;S.freshCount={};S.respecOpen=true;
    card({c:"var(--gold)",k:"盤",top:"RING OPEN",main:`心得の盤 第${S.chapter}輪が開いた`,sub:"最初の行動までは盤を組み直せる"});log(`第${S.chapter}章へ。第${S.chapter}輪が開いた・組み直しは最初の行動まで`);}}
  if(k==="mid"){S=fresh();S.day=13;let acc=0;for(let L=1;L<9;L++)acc+=need(L);S.exp=S.settled=acc+120;S.lv=9;S.hidane.any=8;S.tutorial.board=true;
    ["tsumugi","naru","adam","kannon"].forEach(x=>{S.firsts.add(x);S.freshCount[x]=3;});log("中央の遊び方・第1章大会前の状態（Lv.9・火種8・未使用）");}
  if(k==="reset"){S=fresh();log("最初から");}
  render();
}
document.querySelectorAll("[data-dev]").forEach(b=>b.onclick=()=>dev(b.dataset.dev));
$("#sleepBtn").onclick=()=>sleepFlow();
$("#feelBtn").onclick=()=>openFeel();
$("#radarBtn").onclick=()=>openBoard();
$("#menuBtn").onclick=()=>openBoard();
$("#addenda").onchange=()=>{if(B)drawBoard();};
$("#redDot").onchange=()=>render();
S=fresh();render();log("第1章1日目。行き先を押すと経験値が入る（1日2回）。寝るとレベルアップの精算。");
</script>
