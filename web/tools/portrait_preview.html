<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portrait Preview</title>
<link rel="stylesheet" href="../css/style.css?v=20260628-portrait">
<style>
html, body { background: #000; }
#vn-bg { background-image: url("../../assets/backgrounds/bg_tonari_inside_day.png"); }
#vn-choices { display: flex; }
#preview-controls {
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 80;
  display: flex;
  gap: 8px;
}
#preview-controls select {
  min-width: 150px;
  padding: 8px 12px;
  color: #f4ecd6;
  background: rgba(14, 8, 22, 0.94);
  border: 1px solid rgba(244, 210, 122, 0.7);
  border-radius: 4px;
  font: 15px/1.2 sans-serif;
}
</style>
</head>
<body>
<div id="game">
  <div id="preview-controls">
    <select id="preview-character" aria-label="キャラクター"></select>
    <select id="preview-face" aria-label="表情"></select>
  </div>
  <section id="screen-dialogue" class="screen active">
    <div id="vn-bg"></div>
    <div id="vn-cg"></div>
    <div id="vn-portraits">
      <img id="preview-portrait" class="portrait pos-center active" data-speaker="sumi"
           src="../../assets/sprites/characters/sumi/chr_sumi_normal.png"
           style="--portrait-anchor-x:-51.45%;">
    </div>
    <div id="vn-click-layer"></div>
    <div id="vn-choices">
      <button class="choice-btn">出ます。なんか、いける気がするんで</button>
      <button class="choice-btn">……ちなみに、相手ってどんな人たちです？</button>
    </div>
    <div id="vn-box">
      <span class="corner-tl"></span><span class="corner-br"></span>
      <div id="vn-name" style="display:none"></div>
      <div id="vn-text">スミさんは何か言いかけて、やめた。<br>グラスを置く音だけが、静かに響いた。</div>
      <div id="vn-advance">▼</div>
      <div id="vn-tools">
        <button class="vn-tool" type="button">AUTO</button>
        <button class="vn-tool" type="button">SKIP</button>
        <button class="vn-tool" type="button">LOG</button>
        <button class="vn-tool" type="button">MENU</button>
      </div>
    </div>
  </section>
</div>
<script src="../js/data.js?v=20260628-portrait"></script>
<script>
const presets = {
  baseline: { target: 132, sink: 35 },
  closeup: { target: 138, sink: 41 },
};
const mode = new URLSearchParams(location.search).get("framing") === "baseline" ? "baseline" : "closeup";
const framing = presets[mode];
const portrait = document.querySelector("#preview-portrait");
const characterSelect = document.querySelector("#preview-character");
const faceSelect = document.querySelector("#preview-face");
const portraits = window.GAME_DATA.portraits;
const trims = window.GAME_DATA.portrait_trims;
const characterNames = {
  adam: "アダム", ageha: "アゲハ", dr_kemuri: "Dr.ケムリ", maezono: "前園",
  mashiro: "ましろ", minto: "みんと", nagumo: "南雲", naru: "なる",
  packii: "パッキー", rin: "リン", ryuji: "竜二", sumi: "スミ", tsumugi: "つむぎ",
};

for (const id of Object.keys(characterNames)) {
  if (!portraits[id]) continue;
  const option = document.createElement("option");
  option.value = id;
  option.textContent = characterNames[id];
  characterSelect.appendChild(option);
}

function renderPortrait() {
  const id = characterSelect.value;
  const face = faceSelect.value;
  const trim = trims[id][face] || trims[id].normal;
  const target = id === "packii" ? 94 : framing.target;
  const sink = id === "packii" ? 8 : framing.sink;
  const cap = id === "packii" ? 225 : 240;
  const height = Math.min(target / trim.h, cap);
  portrait.dataset.speaker = id;
  portrait.src = `../../assets/sprites/characters/${id}/chr_${id}_${face}.png`;
  portrait.style.height = `${height}%`;
  portrait.style.bottom = `${-(trim.b * height + sink)}%`;
  portrait.style.setProperty("--portrait-anchor-x", `${-((trim.l + trim.w / 2) * 100)}%`);
}

function renderFaces() {
  faceSelect.innerHTML = "";
  for (const face of portraits[characterSelect.value]) {
    const option = document.createElement("option");
    option.value = face;
    option.textContent = face;
    faceSelect.appendChild(option);
  }
  faceSelect.value = portraits[characterSelect.value].includes("normal") ? "normal" : portraits[characterSelect.value][0];
  renderPortrait();
}

characterSelect.addEventListener("change", renderFaces);
faceSelect.addEventListener("change", renderPortrait);
characterSelect.value = "sumi";
renderFaces();
</script>
</body>
</html>
