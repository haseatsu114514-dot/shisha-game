<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>通りの試作（実験）</title>
<link rel="icon" href="data:,">
<!--
  「エリアを選ぶ → 横長の通りを8方向で歩く → 店に入る」日常マップの試作（本編には接続しない独立ページ）。
  ステージ: stage_hankagai.json ／ 本体: street.js ／ 説明: README.md
  画像は assets/proto_street/・assets/proto_walk/ にあれば使い、無ければコード描画の仮素材で最後まで動く。
-->
<style>
@font-face {
  font-family: "DotGothic16";
  src: url("../../../assets/fonts/DotGothic16-Regular.ttf") format("truetype");
  font-display: swap;
}
:root {
  --win-bg: #000;
  --win-line: #fff;
  --text: #fff;
  --dim: #9a93a8;
  --gold: #f4d27a;
}
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  touch-action: none;
}
body {
  font-family: "DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  color: var(--text);
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1280px;
  height: 720px;
  transform-origin: center center;
  transform: translate(-50%, -50%);
  overflow: hidden;
  background: #000;
}
#view {
  display: block;
  width: 1280px;
  height: 720px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.hidden { display: none !important; }

/* レトロRPG風のウィンドウ（黒地＋白の二重枠） */
.win {
  position: absolute;
  background: var(--win-bg);
  border: 4px solid var(--win-line);
  border-radius: 6px;
  box-shadow: 0 0 0 4px var(--win-bg), inset 0 0 0 4px var(--win-bg), inset 0 0 0 6px var(--win-line);
}

#hud {
  left: 20px;
  top: 20px;
  padding: 8px 18px;
  font-size: 26px;
  letter-spacing: 0.04em;
}
#hud small { color: var(--dim); font-size: 18px; margin-left: 8px; }
#hud .ph { color: var(--gold); font-size: 16px; margin-left: 8px; }

#help {
  position: absolute;
  left: 22px;
  bottom: 14px;
  font-size: 17px;
  color: #d9d3e6;
  text-shadow: 0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
}

#pad {
  position: absolute;
  right: 22px;
  bottom: 20px;
  display: flex;
  gap: 14px;
}
.btn {
  font: inherit;
  color: var(--text);
  background: var(--win-bg);
  border: 4px solid var(--win-line);
  border-radius: 6px;
  box-shadow: 0 0 0 3px var(--win-bg);
  padding: 10px 22px;
  font-size: 24px;
  cursor: pointer;
}
.btn:active { background: #2b2b2b; }
.btn[aria-pressed="true"] { background: var(--gold); color: #1d1426; }

/* メッセージウィンドウ（全角24字×2行） */
#msg {
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  width: 1060px;               /* 禁則で行末に「。」」が付いて全角26字になっても収まる幅 */
  min-height: 150px;
  box-sizing: border-box;
  padding: 26px 38px 22px;
  font-size: 36px;
  line-height: 1.55;
}
#msg-text {
  white-space: pre;             /* 折り返しは street.js の wrapLine（本編の autoWrap と同じ規則）で決める */
}
#msg-name {
  position: absolute;
  left: 22px;
  top: -30px;
  padding: 2px 16px;
  font-size: 24px;
  background: var(--win-bg);
  border: 4px solid var(--win-line);
  border-radius: 6px;
}
#msg-next {
  position: absolute;
  right: 26px;
  bottom: 14px;
  font-size: 22px;
  animation: blink 0.8s steps(2, start) infinite;
}
@keyframes blink { to { visibility: hidden; } }

/* ファストトラベル */
#travel {
  right: 22px;
  top: 20px;
  width: 400px;
  padding: 18px 20px 14px;
  font-size: 26px;
}
#travel h2 {
  margin: 0 0 10px;
  font-size: 22px;
  font-weight: normal;
  color: var(--dim);
}
#travel ul { list-style: none; margin: 0; padding: 0; }
#travel li {
  padding: 6px 10px 6px 36px;
  position: relative;
  cursor: pointer;
}
#travel li.off { color: #6d6878; cursor: default; }
#travel li.sel::before {
  content: "▶";
  position: absolute;
  left: 6px;
  font-size: 20px;
  top: 10px;
}
#travel .hint { margin-top: 10px; font-size: 16px; color: var(--dim); }

/* 店内 */
#interior {
  position: absolute;
  inset: 0;
  background: #000;
}
#interior img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
#interior-name {
  left: 20px;
  top: 20px;
  padding: 8px 18px;
  font-size: 26px;
}
#btn-out {
  position: absolute;
  right: 22px;
  top: 20px;
}

/* エリアマップ */
#areamap {
  position: absolute;
  inset: 0;
  background: #000;
}
#areamap > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: saturate(0.9);
}
#areamap-title {
  left: 20px;
  top: 20px;
  padding: 10px 20px;
  font-size: 28px;
}
#areamap-title small { display: block; font-size: 17px; color: var(--dim); margin-top: 2px; }
.pin {
  position: absolute;
  transform: translate(-50%, -100%);
  font: inherit;
  color: var(--text);
  background: var(--win-bg);
  border: 4px solid var(--win-line);
  border-radius: 6px;
  box-shadow: 0 0 0 3px var(--win-bg);
  padding: 8px 18px;
  font-size: 26px;
  cursor: pointer;
  white-space: nowrap;
}
.pin::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -18px;
  margin-left: -10px;
  border: 10px solid transparent;
  border-top-color: var(--win-line);
}
.pin.on::after { animation: bob 1.2s ease-in-out infinite; }
.pin.on:focus-visible, .pin.on:hover { background: #262033; outline: none; }
.pin.off { color: #8c8698; border-color: #8c8698; cursor: default; font-size: 21px; }
.pin.off::after { border-top-color: #8c8698; }
.pin small { display: block; font-size: 15px; color: #8c8698; text-align: center; }
@keyframes bob { 50% { transform: translateY(6px); } }
#toast {
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  padding: 10px 26px;
  font-size: 24px;
}

#fade {
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s linear;
}
#fade.on { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" width="1280" height="720"></canvas>
  <div id="hud" class="win hidden"><span id="hud-name">繁華街</span><small>（試作）</small><span id="hud-ph" class="ph hidden">仮素材</span></div>
  <div id="help" class="hidden">移動: 矢印 / WASD・タップ　Shift: ダッシュ　Z: 決定　M: マップ</div>
  <div id="pad" class="hidden">
    <button id="btn-run" class="btn" type="button" aria-pressed="false">ダッシュ</button>
    <button id="btn-act" class="btn" type="button">しらべる</button>
    <button id="btn-map" class="btn" type="button">マップ</button>
  </div>
  <div id="travel" class="win hidden">
    <h2>どこへ行く？</h2>
    <ul id="travel-list"></ul>
    <div class="hint">入ったことのある店の前へ移動できます（X: 閉じる）</div>
  </div>
  <div id="interior" class="hidden">
    <img id="interior-bg" alt="">
    <div id="interior-name" class="win"></div>
    <button id="btn-out" class="btn hidden" type="button">外に出る</button>
  </div>
  <div id="areamap" class="hidden">
    <img id="areamap-bg" alt="">
    <div id="areamap-title" class="win">エリアを選ぶ<small>試作で歩けるのは「繁華街」だけ</small></div>
    <div id="pins"></div>
    <div id="toast" class="win hidden"></div>
  </div>
  <div id="msg" class="win hidden"><div id="msg-name" class="hidden"></div><div id="msg-text"></div><div id="msg-next" class="hidden">▼</div></div>
  <div id="fade"></div>
</div>
<script src="street.js"></script>
</body>
</html>
