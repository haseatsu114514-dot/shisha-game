<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>水煙前線 — 一章の登場カット</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <main id="stage" aria-label="キャラクター紹介">
  <div class="color-field" aria-hidden="true"></div>
  <img id="art-background" class="art-background" alt="" aria-hidden="true" draggable="false" hidden>
  <div class="art-veil" aria-hidden="true"></div>
  <div class="left-field" aria-hidden="true"></div>
  <div class="halftone" aria-hidden="true"></div>
  <div id="motif" class="motif" aria-hidden="true"></div>
  <div class="floor-lines" aria-hidden="true"></div>
  <div class="accent-line" aria-hidden="true"></div>
  <div class="ribbon">
   <div class="meta">
    <div id="title" class="title"></div>
    <div class="name-line"><div class="name-group"><span class="name-wrap"><span id="name" class="name"></span></span><span id="full" class="full"></span></div></div>
   </div>
  </div>
  <img id="portrait" class="portrait" alt="" draggable="false">
  <div class="quote-area"><div class="quote-rule" aria-hidden="true"></div><div id="quote" class="quote"></div></div>
 </main>
 <nav id="controls" aria-label="プレビュー操作">
  <div id="character-buttons" class="character-buttons"></div>
  <div class="play-buttons">
   <button id="background-style" type="button" aria-pressed="false">背景：幾何学</button>
   <button id="replay" type="button">もう一度</button>
   <button id="pause" type="button" aria-pressed="false">一時停止</button>
   <button id="loop" type="button" aria-pressed="false">全員を続けて再生</button>
  </div>
 </nav>
 <script type="module" src="preview.js"></script>
</body>
</html>
