<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>水煙前線 — 登場カットイン</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <main id="stage" aria-label="キャラクター紹介">
  <div class="color-field" aria-hidden="true"></div>
  <div class="left-field" aria-hidden="true"></div>
  <div class="halftone" aria-hidden="true"></div>
  <div id="motif" class="motif" aria-hidden="true"></div>
  <div class="edge-stripes" aria-hidden="true"></div>
  <div class="sweep" aria-hidden="true"></div>
  <div class="accent-line" aria-hidden="true"></div>
  <div class="secondary-line" aria-hidden="true"></div>
  <div id="tag" class="tag" aria-hidden="true"></div>
  <img id="portrait" class="portrait" alt="" draggable="false">
  <div class="meta">
   <div id="title" class="title"></div>
   <div id="name" class="name"></div>
   <div id="full" class="full"></div>
  </div>
  <div class="quote-area"><div class="quote-rule" aria-hidden="true"></div><div id="quote" class="quote"></div></div>
 </main>
 <nav id="controls" aria-label="プレビュー操作">
  <div id="character-buttons" class="character-buttons"></div>
  <div class="play-buttons"><button id="replay" type="button">もう一度</button><button id="pause" type="button" aria-pressed="false">一時停止</button><button id="loop" type="button" aria-pressed="false">5人を続けて再生</button></div>
 </nav>
 <script type="module" src="preview.js"></script>
</body>
</html>
