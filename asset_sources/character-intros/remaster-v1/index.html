<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>水煙前線 — キャラクター紹介</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="キャラクター紹介">
    <div class="left-field" aria-hidden="true"></div>
    <div class="dots" aria-hidden="true"></div>
    <div class="corner-lines" aria-hidden="true"></div>
    <div class="sweep" aria-hidden="true"></div>
    <div class="accent-line" aria-hidden="true"></div>
    <img id="portrait" class="portrait" alt="" draggable="false">
    <div class="meta">
      <div id="title" class="title"></div>
      <div id="name" class="name"></div>
      <div id="full" class="full"></div>
    </div>
    <div class="quote-area">
      <div class="quote-rule" aria-hidden="true"></div>
      <div id="quote" class="quote"></div>
    </div>
  </main>
  <script type="module" src="preview.js"></script>
</body>
</html>
