<!doctype html><html lang="ja"><meta charset="utf-8"><title>立ち絵の画風比較</title><style>@font-face{font-family:game;src:url(../../remake/fonts/ZenKakuGothicNew-Medium.woff2)}*{box-sizing:border-box}body{margin:0;background:#1b1823;color:#f3eadd;font:18px game,sans-serif;padding:24px}h1{font-size:26px;margin:0 0 6px}p{margin:0 0 20px;color:#bfb5ca}.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end}.sprite{height:420px;object-fit:contain;width:100%;object-position:bottom}.card{border:1px solid #62556d;background:#292432;padding:12px;text-align:center}.name{height:50px;font-size:19px;padding-top:16px}.light{background:#ede5d5;color:#201b25}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.details img{height:350px;width:100%;object-fit:contain}.details .card{background:#ede5d5;color:#201b25}.note{font-size:14px;color:#bcb0ca;margin-top:18px}</style><h1>正式キャラと新しい通常立ち絵</h1><p>みんと・あげはを画風の基準に。新しい3人は採用前の制作案。</p><div class="lineup"><div class="card"><img class="sprite" src="../../assets/sprites/characters/minto/chr_minto_normal.png"><div class="name">みんと（正式）</div></div><div class="card"><img class="sprite" src="../../assets/sprites/characters/ageha/chr_ageha_normal.png"><div class="name">あげは（正式）</div></div><div class="card"><img class="sprite" src="shisha_9000-remaster-v1/normal-preview.png"><div class="name">SHISHA-9000</div></div><div class="card"><img class="sprite" src="tetsuko-remaster-v1/normal-preview.png"><div class="name">てつこ</div></div><div class="card"><img class="sprite" src="mukai_master-remaster-v1/normal-preview.png"><div class="name">ムカイさん</div></div></div><div class="details"><div class="card"><img src="shisha_9000-remaster-v1/normal-source.png">ロボット・明るい背景で透過の確認</div><div class="card"><img src="tetsuko-remaster-v1/normal-source.png">てつこ・オレンジと白の毛並み</div><div class="card"><img src="mukai_master-remaster-v1/normal-source.png">ムカイさん・渋い大人の印象</div></div><p class="note">通常ポーズの原画・896×1200配置案。既存の立ち絵やアイコンへの本編採用はまだ行っていません。</p></html>
