<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第2章 — 光の位置4案</title>
<style>
:root{color-scheme:dark;background:#15121b;color:#eee8f3;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:1420px;padding:24px;margin:auto}h1{font-size:19px;font-weight:500;margin:0 0 8px}p{font-size:13px;color:#b8acbf;line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}button{font:inherit;font-size:13px;color:inherit;background:#26202e;border:1px solid #51415e;border-radius:6px;padding:10px 15px;cursor:pointer}button[aria-pressed=true]{background:#d4b9dc;color:#29182f;border-color:#d4b9dc}button:focus-visible,a:focus-visible{outline:3px solid #e198cc;outline-offset:3px}figure{margin:0}img{width:100%;height:auto;aspect-ratio:16/9;display:block}figcaption{margin:12px 0;font-size:14px}#grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}section[hidden]{display:none!important}a{color:#dec1e7}.foot{border-top:1px solid #3b2e45;padding-top:16px;margin-top:24px}.links{display:flex;gap:24px;margin-top:14px;font-size:13px}@media(max-width:700px){main{padding:16px}#grid{grid-template-columns:1fr}button{padding:9px 12px}.links{flex-wrap:wrap;gap:12px}}
</style></head><body><main>
<h1>第2章 — 暗さを保った光の位置4案</h1><p>同じ構図と文字組みをベースに、どこへ光を当てるかを比較。立ち向かうはじめを共通にしています。</p>
<nav aria-label="光の位置"><button data-light="A" aria-pressed="true">A — アゲハの目元</button><button data-light="B" aria-pressed="false">B — アゲハの顔半分</button><button data-light="C" aria-pressed="false">C — 髪と肩の輪郭</button><button data-light="D" aria-pressed="false">D — はじめを照らす</button><button id="type" aria-pressed="true">文字を表示</button><button id="list" aria-pressed="false">4案を一覧</button></nav>
<section id="single"><figure><a id="imageLink" href="images/A-title.png" target="_blank" rel="noopener"><img id="image" src="images/A-title.png" alt="光A アゲハの目元"></a><figcaption id="caption">A — アゲハの目元</figcaption></figure></section>
<section id="grid" hidden aria-label="光の4案比較"></section>
<div class="foot"><p id="intent">目元の小さな光で、影の中でもアゲハの存在感を出す。</p><p>基準はユーザー指定画像の紫・ピンクと深い影。B〜DはAを実際の編集参照に渡した照明案で、生成による細部の差はあります。文字レイヤーは4案とも同じPNGです。Aは比較用の初期表示で、採用決定ではありません。</p><div class="links"><a href="../index.html">2〜5章の比較へ</a><a href="comparison.png" target="_blank" rel="noopener">4案の比較PNG</a><a id="download" href="images/A-title.png" download>表示中のPNG</a></div></div>
</main><script>
const labels={A:'アゲハの目元',B:'アゲハの顔半分',C:'髪と肩の輪郭',D:'はじめを照らす'};
const intents={A:'目元の小さな光で、影の中でもアゲハの存在感を出す。',B:'斜めから顔半分へ光を広げ、表情と強い余裕を読みやすくする。',C:'顔への光を抑え、髪と肩の輪郭で大きな存在感を出す。',D:'はじめの帽子・肩・腕へ光を寄せ、勇気を出す主人公に視線を集める。'};
let active='A',type=true,list=false;const $=id=>document.getElementById(id);const src=k=>type?`images/${k}-title.png`:`plates/${k}-art.png`;
function render(){document.querySelectorAll('[data-light]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.light===active)));$('image').src=src(active);$('image').alt=`光${active} ${labels[active]}`;$('imageLink').href=src(active);$('caption').textContent=`${active} — ${labels[active]}`;$('intent').textContent=intents[active];$('download').href=src(active);$('type').setAttribute('aria-pressed',String(type));$('type').textContent=type?'文字を表示':'文字なしを表示';$('list').setAttribute('aria-pressed',String(list));$('list').textContent=list?'個別に表示':'4案を一覧';$('single').hidden=list;$('grid').hidden=!list;$('grid').replaceChildren();for(const k of ['A','B','C','D']){const f=document.createElement('figure'),im=document.createElement('img'),c=document.createElement('figcaption'),b=document.createElement('button');im.src=src(k);im.alt=`光${k} ${labels[k]}`;b.textContent=`${k} — ${labels[k]}`;b.onclick=()=>{active=k;list=false;render()};c.append(b);f.append(im,c);$('grid').append(f)}}
document.querySelectorAll('[data-light]').forEach(b=>b.onclick=()=>{active=b.dataset.light;list=false;render()});$('type').onclick=()=>{type=!type;render()};$('list').onclick=()=>{list=!list;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const keys=['A','B','C','D'];active=keys[(keys.indexOf(active)+(e.key==='ArrowRight'?1:3))%4];list=false;render()}});render();
</script></body></html>
