<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>水煙前線 — 2〜5章のタイトル試作</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#141218;color:#eeecf0}*{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:auto;padding:24px}header{display:flex;gap:20px;justify-content:space-between;align-items:baseline}h1{font-size:19px;font-weight:500;margin:0 0 8px}p{font-size:13px;color:#aaa3b4;line-height:1.6;margin:4px 0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}button,a.control{background:#24212b;border:1px solid #4a4357;border-radius:6px;color:inherit;padding:10px 16px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}button[aria-pressed="true"]{background:#d3c0ec;color:#24162f;border-color:#d3c0ec}button:focus-visible,a:focus-visible{outline:3px solid #b690ed;outline-offset:3px}.spacer{flex:1}figure{margin:0}#mainImage{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#08050b}figcaption{display:flex;gap:12px;align-items:baseline;justify-content:space-between;margin:12px 0 0;font-size:14px}.downloads{display:flex;gap:16px;font-size:13px}a{color:#cab3e9}#grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}#grid img{width:100%;display:block}#grid button{display:block;margin-top:8px;width:100%;text-align:left}#grid p{margin:5px 0 0}section[hidden]{display:none!important}.note{margin-top:24px;padding-top:16px;border-top:1px solid #38323f;max-width:920px}.meta{display:flex;gap:24px;margin-top:10px;font-size:13px}@media(max-width:700px){main{padding:16px}header{display:block}#grid{grid-template-columns:1fr}nav{gap:6px}button,a.control{padding:9px 12px}figcaption{display:block}.downloads{margin-top:8px}.spacer{display:none}}
</style>
</head>
<body><main>
<header><div><h1>水煙前線 — 章タイトルのテイスト試作</h1><p>2〜5章を切り替えて比較。画像クリックでPNGを開きます。</p></div><p>1280 × 720 / 仮案</p></header>
<nav aria-label="章を選択">
<button data-chapter="5" aria-pressed="true">5章 — 機械仕掛けの神</button>
<button data-chapter="2" aria-pressed="false">2章 — 才能の壁</button>
<button data-chapter="3" aria-pressed="false">3章 — 虚ろな王冠</button>
<button data-chapter="4" aria-pressed="false">4章 — 継承の煙</button>
<span class="spacer"></span><button id="typeButton" aria-pressed="true">文字を表示</button><button id="gridButton" aria-pressed="false">4章を一覧</button>
</nav>
<section id="single"><figure><a id="imageLink" href="images/ch5-title.png" target="_blank" rel="noopener"><img id="mainImage" src="images/ch5-title.png" alt="第5章 機械仕掛けの神：紫に照らされた金属の顔と歯車"></a><figcaption><span id="caption">5章：紫の金属、歯車、巨大な機械の顔</span><span class="downloads"><a id="pngLink" href="images/ch5-title.png" download>タイトルPNG</a><a id="artLink" href="plates/ch5-art.png" download>文字なしPNG</a></span></figcaption></figure></section>
<section id="grid" hidden aria-label="4章の比較"></section>
<div class="note"><p id="identityNote">5章の機械の顔は仮デザインです。SHISHA-9000の採用済み画像は現行素材に見当たらないため、提供画像の光・金属・歯車・寄りの構図を参照しました。</p><p>2章は指定画像の紫・ピンクと深い影、立ち向かうはじめ。光の位置4案も別プレビューで比較できます。3章は空洞の見える王冠、4章は二人の表情と手が中心。文字の形と配置も章ごとに調整。本編への差し替えは行っていません。</p><div class="meta"><a href="lighting-ch2/index.html">2章の光4案</a><a href="comparison.png" target="_blank" rel="noopener">比較画像</a><a href="refs/reference-sheet.png" target="_blank" rel="noopener">キャラ参照</a><a href="README.md">制作メモ</a></div></div>
</main>
<script>
const items={2:{name:'才能の壁',caption:'2章：紫・ピンクと深い影、立ち向かうはじめ（光A）'},3:{name:'虚ろな王冠',caption:'3章：王冠、雨、空席、帰る灯り'},4:{name:'継承の煙',caption:'4章：二人の表情と手、淡いドバイの背景'},5:{name:'機械仕掛けの神',caption:'5章：紫の金属、歯車、巨大な機械の顔'}};
let current=5,showType=true,isGrid=false;
const $=id=>document.getElementById(id);
function src(n){return showType?`images/ch${n}-title.png`:`plates/ch${n}-art.png`}
function render(){
  document.querySelectorAll('[data-chapter]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.chapter)===current)));
  $('mainImage').src=src(current);$('mainImage').alt=`第${current}章 ${items[current].name}`;$('imageLink').href=src(current);$('caption').textContent=items[current].caption;
  $('pngLink').href=`images/ch${current}-title.png`;$('artLink').href=`plates/ch${current}-art.png`;
  $('typeButton').setAttribute('aria-pressed',String(showType));$('typeButton').textContent=showType?'文字を表示':'文字なしを表示';
  $('gridButton').setAttribute('aria-pressed',String(isGrid));$('gridButton').textContent=isGrid?'個別に表示':'4章を一覧';$('single').hidden=isGrid;$('grid').hidden=!isGrid;
  $('grid').replaceChildren();
  for(const n of [2,3,4,5]){const f=document.createElement('figure'),im=document.createElement('img'),b=document.createElement('button');im.src=src(n);im.alt=`第${n}章 ${items[n].name}`;b.textContent=items[n].caption;b.onclick=()=>{current=n;isGrid=false;render()};f.append(im,b);$('grid').append(f)}
}
document.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>{current=Number(b.dataset.chapter);isGrid=false;render()}));
$('typeButton').onclick=()=>{showType=!showType;render()};$('gridButton').onclick=()=>{isGrid=!isGrid;render()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const seq=[2,3,4,5];current=seq[(seq.indexOf(current)+(e.key==='ArrowRight'?1:3))%4];isGrid=false;render()}});
render();
</script></body></html>
