<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=block" rel="stylesheet">
<style>
  /* ②のスマホの画面。ブラウザでパロディバナーを開いているところ（文字は小さく、主役はバナー） */
  html,body{margin:0;padding:0}
  .screen{width:320px;height:633px;background:#fff;font-family:"Noto Sans JP",sans-serif;display:flex;flex-direction:column;overflow:hidden}
  .status{height:28px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 22px;font-weight:700;font-size:14px}
  .icons{display:flex;gap:5px;align-items:flex-end}
  .bars i{display:inline-block;width:3px;background:#fff;margin-left:1.5px;border-radius:1px}
  .batt{width:22px;height:11px;border-radius:3px;background:#f5d000;color:#111;font-size:8px;font-weight:900;line-height:11px;text-align:center}
  .url{background:#111;padding:4px 10px 9px}
  .url div{background:#2a2a2a;border-radius:9px;height:30px;display:flex;align-items:center;justify-content:center;color:#ddd;font-size:13px;font-weight:500;letter-spacing:.02em}
  .view{background:#e9e9e9;padding:22px 8px}
  .view img{display:block;width:100%;box-shadow:0 0 0 1px #c8c8c8}
  .meta{padding:14px 16px 0;flex:1}
  .meta i{display:block;height:9px;border-radius:5px;background:#d6d6d6;margin:0 0 10px}
  .row{display:flex;gap:10px;align-items:center;margin-top:16px}
  .dot{width:22px;height:22px;border-radius:50%;background:#dcdcdc}
  .btn{margin-left:auto;border:1.5px solid #ccc;border-radius:8px;width:62px;height:28px}
  .nav{height:44px;background:#111;display:flex;justify-content:space-around;align-items:center;color:#bbb;font-size:22px;font-weight:500}
</style></head><body>
<div class="screen" id="screen">
  <div class="status"><span>2:00</span><span class="icons"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span><span class="batt">26</span></span></div>
  <div class="url"><div>kemuri-search.jp</div></div>
  <div class="view"><img src="../../parody/ageha-karusugi-banner/ageha_shisha_karusugi.png" alt=""></div>
  <div class="meta">
    <i style="width:92%"></i><i style="width:70%"></i>
    <div class="row"><span class="dot"></span><i style="width:44%;margin:0"></i><span class="btn"></span></div>
    <i style="width:80%;margin-top:18px"></i>
  </div>
  <div class="nav"><span>‹</span><span>⇧</span><span>＋</span><span>▢</span><span>…</span></div>
</div>
</body></html>
