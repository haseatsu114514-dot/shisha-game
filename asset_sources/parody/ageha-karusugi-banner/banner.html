<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Serif:ital,wght@1,900&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  .ad{width:580px;height:480px;box-sizing:border-box;border:1px solid #b9b9b9;background:#fff;
      font-family:"Noto Sans JP",sans-serif;position:relative;overflow:hidden}
  .bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 12px;
       background:linear-gradient(#f4f1ee,#e6e1dc);border-bottom:1px solid #d0cac4}
  .bar .rec{font-weight:900;font-size:18px;color:#333;letter-spacing:.02em}
  .bar .rec::before{content:"■";margin-right:2px}
  .bar .logo{font-family:"Noto Serif",serif;font-style:italic;font-weight:900;font-size:31px;color:#2b2f45;letter-spacing:-.01em;transform:translateY(-1px)}
  .head{padding:8px 0 0 14px;font-weight:900;color:#1d1d1d;line-height:1.08;font-feature-settings:"palt"}
  .l1{font-size:55px;letter-spacing:-.02em;white-space:nowrap}
  .l2{font-size:58px;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
  .hl{background:linear-gradient(transparent 10%,#ff9de6 10%,#ff9de6 96%,transparent 96%);padding:0 2px}
  .q{margin-left:6px}
  .body{position:absolute;left:10px;right:8px;top:200px;bottom:8px;display:flex;gap:12px}
  .photo{width:260px;height:254px;flex:none;border:2px solid #57b57a;box-sizing:content-box;background:url(photo-pose.png) center/cover}
  .txt{flex:1;font-weight:700;font-size:18.5px;line-height:1.72;color:#2a2a2a;letter-spacing:-.04em;white-space:nowrap;padding-top:4px;font-feature-settings:"palt"}
  .o{color:#ff7a00}
  .p{background:#ffc3ee}
  .check{display:inline-block;margin-top:6px;background:#fff200;color:#e8a600;font-weight:900;font-size:15px;padding:0 5px;border-radius:9px;letter-spacing:.02em;line-height:1.5}
  .link{display:block;margin-top:4px;color:#20285a;text-decoration:underline;text-underline-offset:3px;font-size:19px}
  .link .o{color:#ff7a00}
</style></head>
<body>
<div class="ad" id="ad">
  <div class="bar"><span class="rec">おすすめ情報</span><span class="logo">@shisha</span></div>
  <div class="head">
    <div class="l1">うわっ…<span class="hl">私のシーシャ、</span></div>
    <div class="l2"><span class="hl">軽すぎ…</span><span class="q">？</span></div>
  </div>
  <div class="body">
    <div class="photo"></div>
    <div class="txt">
      無料5分で、<span class="o">適正な重さ</span>や<br>
      <span class="o">熱管理の基礎能力</span>が分かる<br>
      <span class="p">「シーシャ価値診断テスト」</span>。<br>
      受けた人は<span class="o">40万人</span>を突破！<br>
      結果もすぐ分かると大人気だ。<br>
      <span class="check">CHECK!</span>
      <span class="link">&gt;&gt;あなたの<span class="o">適正な重さ</span>は？</span>
    </div>
  </div>
</div>
</body></html>
