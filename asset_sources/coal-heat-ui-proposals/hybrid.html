<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>炭焼きUI · A/B統合プレビュー</title>
<style>
:root{color-scheme:dark;--bg:#100d15;--line:#3d333e;--text:#ece6dc;--dim:#afa1ae;--gold:#e1bc7a;font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#352235,transparent 55%),var(--bg);color:var(--text);line-height:1.7}button{font:inherit;cursor:pointer;touch-action:manipulation}a{color:var(--dim);text-underline-offset:4px}button:focus-visible,a:focus-visible,img:focus-visible{outline:3px solid #f5d8a0;outline-offset:4px}header,main,footer{width:min(1456px,calc(100% - 64px));margin:auto}header{padding:27px 0 19px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.15em;margin:0 0 5px}h1{font-size:23px;line-height:1.5;margin:0;font-weight:600}.scope{font-size:11px;color:var(--dim);text-align:right}.toolbar{border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;gap:16px}.tabs{display:flex;gap:9px}.tab,.compare-btn,.close{color:var(--dim);background:#201923;border:1px solid var(--line);border-radius:7px;padding:10px 18px;font-size:13px}.tab[aria-selected=true]{color:var(--text);border-color:var(--gold);background:#3a2d27}.compare-btn[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}.viewer{background:#09070d;border:1px solid #57404a;border-radius:10px;overflow:hidden;box-shadow:0 20px 60px #0005}.viewer img{width:100%;display:block;cursor:zoom-in}.both{display:grid;grid-template-columns:1fr 1fr;gap:22px}.both figure{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:0;background:#19131e}.both img{display:block;width:100%;cursor:zoom-in}.both figcaption{padding:12px 18px;color:var(--dim);font-size:12px}footer{padding:19px 0 24px;font-size:11px;text-align:right}[hidden]{display:none!important}dialog{max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);padding:12px;border:1px solid #675043;border-radius:8px;background:#0d0911;color:var(--text)}dialog::backdrop{background:#050307e8}dialog .bar{display:flex;justify-content:space-between;gap:25px;padding:5px 4px 14px;align-items:center;font-size:12px}dialog img{max-width:100%;max-height:calc(100dvh - 130px);display:block;width:auto;height:auto;margin:auto}.close{font-size:12px;padding:6px 15px}#board{display:none}body.board header,body.board main,body.board footer,body.board dialog{display:none}body.board #board{display:block;width:1800px;padding:32px 36px;background:#100d15}.board-top{margin-bottom:24px}.board-top h1{font-size:30px}#board .both figcaption{padding:16px 20px;font-size:17px}#board .both img{cursor:default}@media(max-width:800px){header,main,footer{width:calc(100% - 32px)}header{padding-top:19px;gap:12px}h1{font-size:19px}.eyebrow{font-size:8px}.scope{font-size:9px}.toolbar{gap:8px}.tab,.compare-btn{font-size:11px;padding:8px 10px}.tabs{gap:6px}.both{grid-template-columns:1fr;gap:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div><p class="eyebrow">水煙前線 -EN:CODE-　／　A × B HYBRID</p><h1>炭焼きUI</h1></div><div class="scope">静止モック<br>画像を押すと拡大</div></header>
<main>
<div class="toolbar"><div class="tabs" role="tablist" aria-label="取り出し前後"><button class="tab" role="tab" id="before" aria-selected="true" aria-controls="single" data-state="before">取り出す前 · 0/3</button><button class="tab" role="tab" id="after" aria-selected="false" aria-controls="single" tabindex="-1" data-state="after">1個回収後 · 1/3</button></div><button class="compare-btn" id="compare" aria-pressed="false">前後を並べる</button></div>
<section id="single" role="tabpanel" aria-labelledby="before"><div class="viewer"><img id="hero" src="AB-hybrid-before.png?rev=inset-v4" alt="取り出し前。コンロに炭3個、炭壺に0個。コンロ後部に電源コード。右上の吹き出しには別視点で上から見た空の炭壺。" tabindex="0" data-zoom></div></section>
<section class="both" id="both" aria-label="回収前後の比較" hidden><figure><img src="AB-hybrid-before.png?rev=inset-v4" alt="取り出し前：コンロに3個、炭壺に0個。" tabindex="0" data-zoom><figcaption>取り出す前 · 0/3</figcaption></figure><figure><img src="AB-hybrid-after.png?rev=inset-v4" alt="1個回収後：コンロに2個、別視点の吹き出しの炭壺に炭2が1個。" tabindex="0" data-zoom><figcaption>1個回収後 · 1/3</figcaption></figure></section>
</main>
<footer><a href="README.md">提案・制作記録</a></footer>
<dialog id="zoom"><div class="bar"><span id="zoom-title"></span><button class="close" id="close">閉じる　Esc</button></div><img id="zoom-image" alt=""></dialog>
<div id="board"><div class="board-top"><p class="eyebrow">水煙前線 -EN:CODE-　／　A × B HYBRID</p><h1>炭焼きUI</h1></div><div class="both"><figure><img src="AB-hybrid-before.png?rev=inset-v4" alt="取り出し前"><figcaption>取り出す前 · コンロ3個 ／ 炭壺0個</figcaption></figure><figure><img src="AB-hybrid-after.png?rev=inset-v4" alt="1個回収後"><figcaption>1個回収後 · コンロ2個 ／ 炭壺1個</figcaption></figure></div></div>
<script>
const states={before:{file:'AB-hybrid-before.png?rev=inset-v4',alt:'取り出し前：コンロに3個、炭壺に0個。'},after:{file:'AB-hybrid-after.png?rev=inset-v4',alt:'1個回収後：コンロに2個、別視点の吹き出しの炭壺に炭2が1個。'}};
const tabs=[...document.querySelectorAll('.tab')],single=document.getElementById('single'),both=document.getElementById('both'),compare=document.getElementById('compare');let current='before';
function show(key){current=key;const s=states[key];tabs.forEach(t=>{const on=t.dataset.state===key;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1});single.setAttribute('aria-labelledby',key);document.getElementById('hero').src=s.file;document.getElementById('hero').alt=s.alt;single.hidden=false;both.hidden=true;compare.setAttribute('aria-pressed','false');history.replaceState(null,'','#'+key)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.state));t.addEventListener('keydown',e=>{let n;if(e.key==='ArrowLeft'||e.key==='ArrowRight')n=1-i;if(e.key==='Home')n=0;if(e.key==='End')n=1;if(n!==undefined){e.preventDefault();show(tabs[n].dataset.state);tabs[n].focus()}})});
compare.addEventListener('click',()=>{const on=compare.getAttribute('aria-pressed')!=='true';compare.setAttribute('aria-pressed',String(on));single.hidden=on;both.hidden=!on;if(on)history.replaceState(null,'','#both');else show(current)});
const dialog=document.getElementById('zoom');document.querySelectorAll('[data-zoom]').forEach(img=>{const open=()=>{document.getElementById('zoom-image').src=img.src;document.getElementById('zoom-image').alt=img.alt;document.getElementById('zoom-title').textContent=img.alt;dialog.showModal()};img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});document.getElementById('close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});if(new URLSearchParams(location.search).has('board'))document.body.classList.add('board');else if(location.hash==='#both')compare.click();else if(states[location.hash.slice(1)])show(location.hash.slice(1));
</script>
</body>
</html>
