<g font-family="sans-serif" fill="#292f37"><text x="560" y="42" text-anchor="middle" font-size="27" font-weight="bold">一本のホースの接続とマウスピース</text><text x="560" y="73" text-anchor="middle" font-size="16">ホースポート → 接続金具 → しなるチューブ → ハンドル → 着脱式チップ → 口元</text></g>
<rect x="34" y="122" width="140" height="262" rx="54" fill="#dfe9ec" stroke="#8199a4" stroke-width="6"/><rect x="83" y="102" width="42" height="301" rx="16" fill="#afbfc7" stroke="#627d89" stroke-width="6"/>
<path d="M130 276 L208 250" stroke="#778b97" stroke-width="28" fill="none" stroke-linecap="round"/><rect x="169" y="230" width="63" height="44" rx="12" fill="#688c9d" stroke="#334956" stroke-width="5"/>
<path d="M225 252 C280 252 275 395 381 395 S455 210 573 253 S630 403 701 329" fill="none" stroke="#232830" stroke-width="38" stroke-linecap="round"/>
<path d="M225 252 C280 252 275 395 381 395 S455 210 573 253 S630 403 701 329" fill="none" stroke="#717887" stroke-width="3" stroke-dasharray="9 15"/>
<path d="M700 330 L855 261" fill="none" stroke="#a17538" stroke-width="35" stroke-linecap="round"/>
<path d="M700 330 L855 261" fill="none" stroke="#e4ba64" stroke-width="25" stroke-linecap="round"/>
<path d="M855 261 L905 240" fill="none" stroke="#32a2ad" stroke-width="22" stroke-linecap="round"/>
<ellipse cx="913" cy="236" rx="11" ry="11" fill="#20828f"/><path d="M925 239 Q950 226 965 236" fill="none" stroke="#6d7680" stroke-width="3" stroke-dasharray="6 7"/>
<g font-family="sans-serif" fill="#303640" font-size="20">
<text x="62" y="451">本体の側面</text><text x="180" y="178">接続金具</text><text x="383" y="467" text-anchor="middle">しなるホース</text><text x="775" y="194" text-anchor="middle">硬いハンドル</text><text x="905" y="160" text-anchor="middle">短いチップ</text><text x="965" y="261">口元へ</text>
</g>
<g stroke="#667785" stroke-width="3"><path d="M220 189 L217 232"/><path d="M388 434 L388 395"/><path d="M774 207 L788 299"/><path d="M906 172 L895 243"/></g>
<rect x="37" y="86" width="164" height="45" rx="10" fill="#d1edf0" stroke="#7cafb6"/><text x="119" y="115" text-anchor="middle" font-family="sans-serif" font-size="16">本体ポート ≠ 排煙弁</text>
<rect x="716" y="384" width="370" height="105" rx="14" fill="#e9e4f3"/><text x="901" y="415" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">首掛けマイチップの場合</text>
<circle cx="758" cy="446" r="21" fill="#98c0c2" stroke="#667d81" stroke-width="5"/><path d="M756 426 C775 380 808 383 824 440" stroke="#6d627b" stroke-width="4" fill="none"/><text x="846" y="451" font-family="sans-serif" font-size="16">紐は持ち運び用。吸うホースとは別</text>
<text x="560" y="508" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#65717d">汎用構造のオリジナル模式図。実機のポート、形状、着脱方法、先端サイズは機種依存。</text>
</svg>