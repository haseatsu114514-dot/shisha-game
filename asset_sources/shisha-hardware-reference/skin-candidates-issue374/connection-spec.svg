<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<rect width="1200" height="400" fill="#edeef0"/>
<g font-family="sans-serif" fill="#202633">
<text x="35" y="40" font-size="23">接続仕様：単一の中空通路（検品図・生成への添付不可）</text>
<text x="35" y="75" font-size="18">使用状態：本体側面ポート → 柔軟ホース → 硬質ハンドル → 短い着脱チップ → 口</text>
<path d="M45 210 C100 260 145 135 225 195" fill="none" stroke="#454954" stroke-width="18"/>
<rect x="223" y="182" width="40" height="26" rx="4" fill="#afb6bd" stroke="#383e4c"/>
<rect x="263" y="185" width="495" height="20" rx="4" fill="#334657" stroke="#383e4c"/>
<rect x="758" y="186" width="32" height="18" fill="#a9b4c1" stroke="#383e4c"/>
<rect x="790" y="184" width="20" height="22" fill="#527494" stroke="#383e4c"/>
<path d="M810 180 H880 Q897 180 897 195 Q897 210 880 210 H810 Z" fill="#99c8df" stroke="#383e4c"/>
<path d="M228 195 H894" stroke="#e9eff8" stroke-width="5" stroke-dasharray="9 6"/>
<text x="60" y="290" font-size="18">柔らかい管：曲がる</text>
<text x="315" y="290" font-size="18">硬い持ち手：まっすぐ形を保つ</text>
<text x="815" y="290" font-size="18">短い別部品</text>
<text x="985" y="205" font-size="18">→ 口元</text>
<text x="230" y="145" font-size="16">ホース側根元</text>
<text x="712" y="145" font-size="16">口側先端＋チップ挿入部</text>
<text x="35" y="350" font-size="17">チップは1種類だけ。携帯リング・チェーンは通気路の外側。使用時の嵌合径は採用後に確定。</text>
<text x="35" y="380" font-size="17">単体候補にホースを描かなくても可。実使用CGでは本体ポートから両方向に経路を検品。</text>
</g></svg>
