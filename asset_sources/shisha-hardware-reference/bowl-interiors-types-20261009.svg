<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="伝統型・ファンネル型・ボルテックス型ハガル内部の違いを示すオリジナル模式図">
<rect width="960" height="430" fill="#f8f7f4"/>
<text x="480" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#28333c" font-weight="bold">ハガル内部の吸気穴の違い（模式図・特定製品ではない）</text>
<g font-family="sans-serif" fill="#273442">
<rect x="18" y="55" width="295" height="354" rx="16" fill="#fff" stroke="#cbd1d6"/><rect x="331" y="55" width="295" height="354" rx="16" fill="#fff" stroke="#cbd1d6"/><rect x="644" y="55" width="298" height="354" rx="16" fill="#fff" stroke="#cbd1d6"/>
<text x="166" y="90" text-anchor="middle" font-size="20" font-weight="bold">伝統型 / Traditional</text>
<text x="478" y="90" text-anchor="middle" font-size="20" font-weight="bold">ファンネル / Phunnel</text>
<text x="792" y="90" text-anchor="middle" font-size="20" font-weight="bold">ボルテックス / Vortex</text>
<text x="166" y="116" text-anchor="middle" font-size="14">器の底面に複数の穴</text>
<text x="478" y="116" text-anchor="middle" font-size="14">中央柱の頂点に1つの穴</text>
<text x="792" y="116" text-anchor="middle" font-size="14">中央柱の側面に複数の穴</text>
</g>
<g stroke="#985f47" stroke-width="5" fill="#ecd0ad">
<circle cx="166" cy="212" r="80"/><circle cx="478" cy="212" r="80"/><circle cx="792" cy="212" r="80"/>
</g>
<g fill="#bb8a60"><circle cx="166" cy="212" r="66"/><circle cx="478" cy="212" r="66"/><circle cx="792" cy="212" r="66"/></g>
<g fill="#f4dcbc"><circle cx="166" cy="212" r="49"/><circle cx="478" cy="212" r="54"/><circle cx="792" cy="212" r="54"/></g>
<g fill="#36404a">
<circle cx="146" cy="190" r="7"/><circle cx="185" cy="187" r="7"/><circle cx="168" cy="215" r="7"/><circle cx="144" cy="238" r="7"/><circle cx="186" cy="237" r="7"/>
</g>
<circle cx="478" cy="212" r="27" fill="#deaf83" stroke="#99654f" stroke-width="4"/>
<circle cx="478" cy="212" r="8" fill="#36404a"/>
<circle cx="792" cy="212" r="27" fill="#deaf83" stroke="#99654f" stroke-width="4"/>
<g fill="#36404a"><ellipse cx="792" cy="184" rx="8" ry="5"/><ellipse cx="819" cy="210" rx="5" ry="8"/><ellipse cx="792" cy="240" rx="8" ry="5"/><ellipse cx="765" cy="210" rx="5" ry="8"/></g>
<g font-family="sans-serif" font-size="15" fill="#384753">
<text x="166" y="332" text-anchor="middle">中央までくぼんだ受け皿</text><text x="166" y="355" text-anchor="middle">底穴からステムへ</text>
<text x="478" y="332" text-anchor="middle">中央柱の周りにフレーバー</text><text x="478" y="355" text-anchor="middle">上面の中央穴が出口</text>
<text x="792" y="332" text-anchor="middle">中央柱の周りにフレーバー</text><text x="792" y="355" text-anchor="middle">柱の側面の穴が出口</text>
<text x="480" y="397" text-anchor="middle" font-size="13" fill="#647380">黒い穴の位置だけを比較。材質・寸法・外形・穴数はモデルごとに違う。</text>
</g></svg>