<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>フレーバー箱18種・表示サイズ比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#202426;font-family:"Noto Sans CJK JP",sans-serif}header{padding:24px 30px 16px;border-bottom:1px solid #d5d3cd;background:#fff}h1{font-size:25px;line-height:1.4;margin:0 0 8px}p{margin:0 0 12px;font-size:13px;line-height:1.7}nav{display:flex;gap:10px;align-items:center}select,button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid #b8bbb8;border-radius:5px;background:#fff;color:#202426}main{padding:18px 24px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{padding:12px 8px 10px;border:1px solid #d0d1ca;border-radius:8px;background:#fff;display:flex;align-items:center;flex-direction:column}.frame{display:flex;align-items:center;justify-content:center;position:relative;background:#eeede7;flex:none;border-radius:4px}.frame:after{content:"";position:absolute;left:5px;right:5px;bottom:6%;border-bottom:1px dashed #aaa;pointer-events:none}.clip{position:relative;overflow:hidden;display:block;flex:none}.clip img{position:absolute;max-width:none;display:block}.name{font-size:14px;margin:9px 0 2px;font-weight:700;text-align:center}.maker{font-size:11px;color:#686c68;text-align:center}.dark .frame{background:#292d32}.dark .frame:after{border-color:#7d858e}footer{padding:0 30px 22px;font-size:12px;color:#636961}@media(max-width:850px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:500px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<header><h1>フレーバー箱18種：同じ高さで比較</h1><p>アルファーヘブン10種 ＋ ドバジ6種 ＋ アフサール2種。透明余白を除いた窓に、全商品共通の88%表示を適用しています。<br>素材の表示比較であり、本編画面のキャプチャではありません。画像原画は変更していません。</p><nav><label>表示 <select id="size"><option value="180">比較 180px枠</option><option value="112">詳細 112px枠</option><option value="66">一覧 66px枠</option></select></label><button id="theme" type="button">背景を暗くする</button></nav></header>
<main id="grid"></main><footer>実物らしさは箱の形・紙質・折り目で表し、修正版8種の印刷図案は独自に構成。草飾り・HMD・上部突起は追加していません。</footer>
<script>
const products=[{"id":"mint","maker":"アルファーヘブン","name":"ミント","src":"../wing-only-heaven10-v6/outputs/mint-wings-composite.png","window":[306,211,641,845],"size":[1254,1254]},{"id":"double_apple","maker":"アルファーヘブン","name":"ダブルアップル","src":"../wing-only-heaven10-v6/outputs/double_apple-wings-composite.png","window":[260,133,738,986],"size":[1254,1254]},{"id":"blueberry","maker":"アルファーヘブン","name":"ブルーベリー","src":"../wing-only-heaven10-v6/outputs/blueberry-wings-composite.png","window":[258,129,741,990],"size":[1254,1254]},{"id":"strawberry","maker":"アルファーヘブン","name":"ストロベリー","src":"../wing-only-heaven10-v6/outputs/strawberry-wings-composite.png","window":[258,130,741,989],"size":[1254,1254]},{"id":"vanilla","maker":"ドバジ","name":"バニラ","src":"dobaj-vanilla.png","window":[243,110,779,1046],"size":[1254,1254]},{"id":"pineapple","maker":"アルファーヘブン","name":"パイナップル","src":"../wing-only-heaven10-v6/outputs/pineapple-wings-composite.png","window":[258,129,743,992],"size":[1254,1254]},{"id":"coconut","maker":"ドバジ","name":"ココナッツ","src":"dobaj-coconut.png","window":[244,108,780,1050],"size":[1254,1254]},{"id":"mango","maker":"ドバジ","name":"マンゴー","src":"dobaj-mango.png","window":[242,108,782,1050],"size":[1254,1254]},{"id":"lemon","maker":"アルファーヘブン","name":"レモン","src":"../wing-only-heaven10-v6/outputs/lemon-wings-composite.png","window":[259,129,741,991],"size":[1254,1254]},{"id":"peach","maker":"ドバジ","name":"ピーチ","src":"dobaj-peach.png","window":[243,109,780,1048],"size":[1254,1254]},{"id":"orange","maker":"アルファーヘブン","name":"オレンジ","src":"../wing-only-heaven10-v6/outputs/orange-wings-composite.png","window":[258,129,742,992],"size":[1254,1254]},{"id":"grape","maker":"アルファーヘブン","name":"グレープ","src":"../wing-only-heaven10-v6/outputs/grape-wings-composite.png","window":[272,144,716,981],"size":[1254,1254]},{"id":"melon","maker":"ドバジ","name":"メロン","src":"dobaj-melon.png","window":[244,109,778,1048],"size":[1254,1254]},{"id":"watermelon","maker":"アルファーヘブン","name":"スイカ","src":"../wing-only-heaven10-v6/outputs/watermelon-wings-composite.png","window":[259,129,740,992],"size":[1254,1254]},{"id":"banana","maker":"ドバジ","name":"バナナ","src":"dobaj-banana.png","window":[243,109,780,1048],"size":[1254,1254]},{"id":"cinnamon","maker":"アルファーヘブン","name":"シナモン","src":"../wing-only-heaven10-v6/outputs/cinnamon-wings-composite.png","window":[254,129,747,993],"size":[1254,1254]},{"id":"rose","maker":"アフサール","name":"ローズ","src":"afsaal-rose.png","window":[245,112,775,1045],"size":[1254,1254]},{"id":"lychee","maker":"アフサール","name":"ライチ","src":"afsaal-lychee.png","window":[243,110,780,1049],"size":[1254,1254]}];
const grid=document.getElementById('grid');
function render(){const n=Number(document.getElementById('size').value);grid.replaceChildren();for(const p of products){const [x,y,w,h]=p.window,k=Math.min(n*.88/w,n*.88/h);const card=document.createElement('article');card.className='card';card.dataset.id=p.id;const frame=document.createElement('div');frame.className='frame';frame.style.width=n+'px';frame.style.height=n+'px';const clip=document.createElement('span');clip.className='clip';clip.style.width=(w*k)+'px';clip.style.height=(h*k)+'px';const img=document.createElement('img');img.alt=p.maker+' '+p.name;img.src=p.src;img.style.width=(p.size[0]*k)+'px';img.style.height=(p.size[1]*k)+'px';img.style.left=(-x*k)+'px';img.style.top=(-y*k)+'px';clip.append(img);frame.append(clip);const name=document.createElement('div');name.className='name';name.textContent=p.name;const maker=document.createElement('div');maker.className='maker';maker.textContent=p.maker;card.append(frame,name,maker);grid.append(card)}}
document.getElementById('size').onchange=render;document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'背景を明るくする':'背景を暗くする'};render();
</script></html>
