<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>フレーバー箱18種・表示サイズ比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#202426;font-family:"Noto Sans CJK JP",sans-serif}header{padding:24px 30px 16px;border-bottom:1px solid #d5d3cd;background:#fff}h1{font-size:25px;line-height:1.4;margin:0 0 8px}p{margin:0 0 12px;font-size:13px;line-height:1.7}nav{display:flex;gap:10px;align-items:center}select,button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid #b8bbb8;border-radius:5px;background:#fff;color:#202426}main{padding:18px 24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{padding:12px 8px 10px;border:1px solid #d0d1ca;border-radius:8px;background:#fff;display:flex;align-items:center;flex-direction:column}.frame{display:flex;align-items:center;justify-content:center;position:relative;background:#eeede7;flex:none;border-radius:4px}.frame:after{content:"";position:absolute;left:5px;right:5px;bottom:6%;border-bottom:1px dashed #aaa;pointer-events:none}.clip{position:relative;overflow:hidden;display:block;flex:none}.clip img{position:absolute;max-width:none;display:block}.name{font-size:14px;margin:9px 0 2px;font-weight:700;text-align:center}.maker{font-size:11px;color:#686c68;text-align:center}.dark .frame{background:#292d32}.dark .frame:after{border-color:#7d858e}footer{padding:0 30px 22px;font-size:12px;color:#636961}@media(max-width:850px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:500px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<header><h1>メーカー名の文字のみ除去：8種の修正前・修正後</h1><p>各ペアの左が修正前、右がメーカー名なし。画像原画は生成出力を保存し、表示時のみ透明余白を正規化しています。<br>正面・側面のメーカー名文字を除去。ロゴマークとフレーバー名を維持。素材比較であり、本編キャプチャではありません。</p><nav><label>表示 <select id="size"><option value="180">比較 180px枠</option><option value="112">詳細 112px枠</option><option value="66">一覧 66px枠</option></select></label><button id="theme" type="button">背景を暗くする</button></nav></header>
<main id="grid"></main><footer>メーカー差はロゴマーク・印刷色・図案で表現。ローズはピンク、ライチはセージ色。共通の草飾り・HMD・上部突起はありません。</footer>
<script>
const products=[{"id":"vanilla修正前","maker":"修正前","name":"バニラ","src":"../angle-unified-v3/outputs/dobaj-vanilla.png","window":[268,112,720,1046],"size":[1254,1254]},{"id":"vanillaメーカー名なし","maker":"メーカー名なし","name":"バニラ","src":"outputs/dobaj-vanilla.png","window":[267,110,723,1050],"size":[1254,1254]},{"id":"coconut修正前","maker":"修正前","name":"ココナッツ","src":"../angle-unified-v3/outputs/dobaj-coconut.png","window":[246,71,805,1168],"size":[1254,1254]},{"id":"coconutメーカー名なし","maker":"メーカー名なし","name":"ココナッツ","src":"outputs/dobaj-coconut.png","window":[247,71,805,1169],"size":[1254,1254]},{"id":"mango修正前","maker":"修正前","name":"マンゴー","src":"../angle-unified-v3/outputs/dobaj-mango.png","window":[268,110,720,1050],"size":[1254,1254]},{"id":"mangoメーカー名なし","maker":"メーカー名なし","name":"マンゴー","src":"outputs/dobaj-mango.png","window":[267,108,722,1053],"size":[1254,1254]},{"id":"peach修正前","maker":"修正前","name":"ピーチ","src":"../angle-unified-v3/outputs/dobaj-peach.png","window":[237,67,808,1166],"size":[1254,1254]},{"id":"peachメーカー名なし","maker":"メーカー名なし","name":"ピーチ","src":"outputs/dobaj-peach.png","window":[236,64,810,1171],"size":[1254,1254]},{"id":"melon修正前","maker":"修正前","name":"メロン","src":"../angle-unified-v3/outputs/dobaj-melon.png","window":[268,111,722,1049],"size":[1254,1254]},{"id":"melonメーカー名なし","maker":"メーカー名なし","name":"メロン","src":"outputs/dobaj-melon.png","window":[267,109,725,1052],"size":[1254,1254]},{"id":"banana修正前","maker":"修正前","name":"バナナ","src":"../angle-unified-v3/outputs/dobaj-banana.png","window":[269,110,719,1050],"size":[1254,1254]},{"id":"bananaメーカー名なし","maker":"メーカー名なし","name":"バナナ","src":"outputs/dobaj-banana.png","window":[267,108,724,1052],"size":[1254,1254]},{"id":"rose修正前","maker":"修正前","name":"ローズ","src":"../angle-unified-v3/outputs/afsaal-rose.png","window":[268,111,722,1049],"size":[1254,1254]},{"id":"roseメーカー名なし","maker":"メーカー名なし","name":"ローズ","src":"outputs/afsaal-rose.png","window":[266,109,726,1052],"size":[1254,1254]},{"id":"lychee修正前","maker":"修正前","name":"ライチ","src":"../angle-unified-v3/outputs/afsaal-lychee.png","window":[266,81,750,1121],"size":[1254,1254]},{"id":"lycheeメーカー名なし","maker":"メーカー名なし","name":"ライチ","src":"outputs/afsaal-lychee.png","window":[266,80,753,1124],"size":[1254,1254]}];
const grid=document.getElementById('grid');
function render(){const n=Number(document.getElementById('size').value);grid.replaceChildren();for(const p of products){const [x,y,w,h]=p.window,k=Math.min(n*.88/w,n*.88/h);const card=document.createElement('article');card.className='card';card.dataset.id=p.id;const frame=document.createElement('div');frame.className='frame';frame.style.width=n+'px';frame.style.height=n+'px';const clip=document.createElement('span');clip.className='clip';clip.style.width=(w*k)+'px';clip.style.height=(h*k)+'px';const img=document.createElement('img');img.alt=p.maker+' '+p.name;img.src=p.src;img.style.width=(p.size[0]*k)+'px';img.style.height=(p.size[1]*k)+'px';img.style.left=(-x*k)+'px';img.style.top=(-y*k)+'px';clip.append(img);frame.append(clip);const name=document.createElement('div');name.className='name';name.textContent=p.name;const maker=document.createElement('div');maker.className='maker';maker.textContent=p.maker;card.append(frame,name,maker);grid.append(card)}}
document.getElementById('size').onchange=render;document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'背景を明るくする':'背景を暗くする'};render();
</script></html>
