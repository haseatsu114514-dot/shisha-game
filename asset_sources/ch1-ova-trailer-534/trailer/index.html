<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>第一章「煙がつなぐ街」予告 — 水煙前線 -EN:CODE-</title>
  <link rel="icon" href="../../../icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header><span>水煙前線 <small>-EN:CODE-</small></span><span>第一章「煙がつなぐ街」</span></header>
    <div id="screen" class="screen" data-phase="loading" data-cut="city-night">
      <canvas id="canvas" width="1280" height="720" role="img" aria-label="第一章の予告"></canvas>
      <div id="intro" class="overlay">
        <p class="eyebrow">第一章 · 90年代OVA風予告</p>
        <h1>煙がつなぐ街</h1>
        <p>この街で、夢が動き出す。</p>
        <button id="start" data-test="preview-start" disabled>読み込み中</button>
        <small>40秒 · 音楽と字幕</small>
      </div>
      <div id="end" class="overlay" hidden>
        <p class="eyebrow">第一章 · Smoke &amp; Ties</p>
        <h1>あなたなら、何を込める？</h1>
        <button id="replay">もう一度見る</button>
        <a href="chapter-one-ova.mp4" download>録画を保存</a>
      </div>
      <div id="error" class="overlay" hidden role="alert"><p>予告を読み込めませんでした。ページを再読み込みしてください。</p></div>
    </div>
    <nav aria-label="予告の再生操作">
      <button id="pause" disabled>一時停止</button>
      <button id="mute" aria-pressed="false">音あり</button>
      <label class="seek"><span class="sr">再生位置</span><input id="seek" type="range" min="0" max="40" step=".1" value="0" disabled></label>
      <output id="time">0:00 / 0:40</output>
      <button id="restart" disabled>最初から</button>
    </nav>
    <p class="note">Space：再生・一時停止　← →：5秒移動　M：音の切り替え</p>
    <p id="caption" class="sr" aria-live="off"></p>
  </main>
  <script type="module" src="player.js"></script>
</body>
</html>
