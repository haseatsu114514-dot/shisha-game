<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>第一章「煙がつなぐ街」— OVA風予告</title>
  <style>
    :root{color-scheme:dark;background:#080c12;color:#eee9df;font-family:system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0}main{max-width:1320px;margin:auto;padding:32px 24px}
    h1{font-size:28px;margin:0 0 10px;font-weight:600;letter-spacing:.05em}
    p{color:#b8b5ad;font-size:15px;line-height:1.7;margin:0 0 24px}
    a{color:#dfc598;text-underline-offset:4px}video{display:block;width:100%;aspect-ratio:16/9;background:#05070b}
    .links{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0 34px;font-size:14px}
    #gallery{background:#080c12;padding:24px 0}#gallery h2{font-size:23px;font-weight:500;margin:0 0 10px}
    #gallery>p{font-size:13px;color:#a9a496;margin-bottom:22px}
    .cuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    figure{margin:0;background:#141a23;border:1px solid #313844;overflow:hidden}
    figure a{display:block}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#05070b}
    figcaption{padding:14px 16px;color:#e3d9c5;font-size:15px;line-height:1.6}
    figcaption small{display:block;font-size:12px;color:#a5a6a6}
    @media(max-width:700px){main{padding:24px 12px}h1{font-size:22px}.cuts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}figcaption{padding:10px;font-size:13px}}
  </style>
</head>
<body><main>
  <h1>第一章「煙がつなぐ街」</h1>
  <p>街の出会いから、初めての大会へ。90年代OVA風の新しい6カットで描く、40秒の予告。</p>
  <video controls playsinline preload="metadata" poster="trailer/art/04-tsumugi-sketch.webp" src="trailer/chapter-one-ova.mp4"></video>
  <div class="links"><a href="trailer/">予告を再生</a><a href="trailer/chapter-one-ova.mp4" download>録画を保存</a><a href="https://github.com/haseatsu114514-dot/shisha-game/pull/536">PR #536</a></div>
  <section id="gallery">
    <h2>煙がつなぐ街 · 6つの場面</h2>
    <p>画像を選ぶと、文字を入れていない原画を見られます。</p>
    <div class="cuts">
      <figure><a href="images/01-city-night.png"><img src="trailer/art/01-city-night.webp" alt="雨上がりの街を歩くハジメ"></a><figcaption>01 · 街の灯り<small>いつもの街から、夢が動き出す。</small></figcaption></figure>
      <figure><a href="images/02-sumi-teaches.png"><img src="trailer/art/02-sumi-teaches.webp" alt="スミがハジメに準備を教える"></a><figcaption>02 · 師匠の言葉<small>技を学ぶ。その向こうに、人がいる。</small></figcaption></figure>
      <figure><a href="images/03-naru-invites.png"><img src="trailer/art/03-naru-invites.webp" alt="カウンターで友好的に迎えるなる"></a><figcaption>03 · ライバルの誘い<small>「うまくなりたいなら全部見てけ」</small></figcaption></figure>
      <figure><a href="images/04-tsumugi-sketch.png"><img src="trailer/art/04-tsumugi-sketch.webp" alt="ひびの入ったタブレットに猫を描く紬"></a><figcaption>04 · 紬が描く時間<small>店の日常を、彼女も一枚にしていく。</small></figcaption></figure>
      <figure><a href="images/05-rival-silhouette.png"><img src="trailer/art/05-rival-silhouette.webp" alt="顔を伏せたライバルがカーテンの向こうを見ている"></a><figcaption>05 · まだ知らない顔<small>黒髪と、小さな緑の手がかり。</small></figcaption></figure>
      <figure><a href="images/06-first-step.png"><img src="trailer/art/06-first-step.webp" alt="大会入口で緊張しているハジメ"></a><figcaption>06 · 最初の一歩<small>その一台に、何を込める？</small></figcaption></figure>
    </div>
  </section>
</main></body>
</html>
