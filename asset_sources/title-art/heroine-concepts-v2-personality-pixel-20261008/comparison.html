<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヒロインアート19案・背景とドット感</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191522;color:#f5effc;font:16px/1.6 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{margin:0 0 14px;color:#cfc3db}nav{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:#191522ef;padding:12px 0;z-index:3;backdrop-filter:blur(8px)}button{cursor:pointer;font:inherit;border:1px solid #756287;background:#30273e;color:#eee4fa;border-radius:20px;padding:6px 16px}button[aria-pressed="true"]{background:#cfb2ed;color:#24162f}section{margin:20px 0 34px}h2{font-size:22px;margin:0 0 4px}.description{font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}section[data-character="minto"] .grid{grid-template-columns:repeat(4,minmax(0,1fr))}figure{margin:0;border:1px solid #453650;border-radius:10px;overflow:hidden;background:#251e31}a{color:inherit;text-decoration:none}.art{display:block;width:100%;aspect-ratio:2/3;object-fit:contain;background:#130e1c}figcaption{padding:9px 12px;font-size:14px}.number{color:#bca2d3;margin-right:7px}.frame{display:none;position:relative;aspect-ratio:16/9;background:radial-gradient(ellipse at 70% 45%,#48345188,transparent 60%),linear-gradient(140deg,#241832,#130f20);overflow:hidden}.frame-art{position:absolute;right:-3.125%;top:0;width:43.75%;height:100%;background:center 20%/cover no-repeat;opacity:.95;mask-image:linear-gradient(to right,transparent,#000 34%);-webkit-mask-image:linear-gradient(to right,transparent,#000 34%);image-rendering:pixelated}.logo{position:absolute;width:41%;left:4%;top:11%;filter:drop-shadow(0 2px 3px #000)}.menu{position:absolute;top:48%;left:5%;font-size:clamp(7px,.75vw,12px);letter-spacing:1.8px;line-height:2;color:#fff}.menu span{display:block}.menu .muted{opacity:.4}body.title-mode .art{display:none}body.title-mode .frame{display:block}.previous{display:none;border-top:1px solid #675073}.previous p{margin:0;padding:7px 12px;background:#372c45;font-size:13px}body.previous-mode .previous{display:block}.note{font-size:13px;margin-top:14px;color:#b9a8c8}.hidden{display:none}.unavailable{min-height:100px;padding:20px;color:#c3b0d0}a:focus-visible,button:focus-visible{outline:3px solid #9ed9c5;outline-offset:3px}@media(max-width:900px){section[data-character="minto"] .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){main{padding:16px}h1{font-size:21px}.grid,section[data-character="minto"] .grid{grid-template-columns:1fr}figure{max-width:420px;width:100%;margin:auto}.menu{font-size:9px}nav{position:static}}@media print{nav{display:none}body{print-color-adjust:exact}}
</style>
<main>
<h1>ヒロインのタイトル用アート・19案</h1>
<p>6人 × 3場面 ＋ みんとの閉店後。台・背景・色を描き分け、現行タイトルに近い細かなドット感を加えました。</p>
<nav aria-label="比較表示">
<button data-mode="original" aria-pressed="true">原画</button>
<button data-mode="title" aria-pressed="false">タイトル右側で比較</button>
<button id="previous" aria-pressed="false">前の案も並べる</button>
<button data-filter="all" aria-pressed="true">全員</button>
<button data-filter="tsumugi" aria-pressed="false">つむぎ</button>
<button data-filter="mashiro" aria-pressed="false">ましろ</button>
<button data-filter="minto" aria-pressed="false">みんと</button>
<button data-filter="ageha" aria-pressed="false">アゲハ</button>
<button data-filter="rin" aria-pressed="false">凛</button>
<button data-filter="kafuka" aria-pressed="false">サメちゃん</button>
</nav>
<div id="gallery"></div>
<p class="note">画像を押すと加工していない原画を開きます。タイトル表示は現行の配置に当てはめた比較用モックアップです。</p>
</main>
<script>
const characters=[
 ['tsumugi','つむぎ','木の台と創作の部屋・タブレットの猫・日本の川辺', [['01-smoke-colors','煙の色と木のぬくもり'],['02-tablet-cat','タブレットの猫'],['03-twilight-sketch','川辺のスケッチ']]],
 ['mashiro','ましろ','真鍮の台とレトロ喫茶・朝の台所・雨の駅', [['01-heavy-smoke','レトロ喫茶の一服'],['02-tea-break','小さな台所でお茶'],['03-after-rain','雨の駅で待ち合わせ']]],
 ['minto','みんと','透明ガラスの台・チェキ・休日の私服・閉店後の素顔', [['01-cafe-welcome','ミント色のお出迎え'],['02-instant-photo','チェキ撮影コーナー'],['03-private-window','休日の窓辺'],['04-after-hours','閉店後の素顔']]],
 ['ageha','アゲハ','ピンクの台と試香席・優しい買い出しの笑顔・撮影スタジオ', [['01-professional-taste','ピンクの試香席'],['02-grocery-smile','昼の商店街で'],['03-model-moment','撮影スタジオの一瞬']]],
 ['rin','凛','黒い台と無機質な試香室・黒いダークリーフ・眼鏡とコーヒー', [['01-night-tasting','黒い試香室'],['02-flavor-samples','輸入サンプルを選ぶ'],['03-late-coffee','深夜の窓辺']]],
 ['kafuka','サメちゃん','青いキューブ型の台・サメ映画・水族館。王冠のコロちゃんと', [['01-shishark-test-run','シーシャークの試運転'],['02-shark-movie','コロちゃんとサメ映画'],['03-aquarium','水族館でコロちゃんと']]]
];
function artwork(src,label){
 const link=document.createElement('a');link.href=src;link.target='_blank';link.rel='noopener';link.setAttribute('aria-label',label+'の原画を開く');
 const img=document.createElement('img');img.className='art';img.src=src;img.alt=label;link.append(img);
 const frame=document.createElement('div');frame.className='frame';frame.setAttribute('aria-label',label+'のタイトル配置モックアップ');
 const art=document.createElement('div');art.className='frame-art';art.style.backgroundImage=`url("${src}")`;frame.append(art);
 const logo=document.createElement('img');logo.className='logo';logo.src='../../../assets/ui/ui_title_logo_rich.png';logo.alt='水煙前線 -EN:CODE-';frame.append(logo);
 const menu=document.createElement('div');menu.className='menu';for(const text of ['NEW GAME','LOAD','GALLERY','CONFIG']){const row=document.createElement('span');row.textContent=text;if(text==='LOAD')row.className='muted';menu.append(row)}frame.append(menu);link.append(frame);return link;
}
for(const[id,name,description,scenes]of characters){
 const section=document.createElement('section');section.dataset.character=id;
 const h=document.createElement('h2');h.textContent=name;section.append(h);
 const p=document.createElement('p');p.className='description';p.textContent=description;section.append(p);
 const grid=document.createElement('div');grid.className='grid';section.append(grid);
 scenes.forEach(([variant,label],index)=>{
  const figure=document.createElement('figure');figure.dataset.concept=id+'-'+variant;figure.append(artwork(`${id}/${variant}.png`,`${name} — ${label}`));
  const caption=document.createElement('figcaption'),number=document.createElement('span');number.className='number';number.textContent=String(index+1).padStart(2,'0');caption.append(number,document.createTextNode(label));figure.append(caption);
  const previous=document.createElement('div');previous.className='previous';
  const heading=document.createElement('p');heading.textContent='前の案・比較用';previous.append(heading);
  if(id!=='kafuka'&&index<3){previous.append(artwork(`../heroine-concepts-v1-20261008/${id}/${variant}.png`,`${name} — 前の案 ${label}`))}else{const empty=document.createElement('div');empty.className='unavailable';empty.textContent='今回の追加カット';previous.append(empty)}figure.append(previous);grid.append(figure);
 });document.querySelector('#gallery').append(section);
}
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.body.classList.toggle('title-mode',button.dataset.mode==='title');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('section').forEach(s=>s.classList.toggle('hidden',button.dataset.filter!=='all'&&s.dataset.character!==button.dataset.filter));document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
document.querySelector('#previous').addEventListener('click',event=>{const on=document.body.classList.toggle('previous-mode');event.currentTarget.setAttribute('aria-pressed',String(on))});
</script>
</html>
