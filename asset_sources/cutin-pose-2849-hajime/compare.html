<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はじめ カットイン姿勢比較 A / B / C</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a1220; color: #f3efe8; }
    body { margin: 0 auto; max-width: 1500px; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.4rem, 3vw, 2rem); }
    p { margin: 0 0 18px; color: #d7dce3; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { min-width: 0; border: 1px solid #637184; background: #101a29; }
    .scene { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: #071426 url('../../remake/img/ui/character_intros/graphic/bg_hajime.webp') center / cover no-repeat; }
    .scene img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
    .caption { padding: 12px; min-height: 5em; }
    .caption strong { display: block; font-size: 1.35rem; margin-bottom: 5px; }
    .caption span { color: #d7dce3; }
    .note { margin-top: 16px; font-size: .9rem; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .scene { aspect-ratio: 4 / 3; } }
  </style>
</head>
<body>
  <h1>はじめ カットイン姿勢比較</h1>
  <p>同一の現行ゲーム背景、同一サイズの透過人物画像で、姿勢の変化量を比較します。候補段階の資料です。</p>
  <main class="grid">
    <section class="card"><div class="scene"><img src="hajime-pose-A.png" alt="A: 両手をポケットに入れた立ち絵寄りの姿勢"></div><div class="caption"><strong>A — 立ち絵寄り</strong><span>両手はポケット。視線と表情を中心に変える基準案。</span></div></section>
    <section class="card"><div class="scene"><img src="hajime-pose-B.png" alt="B: 片手を胸元へ移した小さな姿勢変化"></div><div class="caption"><strong>B — 絶妙版</strong><span>片手を胸元へ。頭・肩・重心もわずかに動かす本命案。</span></div></section>
    <section class="card"><div class="scene"><img src="hajime-pose-C.png" alt="C: 帽子のつばに触れるやや強い姿勢変化"></div><div class="caption"><strong>C — 変化やや強め</strong><span>帽子のつばに触れる。立ち絵との連続性を保つ上限案。</span></div></section>
  </main>
  <p class="note">背景: 現行 <code>remake/img/ui/character_intros/graphic/bg_hajime.webp</code>。人物はゲームへ登録していません。</p>
</body>
</html>
