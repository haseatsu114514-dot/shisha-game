name: Remake fast smoke tests

# Browser-free checks for the current remake. Avoid touching story/romance files.
on:
  pull_request:
    paths:
      - 'remake/js/core/data.js'
      - 'remake/data/**'
      - 'remake/test/data_loading.mjs'
      - 'tools/check_active_json.py'
      - 'tools/audit_dialogue_art.py'
      - 'tools/check_dialogue_links.py'
      - 'remake/data/manifest.json'
      - 'remake/test/lover_dates.mjs'
      - 'remake/js/craft/steps.js'
      - 'remake/test/golden_ratio.mjs'
      - 'remake/js/daily/home-shisha.js'
      - 'remake/js/daily/home-rig.js'
      - 'remake/test/home_shisha.mjs'
      - 'remake/js/daily/reel.js'
      - 'remake/js/daily/cafe-ideas.js'
      - 'remake/js/chapters/ch2-story-data.js'
      - 'remake/test/reel_hints.mjs'
      - 'remake/test/cafe_ideas.mjs'
      - 'remake/test/ch2_ageha_story.mjs'
      - 'data/**'
      - '.github/workflows/remake-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'remake/js/core/data.js'
      - 'remake/data/**'
      - 'remake/test/data_loading.mjs'
      - 'remake/test/lover_dates.mjs'
      - 'remake/js/craft/steps.js'
      - 'remake/test/golden_ratio.mjs'
      - 'remake/js/daily/home-shisha.js'
      - 'remake/js/daily/home-rig.js'
      - 'remake/test/home_shisha.mjs'
      - 'remake/js/daily/reel.js'
      - 'remake/js/daily/cafe-ideas.js'
      - 'remake/js/chapters/ch2-story-data.js'
      - 'remake/test/reel_hints.mjs'
      - 'remake/test/cafe_ideas.mjs'
      - 'remake/test/ch2_ageha_story.mjs'
      - 'data/**'
      - '.github/workflows/remake-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remake-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Data loading smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate active JSON syntax
        run: python3 tools/check_active_json.py
      - name: Validate dialogue choice destinations
        run: python3 tools/check_dialogue_links.py
      - name: Audit dialogue art references (advisory)
        run: python3 tools/audit_dialogue_art.py
      - name: Validate production data loader
        run: node --experimental-vm-modules remake/test/data_loading.mjs
      - name: Validate handoff and daily shift dialogue
        run: node --experimental-vm-modules remake/test/daily_consistency.mjs
      - name: Validate recipe golden ratios (#627)
        run: node remake/test/golden_ratio.mjs
      - name: Validate home shisha bedtime puff (#638)
        run: node remake/test/home_shisha.mjs
      - name: Validate Pakki slot setting hints, guide and history (#634)
        run: node --experimental-vm-modules remake/test/reel_hints.mjs
      - name: Validate cafe recipe ideas (#621)
        run: node remake/test/cafe_ideas.mjs
      - name: Validate chapter 2 Ageha story wiring (#626)
        run: node remake/test/ch2_ageha_story.mjs
      - name: Validate romance date data when test is present
        shell: bash
        run: |
          if [[ -f remake/test/lover_dates.mjs ]]; then
            node remake/test/lover_dates.mjs
          else
            echo 'Romance date test not present on this branch; skipping.'
          fi
