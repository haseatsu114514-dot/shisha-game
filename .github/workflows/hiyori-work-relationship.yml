name: Hiyori work and relationship story
on:
  pull_request:
    paths:
      - 'data/dialogue/hiyori.json'
      - 'data/equipment.json'
      - 'data/dialogue/confession.json'
      - 'remake/js/core/hiyori-route.js'
      - 'remake/js/daily/hiyori.js'
      - 'remake/js/daily/bonds.js'
      - 'remake/js/daily/romance.js'
      - 'remake/test/browser/hiyori_work_relationship.mjs'
      - 'remake/test/browser/hiyori_hagal.mjs'
      - 'remake/js/craft/art.js'
      - 'remake/js/motions/gift.js'
      - 'assets/ui/making/bowl_empty_hiyori.png'
      - 'remake/test/browser/hiyori_axe_natural.mjs'
      - '.github/workflows/hiyori-work-relationship.yml'
permissions:
  contents: read
concurrency:
  group: hiyori-work-relationship-${{ github.ref }}
  cancel-in-progress: true
jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake
            data
            assets/audio
            assets/fonts
            assets/backgrounds
            assets/sprites
            assets/cgs
            assets/ui
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install pinned browser
        working-directory: remake/test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Actual work, both answers, interrupted reads, legacy relationships and LIME
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/hiyori-work-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then break; fi
            sleep 1
          done
          node remake/test/browser/hiyori_work_relationship.mjs
          node remake/test/browser/hiyori_hagal.mjs
          node remake/test/browser/save_load.mjs
          node --experimental-vm-modules remake/test/lime_consistency.mjs
      - name: Natural New Game through axe reveal to work and actual friend answer
        run: GOAL_HIYORI_WORK=1 ARTIFACT_DIR=.codex/artifacts/remake-browser/hiyori-work-natural node remake/test/browser/hiyori_axe_natural.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hiyori-work-relationship-results
          path: |
            .codex/artifacts/remake-browser/hiyori-work*
            .codex/artifacts/remake-browser/hiyori-hagal*
            .codex/artifacts/remake-browser/save-load*
            ${{ runner.temp }}/hiyori-work-preview.log
          retention-days: 7
  natural-gift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [pc, mobile]
    env:
      TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake
            data
            assets/audio
            assets/fonts
            assets/backgrounds
            assets/sprites
            assets/cgs
            assets/ui
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install pinned browser
        working-directory: remake/test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Natural New Game through actual axe, work, friend answer and gift
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/hiyori-gift-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then break; fi
            sleep 1
          done
          GOAL_HIYORI_GIFT=1 ONLY_DEVICE=${{ matrix.device }} ARTIFACT_DIR=.codex/artifacts/remake-browser/hiyori-gift-natural node remake/test/browser/hiyori_axe_natural.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hiyori-gift-natural-${{ matrix.device }}-results
          path: |
            .codex/artifacts/remake-browser/hiyori-gift-natural
            ${{ runner.temp }}/hiyori-gift-preview.log
          retention-days: 7
