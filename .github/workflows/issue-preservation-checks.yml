name: Issue preservation regressions
on:
  pull_request:
    paths:
      - '.github/workflows/issue-preservation.yml'
      - '.github/workflows/issue-preservation-checks.yml'
      - '.github/workflows/issue-claim.yml'
      - 'tools/issue_preservation.cjs'
      - 'tools/test_issue_preservation.mjs'
      - 'tools/issue_claim_coordinator.cjs'
      - 'tools/test_issue_claim.mjs'
      - 'docs/issue_preservation_protocol.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-preservation.yml'
      - '.github/workflows/issue-preservation-checks.yml'
      - '.github/workflows/issue-claim.yml'
      - 'tools/issue_preservation.cjs'
      - 'tools/test_issue_preservation.mjs'
      - 'tools/issue_claim_coordinator.cjs'
      - 'tools/test_issue_claim.mjs'
      - 'docs/issue_preservation_protocol.md'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede outdated PR runs; never cancel runs for pushes to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            /.github/workflows/issue-claim.yml
            /.github/workflows/issue-preservation.yml
            /.github/workflows/issue-preservation-checks.yml
            /tools/issue_claim_coordinator.cjs
            /tools/test_issue_claim.mjs
            /tools/issue_preservation.cjs
            /tools/test_issue_preservation.mjs
            /docs/issue_preservation_protocol.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test preservation refusals and existing reservation guards
        run: node --test tools/test_issue_preservation.mjs tools/test_issue_claim.mjs
