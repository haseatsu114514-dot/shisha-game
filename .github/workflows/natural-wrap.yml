name: Focused natural wrapping
on:
  pull_request:
    paths:
      - 'remake/js/vn/text.js'
      - 'remake/js/vn/budoux_ja.js'
      - 'remake/js/vn/layout.js'
      - 'remake/js/vn/inner.js'
      - 'remake/css/vn.css'
      - 'remake/css/base.css'
      - 'remake/css/ui-art.css'
      - 'remake/css/ui-inner.css'
      - 'remake/fonts/ZenKakuGothicNew-Medium.woff2'
      - 'remake/fonts/ZenKakuGothicNew-Bold.woff2'
      - 'remake/test/text_wrap.mjs'
      - 'remake/test/natural_wrap*'
      - 'remake/test/browser/natural_wrap.mjs'
      - 'tools/check_changed_dialogue_layout.mjs'
      - '.github/workflows/natural-wrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /remake/js/vn/text.js
            /remake/js/vn/budoux_ja.js
            /remake/js/vn/layout.js
            /remake/js/vn/inner.js
            /remake/css/vn.css
            /remake/css/base.css
            /remake/css/ui-art.css
            /remake/css/ui-inner.css
            /remake/fonts/ZenKakuGothicNew-Medium.woff2
            /remake/fonts/ZenKakuGothicNew-Bold.woff2
            /remake/test/text_wrap.mjs
            /remake/test/natural_wrap.mjs
            /remake/test/natural_wrap_cases.json
            /remake/test/browser/natural_wrap.mjs
            /tools/check_changed_dialogue_layout.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node remake/test/text_wrap.mjs --fixed-only
      - run: node remake/test/natural_wrap.mjs
      - name: Install test driver only; use runner Chrome
        run: npm install --prefix "$RUNNER_TEMP/wrap-driver" --no-audit --no-fund --ignore-scripts playwright@1.61.0
      - name: Shared layout with real font
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/wrap-driver/node_modules/playwright" node remake/test/browser/natural_wrap.mjs
