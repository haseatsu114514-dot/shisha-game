name: Hiyori formal axe story
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/dialogue/hiyori.json'
      - 'remake/js/core/hiyori-route.js'
      - 'remake/js/daily/hiyori*.js'
      - 'remake/js/daily/tonari.js'
      - 'remake/js/daily/calendar.js'
      - 'remake/js/minigames/**'
      - 'remake/js/vn/engine.js'
      - 'remake/test/browser/hiyori_axe_*.mjs'
      - 'remake/test/hiyori.mjs'
      - '.github/workflows/hiyori-axe-story.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede outdated PR runs; never cancel runs for pushes to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  story:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake
            data
            assets/audio
            assets/fonts
            assets/backgrounds
            assets/sprites
            assets/cgs
            assets/ui
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install pinned browser
        working-directory: remake/test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Read gates, actual play, cancellation, saves, relationships and LIME
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/hiyori-story-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then break; fi
            sleep 1
          done
          node remake/test/browser/hiyori_axe_story.mjs
          node remake/test/browser/save_load.mjs
          node --experimental-vm-modules remake/test/lime_consistency.mjs
      - name: Natural New Game to actual axe story on PC and touch
        run: node remake/test/browser/hiyori_axe_natural.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hiyori-axe-story-results
          path: |
            .codex/artifacts/remake-browser/hiyori-axe-*
            .codex/artifacts/remake-browser/save-load*
            ${{ runner.temp }}/hiyori-story-preview.log
          retention-days: 7
