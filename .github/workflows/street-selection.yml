name: Chapter 1 street selection
on:
  pull_request:
    paths:
      - 'remake/**'
      - 'data/**'
      - 'experiments/proto/street/**'
      - 'assets/proto_*/**'
      - 'assets/street_walk/**'
      - '.github/workflows/street-selection.yml'
  push:
    branches: [main]
    paths:
      - 'remake/**'
      - 'data/**'
      - 'experiments/proto/street/**'
      - 'assets/proto_*/**'
      - 'assets/street_walk/**'
      - '.github/workflows/street-selection.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede outdated PR runs; never cancel runs for pushes to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        route: [selection, direct, street]
    runs-on: ubuntu-latest
    # Include the observed ~7m npm setup delay; assertion deadlines stay unchanged.
    timeout-minutes: 25
    env:
      NODE_PATH: ${{ github.workspace }}/remake/test/browser/node_modules
      BASE_URL: http://127.0.0.1:8123/remake/
      SHOTS: .codex/artifacts/street/${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remake
            data
            experiments/proto/street
            assets/audio
            assets/fonts
            assets/backgrounds
            assets/sprites
            assets/cgs
            assets/ui
            assets/proto_street_set
            assets/street_walk
            assets/proto_walk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install pinned npm dependencies
        working-directory: remake/test/browser
        run: npm ci --prefer-offline --loglevel=http
      - name: Install and verify pinned Chromium
        working-directory: remake/test/browser
        run: |
          # Hosted libraries are present; avoid upgrading OS packages before
          # the full playthrough. Fail here if the pinned browser cannot launch.
          npx playwright install chromium
          node -e 'const { chromium } = require("playwright"); (async () => { const browser = await chromium.launch(); console.log("Browser:", browser.version()); await browser.close(); })().catch(error => { console.error(error); process.exitCode = 1; });'
      - name: Start current preview server
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/street-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/street-server.log"
          exit 1
      - name: Validate selection, saves and input on PC and touch
        if: matrix.route == 'selection'
        run: |
          node remake/test/street_projection.mjs
          node remake/test/browser/street_selection.mjs
          node --experimental-vm-modules remake/test/illness.mjs
      - name: Complete chapter with direct pins
        if: matrix.route == 'direct'
        run: |
          mkdir -p "$SHOTS"
          node remake/test/playthrough.mjs
      - name: Complete chapter with street entrances
        if: matrix.route == 'street'
        env:
          STREET_MODE: '1'
        run: |
          mkdir -p "$SHOTS"
          node remake/test/playthrough.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: street-${{ matrix.route }}
          path: .codex/artifacts/street
          if-no-files-found: ignore
