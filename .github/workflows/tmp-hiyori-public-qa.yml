name: tmp-hiyori-public-qa

on:
  push:
    branches:
      - codex/issue-341-hiyori-public-qa
    paths:
      - docs/qa/hiyori-public-issue341/.tmp-public-rerun-trigger

permissions:
  contents: write

concurrency:
  group: tmp-hiyori-public-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-341-hiyori-public-qa
          fetch-depth: 1
          sparse-checkout: |
            docs/qa/hiyori-public-issue341
            remake/test/browser
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install pinned Playwright and Chromium
        working-directory: remake/test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run natural public walkthrough on PC and touch
        env:
          BASE_URL: https://haseatsu114514-dot.github.io/shisha-game/remake/
          NODE_PATH: ${{ github.workspace }}/remake/test/browser/node_modules
          ARTIFACT_DIR: ${{ github.workspace }}/docs/qa/hiyori-public-issue341/walkthrough-after-sumi-contact
        run: |
          export CHROME_EXECUTABLE_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node docs/qa/hiyori-public-issue341/walkthrough.mjs
      - name: Save passing public QA evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/qa/hiyori-public-issue341/walkthrough-after-sumi-contact
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(hiyori): record public walkthrough after Sumi contact fix (#341)'
          git push origin HEAD:codex/issue-341-hiyori-public-qa
