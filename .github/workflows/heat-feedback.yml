name: Heat feedback

on:
  pull_request:
    paths:
      - "remake/js/craft/heat*.js"
      - "remake/js/craft/coals.js"
      - "remake/js/craft/common.js"
      - "remake/js/craft/session.js"
      - "remake/js/craft/pull.js"
      - "remake/css/craft.css"
      - "remake/css/base.css"
      - "remake/test/heat_feedback.mjs"
      - "remake/test/craft_templates_timing.mjs"
      - ".github/workflows/heat-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heat-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install browser test dependencies outside the game
        run: |
          npm install --prefix "$RUNNER_TEMP/heat-test" playwright@1.62.1
          node "$RUNNER_TEMP/heat-test/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check real coal inputs, ratings and panel bounds on PC and touch screens
        env:
          NODE_PATH: ${{ runner.temp }}/heat-test/node_modules
          SHOTS: ${{ runner.temp }}/heat-feedback
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/shisha-preview.log" 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8123/remake/", timeout=1).close()
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit("Preview server did not start")
          PY
          node remake/test/craft_templates_timing.mjs
          node remake/test/heat_feedback.mjs
      - name: Preserve coal screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heat-feedback
          path: ${{ runner.temp }}/heat-feedback
          if-no-files-found: ignore
