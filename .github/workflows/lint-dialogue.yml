name: Lint dialogue

# 台詞JSONの構造リンタ。旧名/旧設定の混入・未登録speaker・壊れたJSONを
# ERROR として検出し、main / claude/** への push と PR で止める。
# （重い web ヘッドレステストはローカル運用のまま。これは軽量な静的検査）

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "data/dialogue/**"
      - "data/characters.json"
      - "data/story_routes.json"
      - "data/relationship_memories.json"
      - "brand/story_and_structure.md"
      - "brand/character_profiles.md"
      - "remake/data/lover.json"
      - "remake/js/core/story-routes.js"
      - "remake/test/story_routes.mjs"
      - "tools/check_story_canon.py"
      - "tools/test_story_canon.py"
      - "tools/check_dialogue_links.py"
      - "tools/lint_dialogue.py"
      - ".github/workflows/lint-dialogue.yml"
  pull_request:
    paths:
      - "data/dialogue/**"
      - "data/characters.json"
      - "data/story_routes.json"
      - "data/relationship_memories.json"
      - "brand/story_and_structure.md"
      - "brand/character_profiles.md"
      - "remake/data/lover.json"
      - "remake/js/core/story-routes.js"
      - "remake/test/story_routes.mjs"
      - "tools/check_story_canon.py"
      - "tools/test_story_canon.py"
      - "tools/check_dialogue_links.py"
      - "tools/lint_dialogue.py"
      - ".github/workflows/lint-dialogue.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run dialogue linter
        run: python3 tools/lint_dialogue.py
      - name: Check active canon and references
        run: |
          python3 tools/check_story_canon.py
          python3 tools/check_dialogue_links.py
          python3 tools/test_story_canon.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check relationship scene selection
        run: node remake/test/story_routes.mjs
