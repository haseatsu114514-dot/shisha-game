name: Playthrough purchase planning
on:
  push:
    branches: [main]
    paths: ["remake/test/playthrough*.mjs", "remake/js/core/illness.js", "remake/js/core/condition.js", ".github/workflows/playthrough-planning.yml"]
  pull_request:
    paths: ["remake/test/playthrough*.mjs", "remake/js/core/illness.js", "remake/js/core/condition.js", ".github/workflows/playthrough-planning.yml"]
permissions:
  contents: read
concurrency:
  group: playthrough-planning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake/test
            remake/js/core
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Required shopping under illness delays and failed inputs
        run: node --test remake/test/playthrough-plan.test.mjs remake/test/playthrough-shopping.test.mjs
