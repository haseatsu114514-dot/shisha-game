name: DS packing regression

on:
  pull_request:
    paths:
      - 'remake/css/game-ds.css'
      - 'remake/css/craft.css'
      - 'remake/css/worker-scenes.css'
      - 'remake/js/craft/**'
      - 'remake/test/browser/ds_packing.mjs'
      - 'remake/test/browser/craft_layout_703.mjs'
      - 'remake/test/browser/package*.json'
      - '.github/workflows/ds-packing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede outdated PR runs; never cancel runs for pushes to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHROME_EXECUTABLE_PATH: /opt/google/chrome/chrome
      ARTIFACT_DIR: .codex/artifacts/ds-packing
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install pinned test dependencies
        working-directory: remake/test/browser
        run: npm ci
      - name: Check existing vendor Chrome
        run: test -x "$CHROME_EXECUTABLE_PATH"
      - name: Start production preview server
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/ds-packing-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ds-packing-preview.log"
          exit 1
      - name: Isolated LOAD to packing on PC and touch, sandbox enabled
        run: node remake/test/browser/ds_packing.mjs
      - name: Initial thermometer and craft layout regressions
        run: node remake/test/browser/craft_layout_703.mjs
      - name: Preserve fixture, inputs, geometry and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ds-packing-results
          path: |
            .codex/artifacts/ds-packing/
            ${{ runner.temp }}/ds-packing-preview.log
          retention-days: 7
