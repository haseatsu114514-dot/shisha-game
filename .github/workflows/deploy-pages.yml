# 現行の remake/ と共有データ・素材を GitHub Pages に公開する（ビルド不要）。
# 旧ブラウザ版・単一HTML配布は2026-10-07のオーナー指示で廃止。
name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "data/**"
      - "remake/**"
      - "experiments/proto/street/**"
      - "icon.svg"
      - "tools/browser/flavor_stats_editor.html"
      - "tools/title-review/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 公開に使うフォルダだけ取得する（asset_sources/ や docs/ の約3.7GBは取らない）。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/
            /data/
            /remake/
            /experiments/proto/street/
            /icon.svg
            /tools/browser/flavor_stats_editor.html
            /tools/title-review/
            /tools/ci/lfs_images.sh
            /asset_sources/shisha-hardware-reference/skin-candidates-issue374/candidates.json
            /asset_sources/shisha-hardware-reference/skin-candidates-issue374/render-preview.json
      # 新しく追加した画像は Git LFS に入っている。全部取得しないと本番で
      # 131バイトのポインタが画像の代わりに配信される（告白CG・限定フレーバー等）。
      # LFSの実体はキャッシュし、新しい画像の分だけダウンロードする。
      - name: List game images stored in Git LFS
        id: lfs-list
        run: echo "hash=$(tools/ci/lfs_images.sh hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-game-${{ steps.lfs-list.outputs.hash }}
          restore-keys: lfs-game-
      - name: Fetch game images stored in Git LFS
        # 本番へポインタを出さない: 取得後にポインタが残っていれば失敗する。
        run: tools/ci/lfs_images.sh fetch
      - name: Prepare site
        run: |
          mkdir -p _site/tools
          cp -r assets _site/assets
          cp icon.svg _site/icon.svg
          # ルートはユーザー指定のメインであるリメイク版へ転送
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
          <meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=./remake/">
          <title>水煙前線 -EN:CODE-</title>
          <script>location.replace("./remake/" + location.search + location.hash);</script>
          </head>
          <body style="background:#0a0612;color:#c5b896;font-family:serif;text-align:center;padding-top:20vh">
          <p>ゲームへ移動中……<br><a href="./remake/" style="color:#f4d27a">開かない場合はこちら</a></p>
          </body>
          </html>
          HTML
          cp tools/browser/flavor_stats_editor.html _site/tools/flavor_stats_editor.html
          # 選別用生成画像だけ配信。asset_sources の写真・元資料はコピーしない。
          mkdir -p _site/tools/title-review
          cp tools/title-review/{index.html,style.css,app.js,model.mjs,catalog.json} _site/tools/title-review/
          cp -r tools/title-review/media _site/tools/title-review/media
          # 現行版は共有JSONを直接読む
          cp -r remake _site/remake
          cp -r data _site/data
          # 外観の正本メタデータだけ公開。原画・写真・生成指示は配信しない。
          appearance_source=asset_sources/shisha-hardware-reference/skin-candidates-issue374
          mkdir -p "_site/$appearance_source"
          cp "$appearance_source/"{candidates.json,render-preview.json} "_site/$appearance_source/"
          # 本編が使用する既存ハリボテ歩行のみを同じ相対パスで配信。
          mkdir -p _site/experiments/proto/street
          cp experiments/proto/street/{index.html,street.js,stage_hankagai.json,stage_hankagai_hd.json,stage_hankagai_set.json} _site/experiments/proto/street/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          # Pages側のキューが詰まると既定10分では deployment_queued のまま
          # タイムアウトする（2026-07-02 に5連続で発生）。20分まで粘る
          timeout: 1200000
      # Pages基盤が「Deployment failed, try again later」を返すことがある
      # （2026-07-03 run166 で発生）。間を置いて1回だけ再試行する
      - name: Wait before retrying transient Pages failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
