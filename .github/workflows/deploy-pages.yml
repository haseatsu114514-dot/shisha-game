# ソースから web/dist/shisha_ch1.html（1ファイル版）を生成し、GitHub Pages に公開する。
# main または開発ブランチ（claude/**）への push のたびに
# https://haseatsu114514-dot.github.io/shisha-game/ が更新される。
name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "assets/**"
      - "data/**"
      - "web/css/**"
      - "web/js/**"
      - "web/dist/**"
      - "web/tools/**"
      - "web/build_data.py"
      - "web/build_standalone.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python3 -m pip install --upgrade pip Pillow
      - name: Build standalone web bundle
        run: |
          python3 web/build_data.py
          python3 web/build_standalone.py
      - name: Prepare site
        run: |
          mkdir -p _site/tools
          cp web/dist/shisha_ch1.html _site/index.html
          cp web/tools/flavor_stats_editor.html _site/tools/flavor_stats_editor.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
