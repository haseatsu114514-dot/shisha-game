name: Samechan date regressions
on:
  pull_request:
    paths:
      - 'remake/data/lover.json'
      - 'remake/js/daily/samechan-date.js'
      - 'remake/js/daily/date-scene.js'
      - 'remake/js/daily/samechan-bonds.js'
      - 'remake/js/daily/romance.js'
      - 'remake/js/daily/calendar.js'
      - 'remake/js/daily/phone.js'
      - 'remake/js/core/state.js'
      - 'remake/js/core/stats.js'
      - 'remake/test/browser/samechan_dates.mjs'
      - '.github/workflows/samechan-dates.yml'
  push:
    branches: [main]
    paths:
      - 'remake/data/lover.json'
      - 'remake/js/daily/samechan-date.js'
      - 'remake/js/daily/date-scene.js'
      - 'remake/js/daily/samechan-bonds.js'
      - 'remake/js/daily/romance.js'
      - 'remake/js/daily/calendar.js'
      - 'remake/js/daily/phone.js'
      - 'remake/js/core/state.js'
      - 'remake/js/core/stats.js'
      - 'remake/test/browser/samechan_dates.mjs'
      - '.github/workflows/samechan-dates.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede outdated PR runs; never cancel runs for pushes to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake
            data
            assets/audio
            assets/fonts
            assets/backgrounds
            assets/sprites
            assets/cgs
            assets/ui
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install pinned browser
        working-directory: remake/test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: PC and touch LIME, dates, chapters, interruption and legacy saves
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/samechan-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then break; fi
            sleep 1
          done
          node remake/test/browser/samechan_dates.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: samechan-date-results
          path: |
            .codex/artifacts/remake-browser/samechan-dates*
            ${{ runner.temp }}/samechan-preview.log
          retention-days: 7
