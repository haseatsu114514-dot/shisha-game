name: Issue claim coordinator
run-name: "${{ inputs.operation || github.event_name }} #${{ inputs.issue || github.event.issue.number }} / ${{ inputs.owner || github.actor }} / ${{ inputs.request_id || github.event.comment.id }}"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reservation operation
        required: true
        type: choice
        options: [claim, release, handoff]
      issue:
        description: Target Issue number
        required: true
        type: string
      owner:
        description: Unique worker session ID
        required: true
        type: string
      request_id:
        description: Unique request ID
        required: false
        type: string
      summary:
        description: Handoff only; saved PR/branch and DONE / TODO / TEST / NEXT (max 1200 characters)
        required: false
        type: string
      agent:
        description: Worker type
        required: false
        default: any
        type: choice
        options: [codex, claude, any]
  issue_comment:
    types: [created]
permissions:
  issues: write
  contents: read
jobs:
  coordinate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/issue-claim '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: issue-claim-${{ inputs.issue || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: /tools/issue_claim_coordinator.cjs
          sparse-checkout-cone-mode: false
      - name: Coordinate reservation
        uses: actions/github-script@v7
        env:
          OPERATION: ${{ inputs.operation }}
          ISSUE: ${{ inputs.issue }}
          OWNER: ${{ inputs.owner }}
          AGENT: ${{ inputs.agent }}
          REQUEST_ID: ${{ inputs.request_id }}
          SUMMARY: ${{ inputs.summary }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {runEvent} = require('./tools/issue_claim_coordinator.cjs');
            await runEvent(github, context, core, process.env);
