name: Issue claim coordinator
run-name: "${{ inputs.operation || github.event_name }} #${{ inputs.issue || github.event.issue.number }} / ${{ inputs.owner || github.actor }} / ${{ inputs.request_id || github.event.comment.id }}"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reservation operation, or maintain completed claims and outdated instructions
        required: true
        type: choice
        options: [next, claim, release, status, transfer, park, resume, maintain]
      issue:
        description: Issue number (except next or maintain)
        required: false
        type: string
      owner:
        description: Unique worker session ID
        required: false
        type: string
      request_id:
        description: Unique request ID
        required: false
        type: string
      claim_run:
        description: Current successful reservation run (transfer, park, resume or status)
        required: false
        type: string
      handoff_comment:
        description: Stopped/pushed handoff record for transfer
        required: false
        type: string
      agent:
        description: Worker type
        required: false
        default: any
        type: choice
        options: [codex, claude, any]
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited, reopened, closed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-claim.yml'
      - 'tools/issue_claim_coordinator.cjs'
      - 'docs/issue_claim_protocol.md'
  schedule:
    - cron: '23 3 * * *'
permissions:
  issues: write
  contents: read
  pull-requests: read
  actions: read
jobs:
  coordinate:
    if: >-
      (github.event_name != 'issue_comment' ||
      (github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/issue-claim '))) &&
      (github.event_name != 'issues' || github.event.action == 'closed' ||
      contains(github.event.issue.body, 'claim/status') || contains(github.event.issue.body, 'status成功') ||
      contains(github.event.issue.body, '1worker1') || contains(github.event.issue.body, 'issue-claim-policy:v2'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: issue-claim-coordinator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/issue_claim_coordinator.cjs
          sparse-checkout-cone-mode: false
      - name: Coordinate reservations and maintenance
        uses: actions/github-script@v7
        env:
          OPERATION: ${{ inputs.operation }}
          ISSUE: ${{ inputs.issue }}
          OWNER: ${{ inputs.owner }}
          AGENT: ${{ inputs.agent }}
          REQUEST_ID: ${{ inputs.request_id }}
          CLAIM_RUN: ${{ inputs.claim_run }}
          HANDOFF_COMMENT: ${{ inputs.handoff_comment }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {runWorkflow} = require('./tools/issue_claim_coordinator.cjs');
            await runWorkflow(github, context, core, process.env);
