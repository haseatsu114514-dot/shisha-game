name: AI documentation checks
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'tools/check_agent_docs.py'
      - '.github/workflows/agent-docs.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'tools/check_agent_docs.py'
      - '.github/workflows/agent-docs.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate AI documentation
        run: python3 tools/check_agent_docs.py
