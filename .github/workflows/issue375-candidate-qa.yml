name: Issue 375 candidate QA
on:
  pull_request:
    paths:
      - 'asset_sources/heroine-title-candidates-20261009/review-issue375/**'
      - '.github/workflows/issue375-candidate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==12.3.0
      - name: Verify PNG provenance and review status
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          base = Path('asset_sources/heroine-title-candidates-20261009/review-issue375/background-plants')
          records = json.loads((base / 'candidates.json').read_text())['items']
          assert len(records) == 2
          for row in records:
              assert row['approved'] is False and row['runtime_paths'] == []
              for file, expected in [(row['path'], row['sha256']), (row['source_path'], row['source_sha256'])]:
                  assert hashlib.sha256(Path(file).read_bytes()).hexdigest() == expected, file
              with Image.open(row['path']) as image:
                  image.load()
                  assert image.size == (1024, 1536) and image.mode == 'RGB'
          print('PASS: 2 candidate/source hashes, native size, owner review pending, unregistered')
          PY
      - run: python3 tools/check_agent_docs.py
      - run: npm ci --prefix remake/test/browser
      - run: cd remake/test/browser && npx playwright install --with-deps chromium
      - name: Preview candidates through the production title renderer
        env:
          BASE_URL: http://127.0.0.1:8123/remake/
          TEST_REF: ${{ github.sha }}
          ARTIFACT_DIR: qa-results
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > /tmp/issue375-preview.log 2>&1 &
          node asset_sources/heroine-title-candidates-20261009/review-issue375/background-plants/preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue375-candidate-qa
          path: qa-results
