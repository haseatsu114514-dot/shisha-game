name: Facility encounters and Eden service
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/dialogue/ch1_spots.json'
      - 'data/dialogue/ch1_adam.json'
      - 'data/characters.json'
      - 'remake/js/daily/spots.js'
      - 'remake/js/daily/spot-encounters.js'
      - 'remake/js/vn/**'
      - 'remake/js/core/state.js'
      - 'remake/test/browser/spot_encounters.mjs'
      - '.github/workflows/spot-encounters.yml'
  push:
    branches: [main]
    paths: ['remake/js/daily/spot*', 'data/dialogue/ch1_spots.json', 'data/dialogue/ch1_adam.json']
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede outdated PR runs; never cancel runs for pushes to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  encounters:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      ARTIFACT_DIR: .codex/artifacts/remake-browser/spot-encounters
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake
            data
            assets/audio
            assets/fonts
            assets/backgrounds
            assets/sprites
            assets/cgs
            assets/ui
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install pinned browser
        working-directory: remake/test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Encounters, choices, saves, disclosure, zero affinity and actual map actions
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/spot-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then break; fi
            sleep 1
          done
          node remake/test/browser/spot_encounters.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: spot-encounters-results
          path: |
            .codex/artifacts/remake-browser/spot-encounters/
            ${{ runner.temp }}/spot-preview.log
          retention-days: 7
