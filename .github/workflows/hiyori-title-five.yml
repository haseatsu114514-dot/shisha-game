name: Hiyori five title illustrations
on:
  pull_request:
    paths:
      - 'assets/ui/title_arts/**'
      - 'remake/img/ui/title_arts/**'
      - 'remake/data/manifest.json'
      - 'remake/js/scenes/title*.js'
      - 'remake/test/title_arts.mjs'
      - 'remake/test/browser/hiyori_title_five.mjs'
      - 'asset_sources/hiyori-title-five-issue486/**'
      - '.github/workflows/hiyori-title-five.yml'
permissions:
  contents: read
concurrency:
  group: hiyori-title-five-${{ github.ref }}
  cancel-in-progress: true
jobs:
  illustrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake
            data
            assets/audio
            assets/fonts
            assets/backgrounds
            assets/sprites
            assets/cgs
            assets/ui
            asset_sources/hiyori-title-five-issue486
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install image validation and pinned Chromium
        run: |
          python3 -m pip install pillow
          npm ci --prefix remake/test/browser
          cd remake/test/browser
          npx playwright install --with-deps chromium
      - name: Source identity and previously adopted artwork
        run: python3 asset_sources/hiyori-title-five-issue486/validate.py
      - name: Actual five-image picker, menus and legacy relationship saves
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/title-five-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then break; fi
            sleep 1
          done
          COMPARISON_DIR=.codex/artifacts/remake-browser/hiyori-title-poses node remake/test/browser/hiyori_title_five.mjs
          node remake/test/title_arts.mjs
          node remake/test/browser/save_load.mjs
          node --experimental-vm-modules remake/test/lime_consistency.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hiyori-title-five-results
          path: |
            .codex/artifacts/remake-browser/hiyori-title*
            .codex/artifacts/remake-browser/title-arts*
            .codex/artifacts/remake-browser/title-variants
            .codex/artifacts/remake-browser/save-load*
            ${{ runner.temp }}/title-five-preview.log
          retention-days: 7
