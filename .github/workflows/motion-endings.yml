name: Motion endings

on:
  pull_request:
    paths:
      - "remake/js/motions/**"
      - "remake/js/core/mg-kit.js"
      - "remake/js/core/scene-motions.js"
      - "remake/js/core/transition*.js"
      - "remake/js/core/ui.js"
      - "remake/js/daily/map.js"
      - "remake/css/motions*.css"
      - "remake/css/motions/**"
      - "remake/css/vn.css"
      - "remake/test/motion_endings.mjs"
      - "remake/test/navigation_transitions.mjs"
      - "remake/test/load_recorder.mjs"
      - "remake/tools/load-recorder.mjs"
      - "remake/tools/measure_load.mjs"
      - ".github/workflows/motion-endings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-endings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install browser test dependencies outside the game
        run: |
          npm install --prefix "$RUNNER_TEMP/motion-test" playwright@1.62.1
          node "$RUNNER_TEMP/motion-test/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Play adopted motions and check their endings
        env:
          NODE_PATH: ${{ runner.temp }}/motion-test/node_modules
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/shisha-preview.log" 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8123/remake/", timeout=1).close()
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit("Preview server did not start")
          PY
          node remake/test/load_recorder.mjs
          node remake/test/motion_endings.mjs
          node remake/test/navigation_transitions.mjs
