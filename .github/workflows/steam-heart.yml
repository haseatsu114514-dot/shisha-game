name: Steam heart collision boundaries
on:
  pull_request:
    paths: ['remake/js/craft/steam*.js', 'remake/css/steam.css', 'remake/test/steam_heart.mjs', '.github/workflows/steam-heart.yml']
  push:
    branches: [main]
    paths: ['remake/js/craft/steam*.js', 'remake/css/steam.css', 'remake/test/steam_heart.mjs', '.github/workflows/steam-heart.yml']
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake/js/craft
            remake/test
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: node remake/test/steam_heart.mjs
