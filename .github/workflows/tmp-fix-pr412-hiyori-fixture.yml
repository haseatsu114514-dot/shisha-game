name: Temporary PR 412 fixture fix

on:
  push:
    branches:
      - codex/issue-411-sumi-initial-lime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: codex/issue-411-sumi-initial-lime
      - name: Update Hiyori save fixture for initial Sumi contact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('remake/test/hiyori.mjs')
          text = p.read_text()
          old = 's.met.hiyori = true; s.contacts = ["hiyori"]; s.affinity.hiyori = 30;'
          new = 's.met.hiyori = true; s.contacts = ["sumi", "hiyori"]; s.affinity.hiyori = 30;'
          if old not in text:
              raise SystemExit('expected fixture line not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- remake/test/hiyori.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add remake/test/hiyori.mjs
          git commit -m "test(hiyori): include initial Sumi contact in save fixture (#411)"
          git push origin HEAD:codex/issue-411-sumi-initial-lime
