name: tmp-fix-pr412-tsumugi

on:
  push:
    branches:
      - codex/issue-411-sumi-initial-lime
    paths:
      - remake/test/.tmp-pr412-tsumugi-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-411-sumi-initial-lime
          fetch-depth: 0
      - name: Patch stale Tsumugi contact expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('remake/test/tsumugi_story.mjs')
          s = p.read_text()
          old = '    assert.deepEqual(result.contacts, ["tsumugi"]);'
          new = '    assert.deepEqual(result.contacts, ["sumi", "tsumugi"]);'
          if new in s:
              print('already patched')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              raise SystemExit('expected line not found')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then exit 0; fi
          git add remake/test/tsumugi_story.mjs
          git commit -m 'test(tsumugi): include initial Sumi contact (#411)'
          git push origin HEAD:codex/issue-411-sumi-initial-lime
