name: Mix temperature model and routes

on:
  pull_request:
    paths:
      - 'data/flavors.json'
      - 'remake/js/craft/**'
      - 'remake/css/craft.css'
      - 'remake/test/mix_temperature.mjs'
      - 'remake/test/steam_temperature.mjs'
      - 'remake/test/thermal_background.mjs'
      - 'remake/test/pull_draw.mjs'
      - 'remake/test/craft_focus.mjs'
      - 'remake/test/browser/mix_temperature.mjs'
      - '.github/workflows/mix-temperature.yml'
  push:
    branches: [main]
    paths:
      - 'data/flavors.json'
      - 'remake/js/craft/**'
      - 'remake/css/craft.css'
      - 'remake/test/mix_temperature.mjs'
      - 'remake/test/browser/mix_temperature.mjs'
      - '.github/workflows/mix-temperature.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mix-temperature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  temperature:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake
            data
            assets/audio
            assets/fonts
            assets/backgrounds
            assets/sprites
            assets/cgs
            assets/ui
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Model, score, effects and physical warming boundaries
        run: |
          node remake/test/mix_temperature.mjs
          node remake/test/steam_temperature.mjs
      - name: Install pinned browser dependencies
        working-directory: remake/test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/temperature-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/temperature-preview.log"
          exit 1
      - name: Gram input, supplied mint, every boundary, legacy saves, auto and care
        run: node remake/test/browser/mix_temperature.mjs
      - name: Existing thermal, inhalation and craft regressions
        env:
          NODE_PATH: ${{ github.workspace }}/remake/test/browser/node_modules
          SHOTS: .codex/artifacts/remake-browser/temperature-regressions
        run: |
          export CHROME_EXECUTABLE_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node remake/test/thermal_background.mjs
          node remake/test/pull_draw.mjs
          node remake/test/craft_focus.mjs
      - name: Preserve temperature results and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mix-temperature-results
          path: |
            .codex/artifacts/remake-browser/
            ${{ runner.temp }}/temperature-preview.log
          retention-days: 7
