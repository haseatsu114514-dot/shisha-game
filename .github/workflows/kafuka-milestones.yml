name: Kafuka milestone regressions
on:
  pull_request:
    paths:
      - 'data/dialogue/kafuka.json'
      - 'data/dialogue/lover_events.json'
      - 'data/dialogue/confession.json'
      - 'remake/js/daily/kafuka-bonds.js'
      - 'remake/js/daily/romance.js'
      - 'remake/js/core/state.js'
      - 'remake/js/core/stats.js'
      - 'remake/test/browser/kafuka_milestones.mjs'
      - '.github/workflows/kafuka-milestones.yml'
  push:
    branches: [main]
    paths:
      - 'data/dialogue/kafuka.json'
      - 'data/dialogue/lover_events.json'
      - 'data/dialogue/confession.json'
      - 'remake/js/daily/kafuka-bonds.js'
      - 'remake/js/daily/romance.js'
      - 'remake/js/core/state.js'
      - 'remake/js/core/stats.js'
      - 'remake/test/browser/kafuka_milestones.mjs'
      - '.github/workflows/kafuka-milestones.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kafuka-milestones-${{ github.ref }}
  cancel-in-progress: true
jobs:
  milestones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            remake
            data
            assets/audio
            assets/fonts
            assets/backgrounds
            assets/sprites
            assets/cgs
            assets/ui
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remake/test/browser/package-lock.json
      - name: Install pinned browser
        working-directory: remake/test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: PC and touch ordered milestones, interruption and legacy saves
        run: |
          python3 remake/tools/serve_preview.py --port 8123 > "$RUNNER_TEMP/kafuka-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8123/remake/; then break; fi
            sleep 1
          done
          node remake/test/browser/kafuka_milestones.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: kafuka-milestone-results
          path: |
            .codex/artifacts/remake-browser/kafuka-milestones*
            ${{ runner.temp }}/kafuka-preview.log
          retention-days: 7
