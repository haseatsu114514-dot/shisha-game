name: Verify and package tested story build for PR 171

on:
  push:
    branches: ["codex/build-story-distribution-171"]
    paths: [".github/workflows/build-story-distribution-171.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "6611055173b0afd876072cd70c5cfd6b85be070f"
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tested build dependencies
        run: python3 -m pip install Pillow==12.3.0 numpy==2.3.5 scipy==1.17.0
      - name: Rebuild and verify the tested output
        run: |
          set -euo pipefail
          python3 web/build_data.py
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          path = Path("web/js/data.js")
          tested = subprocess.check_output(["git", "show", "HEAD:web/js/data.js"], text=True)
          def bundle(text):
              match = re.search(r"window\.GAME_DATA\s*=\s*(\{.*\});?\s*$", text, re.S)
              assert match, "Data bundle wrapper not found"
              data = json.loads(match.group(1))
              data.pop("build", None)
              return data
          assert bundle(path.read_text()) == bundle(tested), "Game data differs from tested bundle"
          path.write_text(tested, encoding="utf-8")
          print("All game data matches; restored only the tested build stamp")
          PY
          python3 web/build_standalone.py
          test "$(git hash-object web/js/data.js)" = "2dafafcfaa2f8dedd46126ca3e86f6699a551c1b"
          test "$(git hash-object web/dist/shisha_ch1.html)" = "8881ec8f2bd2e862038f6480757133fc9a0b94b7"
      - uses: actions/upload-artifact@v4
        with:
          name: shisha-story-pr-171
          path: web/dist/shisha_ch1.html
          if-no-files-found: error
          retention-days: 7
