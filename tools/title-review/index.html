<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タイトル画像選別</title><style>body{margin:0;background:#10151e;color:#fff;font:16px system-ui}header{padding:14px;background:#202b3c;position:sticky;top:0;z-index:2}main{max-width:750px;margin:auto;padding:14px}button,select{background:#35445c;color:white;border:1px solid #6c7890;border-radius:9px;padding:12px;font:inherit}button{cursor:pointer}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.no{background:#813b44}.hold{background:#80612b}.yes{background:#196b55}img{display:block;max-width:100%;max-height:65vh;object-fit:contain;margin:auto}#frame{min-height:48vh;display:grid;place-items:center;background:#080b11;border-radius:15px;padding:12px}#error{color:#ffb9b9;overflow-wrap:anywhere}#nav{display:flex;justify-content:space-between;gap:8px;margin:12px 0}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}#grid button{padding:4px;overflow:hidden;font-size:11px}#grid img{width:100%;height:115px;object-fit:contain}small{color:#c3cad6}a{color:#9bd5ff}</style></head><body><header><b>タイトル画像 選別ギャラリー</b> <span id="count"></span><div><select id="filter"><option value="">全候補</option><option>新版19案</option><option>旧版15案</option><option>現行タイトル18枚</option></select> <button id="export">判定JSON保存</button></div></header><main><p id="name"></p><div id="frame"><img id="hero" alt="選別対象画像"><div id="error" hidden></div></div><div class="buttons"><button class="no" onclick="judge('reject')">× 不採用</button><button class="hold" onclick="judge('hold')">？ 保留</button><button class="yes" onclick="judge('adopt')">✓ 採用</button></div><div id="nav"><button onclick="move(-1)">← 前</button><button onclick="judge(null)">判定を戻す</button><button onclick="move(1)">次 →</button></div><small>結果はこのブラウザに保存。画像が出ない場合はパスと読み込みエラーを表示します。GitHubへの自動反映・画像削除は行いません。</small><div id="grid"></div></main><script>const all=[{"group":"新版19案","ch "minto","path":"assets/ui/title_arts/title_art_minto_04_after_hours.png"},{"group":"現行タイトル18枚","character":"rin","path":"assets/ui/title_arts/title_art_rin_01_night_tasting.png"},{"group":"現行タイトル18枚","character":"rin","path":"assets/ui/title_arts/title_art_rin_03_late_coffee.png"},{"group":"現行タイトル18枚","character":"tsumugi","path":"assets/ui/title_arts/title_art_tsumugi_01_smoke_colors.png"},{"group":"現行タイトル18枚","character":"tsumugi","path":"assets/ui/title_arts/title_art_tsumugi_02_tablet_cat.png"},{"group":"現行タイトル18枚","character":"tsumugi","path":"assets/ui/title_arts/title_art_tsumugi_03_twilight_sketch.png"}];const key='shisha-title-review-v3';let decisions={};try{decisions=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let list=all,index=0;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(decisions))}catch{}}function show(){if(!list.length)return;index=Math.max(0,Math.min(index,list.length-1));const a=list[index];$('name').textContent=(index+1)+' / '+list.length+'　'+a.group+' / '+a.character+' / '+a.path.split('/').pop()+'　'+(decisions[a.path]||'未判定');$('count').textContent='（採用 '+Object.values(decisions).filter(x=>x==='adopt').length+'）';const im=$('hero'),err=$('error');err.hidden=true;im.hidden=false;im.onerror=()=>{im.hidden=true;err.hidden=false;err.innerHTML='画像の読み込みに失敗しました。<p>'+a.path+'</p>このページをGitHub Pages等のHTTP配信から開いてください。リポジトリが非公開の場合、公開配信は避けてローカルサーバーを利用してください。'};im.src='../../'+a.path;document.querySelectorAll('#grid button').forEach((b,i)=>b.style.outline=i===index?'2px solid #9bd5ff':'none')}function move(n){index=(index+n+list.length)%list.length;show()}function judge(v){const a=list[index];if(v)decisions[a.path]=v;else delete decisions[a.path];save();render();if(v)move(1);else show()}function render(){list=all.filter(a=>!$('filter').value||a.group===$('filter').value);$('grid').innerHTML='';list.forEach((a,i)=>{const b=document.createElement('button');const im=document.createElement('img');im.loading='lazy';im.src='../../'+a.path;im.alt=a.character;b.append(im,document.createTextNode((decisions[a.path]||'—')+' '+a.character));b.onclick=()=>{index=i;show()};$('grid').append(b)});show()}$('filter').onchange=()=>{index=0;render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({generatedAt:new Date().toISOString(),decisions},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='title-review-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};render();</script></body></html>
