<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制作成功カットイン・全画面と時間停止</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237b6393'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}body{margin:0;background:#100e17;color:#eee9e1;font:15px/1.5 system-ui,sans-serif}
  main{max-width:1420px;margin:auto;padding:18px 22px}h1{font-size:21px;margin:0 0 5px}p{margin:0 0 14px;color:#bfb5c9}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}label{display:flex;align-items:center;gap:8px}
  button,select{font:inherit;color:#eee9e1;background:#2b2439;border:1px solid #746187;border-radius:7px;padding:8px 11px}
  button{cursor:pointer}button:disabled{opacity:.4}button:focus-visible,select:focus-visible{outline:2px solid #dfba83;outline-offset:3px}
  .primary{background:#d9bd8c;color:#211829;border-color:#d9bd8c}#status{color:#cbb5e9;font-size:13px;min-width:210px}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:#07060a;overflow:hidden;border:1px solid #5a496b;border-radius:12px}
  iframe{border:0;position:absolute;inset:0;width:100%;height:100%;background:#07060a}
  .note{margin:12px 0 0;color:#ccc1d2;font-size:13px}.note b{color:#eccea0}
</style>
<main>
  <h1>漫画カットイン：全画面／主人公エリア中央</h1>
  <p>画面いっぱいの迫力と、左側の中央へ収める出し方を比較。制作画面を操作しながら、演出と時間停止からの再開を試せます。</p>
  <div class="controls">
    <label>工程<select id="step"><option value="heat">炭焼き</option><option value="holes">穴あけ</option><option value="steam">蒸らし</option><option value="pull">吸い出し</option></select></label>
    <label>場面<select id="mode"><option value="tournament" selected>大会（左下に審査員）</option><option value="tutorial">スミさんの練習</option><option value="drill">自主練（見守る人なし）</option></select></label>
    <label>出し方<select id="variant"><option value="full" selected>D：全画面＋時間停止</option><option value="center">E：主人公エリア中央＋時間停止</option><option value="pair">A：左枠の下に2コマ</option><option value="peek">B：左端から顔だけ</option><option value="window">C：左枠を漫画に切替（時間継続）</option></select></label>
    <button class="primary" id="play" disabled>カットインを再生</button>
    <button id="hold" disabled>静止で比較</button>
    <button id="restart">工程をやり直す</button>
    <span id="status" role="status">画面を準備しています</span>
  </div>
  <div class="frame"><iframe id="game" title="カットイン比較用の制作画面"></iframe></div>
  <p class="note" id="note"></p>
  <p class="note">左下のコメントは大会なら審査員、練習ならスミさんが表示されます。自主練は見守る人なしの場面です。</p>
  <p class="note">今回は本編接続前の比較用プレビューです。カットインは手動再生で、セーブは書き込みません。手元の絵は炭焼きの仮素材を共用しています。</p>
</main>
<script src="craft_cutin_preview.js"></script>
</html>
