<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>凛・採用済み5表情</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#10151c;color:#f1f4f8;font:16px/1.5 sans-serif}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin:32px 0 12px}p{margin:0 0 16px}a{color:#8fd6ff}button{padding:6px 12px;background:#28323f;color:white;border:1px solid #738398;border-radius:6px;cursor:pointer}figure{margin:0;min-width:0}figcaption{margin-top:8px}.portraits{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.art,.crop{background:var(--paper,#20242c);border:1px solid #59697e;border-radius:8px}.art img{display:block;width:100%}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.crop{height:400px;overflow:auto}.window{width:360px;height:400px;position:relative;overflow:hidden}.window img{position:absolute;max-width:none;image-rendering:pixelated}.window[data-char="rin"] img{width:1024px;left:-330px;top:-40px}.window[data-char="minto"] img{width:896px;left:-300px;top:-220px}.window[data-char="ageha"] img{width:896px;left:-300px;top:-180px}body.zoom .window[data-char="rin"] img{width:2048px;left:-790px;top:-150px}body.zoom .window[data-char="minto"] img{width:1792px;left:-780px;top:-440px}body.zoom .window[data-char="ageha"] img{width:1792px;left:-780px;top:-360px}@media(max-width:700px){body{padding:16px}.portraits{grid-template-columns:repeat(2,minmax(0,1fr))}.details{grid-template-columns:minmax(0,1fr)}}
</style>
<h1>凛・採用済み5表情</h1>
<p>青みのある暗いロングウルフ、少し年上に見える涼しい半目、控えめな微笑み。笑顔だけは目を閉じて頬に手を添え、可愛いギャップを加えました。</p>
<p>2026-10-04の「全て完了したらマージ」に沿って5枚を制作・組み込み。通常v7の人物と衣装を全表情へ引き継いでいます。</p>
<p><button data-bg="#20242c">暗い背景</button> <button data-bg="#ffffff">白い背景</button> · <a href="rin-expressions-generation.json">生成記録</a> · <a href="rin-kafuka-final-integration.json">配置・検証記録</a> · <a href="rin-redesign-review.html">刷新前との比較</a> · <a href="style-gallery.html">過去の全制作画像</a></p>
<div class="portraits" id="portraits"></div>
<h2>顔・髪・服の原寸比較</h2>
<p><button data-scale="1">原寸・1px＝1px</button> <button data-scale="2">2倍・補間なし</button></p>
<div class="details" id="details"></div>
<script>
const faces=[['normal','通常','rin-redesign-v7.png'],['smile','笑顔・可愛いギャップ','rin-expressions-v1-smile.png'],['serious','真剣','rin-expressions-v1-serious.png'],['surprise','驚き','rin-expressions-v1-surprise.png'],['sad','悲しみ','rin-expressions-v1-sad.png']];
const portraits=document.querySelector('#portraits'),details=document.querySelector('#details');
for(const [face,label,source] of faces){portraits.insertAdjacentHTML('beforeend',`<figure><div class="art"><img src="../../../../assets/sprites/characters/rin/chr_rin_${face}.png" alt="凛・${label}"></div><figcaption>${label}・採用済み</figcaption></figure>`);details.insertAdjacentHTML('beforeend',`<figure><div class="crop"><div class="window" data-char="rin"><img src="${source}" alt="凛・${label}の生成元"></div></div><figcaption>${label}・<a href="${source}">生成元PNG</a></figcaption></figure>`)}
for(const [character,label] of [['minto','みんと'],['ageha','あげは']]){details.insertAdjacentHTML('beforeend',`<figure><div class="crop"><div class="window" data-char="${character}"><img src="../../../../assets/sprites/characters/${character}/chr_${character}_normal.png" alt="採用済み${label}の画風"></div></div><figcaption>${label}・採用済み画風</figcaption></figure>`)}
document.querySelectorAll('[data-bg]').forEach(button=>button.addEventListener('click',()=>document.documentElement.style.setProperty('--paper',button.dataset.bg)));
document.querySelectorAll('[data-scale]').forEach(button=>button.addEventListener('click',()=>document.body.classList.toggle('zoom',button.dataset.scale==='2')));
</script>
</html>
