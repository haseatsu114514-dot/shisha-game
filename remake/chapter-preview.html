<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<title>第1章の終わりと次回予告 — 水煙前線 -EN:CODE-</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/daily.css">
<link rel="stylesheet" href="css/chapter-preview.css">
<style>
#shell { position:fixed; inset:0; overflow:hidden; }
.preview-intro { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:radial-gradient(ellipse at 50% 45%,#242538,#090b12 70%); text-align:center; }
.preview-intro small { color:#dfc281; font-size:20px; letter-spacing:.25em; }
.preview-intro h1 { margin:0; color:#f4efdf; font-size:62px; letter-spacing:.08em; }
.preview-intro p { margin:0 0 16px; color:#bfb8cb; font-size:21px; line-height:1.8; }
.preview-intro .btn { min-width:280px; }
.preview-intro .preview-finished { color:#f4d7a1; font-size:27px; }
</style>
</head>
<body>
<div id="shell"><div id="stage"><div id="bg"></div><div id="screen"></div><div id="vn"></div><div id="hud"></div><div id="fx"></div><div id="toasts"></div><div id="banners"></div><div id="wipe"></div><div id="modal"></div></div></div>
<script type="module">
import { el } from "./js/core/util.js";
import { initLayers } from "./js/core/ui.js";
import { loadConfig } from "./js/core/state.js";
import { unlockAudio } from "./js/core/audio.js";
import { playChapterPreview, PREVIEWS } from "./js/chapters/chapter-preview.js";
// ?ch= で予告を切り替える（キーは登録表 PREVIEWS のキー＝次章の番号。既定は第1章末の ch2）。
const INTROS = {
  ch2: {
    title: "第1章の終わりと次回予告 — 水煙前線 -EN:CODE-",
    heading: "勝ちは、始まりだった。",
    note: "第1章の余韻から、第二章『才能の壁』へ。\n約48秒・音楽と字幕で再生します。",
    finished: "第1章 完。あなたの煙は、誰に届いている？",
  },
  ch3: {
    title: "第2章の終わりと次回予告 — 水煙前線 -EN:CODE-",
    heading: "トロフィーは、重かった。",
    note: "第2章の余韻から、第三章『嘘つきたちの夜』へ。\n約48秒・音楽と字幕で再生します。",
    finished: "第2章 完。味のしない舌は、そのままだった。",
  },
  ch4: {
    title: "第3章の終わりと次回予告 — 水煙前線 -EN:CODE-",
    heading: "帰る場所に、約束がひとつ増えた。",
    note: "第3章の余韻から、第四章『継承の煙』へ。\n約48秒・音楽と字幕で再生します。",
    finished: "第3章 完。全国大会を終え、帰る場所にも新しい約束ができた。",
  },
  ch5: {
    title: "第4章の終わりと次回予告 — 水煙前線 -EN:CODE-",
    heading: "世界大会を終え、日本へ戻った。",
    note: "第4章の余韻から、第五章『機械仕掛けの神』へ。\n約48秒・音楽と字幕で再生します。",
    finished: "第4章 完。世界大会を終え、日本へ戻った。",
  },
};
const requested = new URLSearchParams(location.search).get("ch");
const key = PREVIEWS[requested] && INTROS[requested] ? requested : "ch2";
const introText = INTROS[key];
document.title = introText.title;
const stage = document.getElementById("stage");
function fit() {
  const width = visualViewport?.width || innerWidth, height = visualViewport?.height || innerHeight;
  stage.style.setProperty("--k", String(Math.min(width/1280, height/720)));
}
fit(); addEventListener("resize", fit); visualViewport?.addEventListener("resize", fit); initLayers(); loadConfig();
const button = el("button.btn.primary", { type:"button", text:"章末と次回予告を再生", dataset:{test:"preview-start"} });
const note = el("p", { text: introText.note });
const intro = el("div.preview-intro", [el("small",{text:"水煙前線 -EN:CODE-"}),el("h1",{text:introText.heading}),note,button]);
document.getElementById("screen").append(intro);
button.addEventListener("click", async () => {
  if (button.disabled) return;
  unlockAudio(); button.disabled = true;
  const result = await playChapterPreview(key);
  button.disabled = false; button.textContent = "次回予告をもう一度";
  note.className = "preview-finished";
  note.textContent = result === "aborted" ? "予告を中断しました。" : introText.finished;
  intro.dataset.test = "preview-ended";
  button.focus({preventScroll:true});
});
// 本編のセーブ・報酬・既読は読み書きしない。
</script>
</body>
</html>
