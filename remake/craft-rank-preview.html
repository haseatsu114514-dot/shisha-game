<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>制作ランクの表示試作｜水煙前線 -EN:CODE-</title>
  <link rel="icon" href="../icon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/craft.css">
  <link rel="stylesheet" href="css/craft-header.css">
  <link rel="stylesheet" href="css/game-ds.css">
  <link rel="stylesheet" href="css/craft-paper.css">
  <link rel="stylesheet" href="css/craft-rank.css">
  <style>
    :root { --rank-tools-height: 144px; }
    #viewport, body.game-ds #viewport { top: var(--rank-tools-height); }
    .rank-preview-tools { position: fixed; inset: 0 0 auto; z-index: 1000; height: var(--rank-tools-height); padding: 4px 8px; background: #221534; color: #f6f1fa; overflow: auto; }
    .rank-preview-tools p { margin: 0 0 4px; font-size: 12px; line-height: 1.3; }
    .rank-preview-tools > div { display: flex; align-items: center; gap: 4px; min-width: max-content; }
    .rank-preview-tools button { min-width: 44px; min-height: 44px; padding: 5px 8px; border: 1px solid #c9a7e6; border-radius: 4px; background: #2e1d45; color: #f6f1fa; }
    .rank-preview-tools button:focus-visible { outline: 3px solid #e3bd6e; outline-offset: 1px; }
    .rank-preview-tools input:focus-visible { outline: 3px solid #e3bd6e; outline-offset: 1px; }
    .rank-preview-region { display: grid; place-items: center; height: 100%; min-height: 0; color: #c9a7e6; text-align: center; padding: 20px; }
    .rank-preview-frame { position: absolute; inset: 48px 20px 100px; border: 2px dashed #5a4475; display: grid; place-items: center; }
    .rank-preview-actions { position: absolute; left: 20px; right: 20px; bottom: 12px; display: flex; gap: 10px; }
    .rank-preview-actions button { flex: 1; min-height: 50px; }
    body.game-ds .rank-preview-region { font-size: 14px; }
    body.game-ds .rank-preview-frame { inset: 40px 10px 100px; }
    body.game-ds .bench-panel { height: 100%; }
  </style>
</head>
<body>
  <header class="rank-preview-tools">
    <p><b>表示部品だけの試作。</b> 採点・勝敗・本編には未接続。値は手動テスト用、画像は未採用の文字fallbackです。</p>
    <div>
      <button type="button" data-grade="" data-test="rank-preview-unavailable">未計測</button>
      <button type="button" data-grade="D">D</button><button type="button" data-grade="C">C</button>
      <button type="button" data-grade="B">B</button><button type="button" data-grade="A">A</button>
      <button type="button" data-grade="S">S</button><button type="button" data-grade="SS">SS</button>
      <button type="button" data-grade="SSS">SSS</button>
      <button type="button" data-test="rank-preview-ds">DS表示に切替え</button>
    </div>
    <div>
      <label for="rank-progress">ランク内の進捗（仮値）</label>
      <input id="rank-progress" type="range" min="0" max="100" value="60" disabled>
      <output for="rank-progress" id="rank-progress-value">未計測</output>
      <button type="button" data-test="rank-preview-demo" aria-pressed="false">自動デモ</button>
    </div>
  </header>
  <div id="viewport"><div id="stage"><div id="screen">
    <div class="bench" data-mode="tournament" data-step="steam">
      <div class="bench-top"><span class="bench-mode">SMOKE CROWN CUP</span><button type="button" class="btn small bench-appearance-button">外観を選ぶ</button></div>
      <div class="bench-left"><div class="rank-preview-region">中継の領域<br>実際の人物・ゲーム映像ではありません</div></div>
      <div class="bench-right"><div class="bench-head"><details class="bench-guide"><summary>?</summary></details></div><div class="bench-panel">
        <div class="rank-preview-frame">工程の操作領域（配置確認用）</div>
        <div class="rank-preview-actions"><button type="button" class="btn">操作ボタン</button><button type="button" class="btn primary">決定ボタン</button></div>
      </div></div>
    </div>
  </div></div></div>
  <script type="module">
    import { mountCraftRank, craftRankProgress, CRAFT_GRADES } from "./js/craft/rank-hud.js";
    import { buildCraftProgress } from "./js/craft/progress.js";
    import { dsGeometry } from "./js/scenes/ds-geometry.js";
    const top = document.querySelector(".bench-top");
    const phases = buildCraftProgress([]); phases.update("steam", "蒸らし");
    top.insertBefore(phases.root, top.lastElementChild);
    const rank = mountCraftRank(top);
    const resize = () => {
      const view = document.querySelector("#viewport");
      const width = view.clientWidth, height = view.clientHeight;
      document.documentElement.style.setProperty("--k", Math.min(width / 1280, height / 720));
      const g = dsGeometry(width, height);
      for (const key of ["vx", "vy", "vw", "vh", "cx", "cy", "cw", "ch", "hinge"]) document.documentElement.style.setProperty(`--ds-${key}`, `${g[key]}px`);
      document.documentElement.style.setProperty("--ds-k", String(Math.max(.2, (g.cw - 20) / 760)));
      document.documentElement.dataset.dsLayout = g.layout;
    };
    const setLayout = ds => { document.body.classList.toggle("game-ds", ds); resize(); };
    // Preview-only floors: these are temporary values, never gameplay balance.
    const previewFloors = [0, 100, 200, 300, 400, 500, 600];
    const slider = document.querySelector("#rank-progress");
    const output = document.querySelector("#rank-progress-value");
    const demo = document.querySelector('[data-test="rank-preview-demo"]');
    let demoTimer = null, demoScore = 0;
    const stopDemo = () => { clearInterval(demoTimer); demoTimer = null; demo.setAttribute("aria-pressed", "false"); };
    const showScore = score => {
      const value = craftRankProgress(score, previewFloors);
      rank.update({ ...value, label: value.grade === "A" ? "Aromatic" : "" });
      slider.disabled = value.grade === "SSS";
      slider.value = String(Math.round(value.progress * 100));
      output.textContent = value.grade === "SSS" ? "最高ランク" : `${slider.value}%`;
    };
    document.querySelectorAll("button[data-grade]").forEach(button => button.addEventListener("click", () => {
      stopDemo();
      const index = CRAFT_GRADES.indexOf(button.dataset.grade);
      if (index < 0) { rank.update(null); slider.disabled = true; output.textContent = "未計測"; }
      else showScore(previewFloors[index] + 60);
    }));
    slider.addEventListener("input", () => {
      stopDemo();
      showScore(previewFloors[CRAFT_GRADES.indexOf(rank.root.dataset.grade)] + Number(slider.value));
    });
    demo.addEventListener("click", () => {
      if (demoTimer !== null) { stopDemo(); return; }
      rank.update(null); demoScore = 0; showScore(demoScore);
      demo.setAttribute("aria-pressed", "true");
      demoTimer = setInterval(() => {
        demoScore += 5; showScore(demoScore);
        if (demoScore >= previewFloors.at(-1)) stopDemo();
      }, 100);
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden) stopDemo(); });
    window.addEventListener("pagehide", stopDemo);
    document.querySelector('[data-test="rank-preview-ds"]').addEventListener("click", () => setLayout(!document.body.classList.contains("game-ds")));
    window.addEventListener("resize", resize); resize();
    window.rankPreview = { rank, phases, setLayout, resize };
    document.body.dataset.rankReady = "true";
  </script>
</body>
</html>
