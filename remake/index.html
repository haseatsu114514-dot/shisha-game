[
{"id": "sumi-cold-tea", "title": "冷めた紅茶", "caption": "シーシャの話になると、時間を忘れる二人。", "panels": [{"src": "loading/sumi-cold-tea-1.webp", "alt": "左: はじめが冷めた紅茶を見て「お茶、冷めました。」。右のスミさんは頬杖で「話しすぎたな。」。"}, {"src": "loading/sumi-cold-tea-2.webp", "alt": "スミさんが指を立てて楽しそうに話を続け、はじめはノートを開く。はじめ「話はまだ熱い。」。"}]},
{"id": "sumi-cloth-fold", "title": "畳みの極意", "caption": "掃除のあと、ふきんを畳む練習をしていたら。", "panels": [{"src": "loading/sumi-cloth-fold-1.webp", "alt": "左: はじめが清潔な白いふきんを持ち「畳み方は？」。スミさんが「角をそろえろ。」。"}, {"src": "loading/sumi-cloth-fold-2.webp", "alt": "はじめが折り紙の鶴そっくりに畳んだ白ふきんを手にして困惑「鶴になった。」。スミさんは無言で眼鏡をずらし驚く。布の鶴は飛ばない。"}]},

{"id": "tsumugi-route-map", "title": "道順の地図", "caption": "つむぎは、葉っぱの耳の猫を描く芸大生です。", "panels": [{"src": "loading/tsumugi-route-map-1.webp", "alt": "店のソファ席で、はじめがメモ帳を差し出して「道順、描いてくれる？」。タブレットを抱えたつむぎが「……はい。」。"}, {"src": "loading/tsumugi-route-map-2.webp", "alt": "はじめが広げた道順は、山・川・森と葉っぱの耳の猫まで描き込まれた冒険の地図のような大作。はじめ「地図が壮大だ。」。"}]}

<script>
// 漫画を先に決め、2コマの絵をいちばん先に取りに行く（本体のプログラムより先に届くように）。表示は #boot の後ろのスクリプト。
(() => {
  let mode = null, read = [], list = [];
  try { mode = localStorage.getItem("suien_loading_comics"); } catch (_) { /* 保存を読めない環境はプレイヤーの既定 */ }
  // 漫画を毎回出すのはプレイヤーの既定。自動操作のブラウザ（既存の検査）は従来どおり出さない（js/core/loading.js の comicLoadingRequired と同じ）。
  if (!(mode === "always" || (mode !== "wait" && navigator.webdriver !== true))) return;
  try { list = JSON.parse(document.getElementById("boot-comics").textContent); } catch (_) { return; }
  try { read = JSON.parse(localStorage.getItem("suien_remake_loading_comics_read") || "[]"); } catch (_) { read = []; }
  const unread = list.filter((comic) => !(Array.isArray(read) && read.includes(comic.id)));
  const pool = unread.length ? unread : list;
  if (!pool.length) return;
  const comic = pool[crypto.getRandomValues(new Uint32Array(1))[0] % pool.length];
  window.SUIEN_BOOT_COMIC = comic;
  for (const panel of comic.panels) {
    const link = document.createElement("link");
    link.rel = "preload"; link.as = "image"; link.href = "img/" + panel.src; link.setAttribute("fetchpriority", "high");
    document.head.appendChild(link);
  }
})();
</script>

/* 起動画面の漫画（#boot-comics）。本体のロード画面（css/loading.css）と同じ紙面・2コマ・一行解説。 */
.boot-comic { display: flex; flex-direction: column; gap: 10px; width: 940px; box-sizing: border-box; padding: 14px 20px 12px;
  background: #f1e6cf; border-radius: 4px; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55); color: #2a1d2e; }
.boot-comic[hidden] { display: none; }

.boot-comic-panels { display: flex; gap: 12px; }
.boot-comic-panels span { flex: 1; aspect-ratio: 3 / 2; border: 3px solid #2a1d2e; background: #eee3cf; overflow: hidden; }
.boot-comic-panels img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s ease; }

<script>
// 起動画面の漫画を出す（選んだ話と絵の取得は <head> のスクリプト）。紙面はすぐ、絵は2コマとも描けてから出す。
(() => {
  const comic = window.SUIEN_BOOT_COMIC;
  const boot = document.getElementById("boot");
  if (!comic || !boot) return;
  // 本体が読み込まれるまでは、ステージ（1280×720）を画面に収める倍率がまだ入っていない（js/core/stage-fit.js の fitStage と同じ計算）。
  // スマホでも漫画の紙面が画面に収まるよう、ここで先に入れる。本体が読み込まれたら fitStage が同じ値で置き直す。
  const stage = document.getElementById("stage");
  const fit = () => {
    const view = window.visualViewport;
    const w = view && view.width > 0 ? view.width : window.innerWidth, h = view && view.height > 0 ? view.height : window.innerHeight;
    if (w > 0 && h > 0 && !boot.classList.contains("done")) stage.style.setProperty("--k", String(Math.min(w / 1280, h / 720)));
  };
  fit();
  window.addEventListener("resize", fit);
  const sheet = boot.querySelector(".boot-comic");
  const images = [...sheet.querySelectorAll("img")];
  sheet.querySelector(".boot-comic-title").textContent = comic.title;
  sheet.querySelector(".boot-comic-caption").textContent = comic.caption;
  boot.dataset.comic = comic.id;
  images.forEach((image, i) => { image.alt = comic.panels[i].alt; image.setAttribute("fetchpriority", "high"); image.src = "img/" + comic.panels[i].src; });
  // 紙面（題・一行解説・2コマの枠）は最初から出す。絵は2コマとも描けてから一緒に出す（半分だけの絵を見せない）。
  sheet.hidden = false;
  boot.classList.add("has-comic");
  Promise.all(images.map((image) => image.decode())).then(() => {
    sheet.classList.add("is-ready");
  }, () => {
    // 絵が届かないとき（通信が切れた等）は、空の紙面を残さず従来の起動画面に戻す。
    sheet.hidden = true;
    boot.classList.remove("has-comic");
  });
})();
</script>

<noscript>このゲームは JavaScript が必要です。</noscript>
<script>
// 公開版をインストール可能にする。更新確認は起動ごとに行い、プレイ中の再読み込みはしない。
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" })
    .then((registration) => registration.update())
    .catch((error) => console.warn("Service worker registration failed:", error));
}

// 本体のimport自体が通信・キャッシュで失敗しても、読み込み画面を放置しない。
(() => {
  const bootScreen = document.getElementById("boot");
  const message = bootScreen.querySelector(".boot-msg");
  const retry = bootScreen.querySelector(".boot-retry");
  const isLoading = () => bootScreen.isConnected && !bootScreen.classList.contains("done");
  const fail = (error, slow = false) => {
    if (!isLoading()) return;
    clearTimeout(watchdog);
    message.textContent = slow
      ? "読み込みに時間がかかっています。通信を確認して、もう一度お試しください。"
      : "読み込みに失敗しました。通信を確認して、もう一度お試しください。";
    retry.hidden = false;
    console.error("ゲームの起動に失敗しました", error);
  };
  retry.addEventListener("click", () => location.reload());
  const watchdog = setTimeout(() => fail(new Error("Boot timeout"), true), 30000);
  window.addEventListener("error", (event) => fail(event.error || new Error(event.message)));
  window.addEventListener("unhandledrejection", (event) => fail(event.reason));

  // 公開版は、開いた版が最新かを build.json（キャッシュなし）で確かめる。古い版がキャッシュから
  // 出ていたら、版付きの URL で読み直す＝自分で開いたリンクでも最新で遊べる（手元の dev は確かめない）
  const BUILD = document.querySelector('meta[name="suien-build"]')?.content || "dev";
  window.SUIEN_BUILD = BUILD; // スクリプトから差し込む CSS の版（js/core/asset-version.js）
  const latest = async (timeoutMs) => {
    if (BUILD === "dev") return null;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(`build.json?t=${Date.now()}`, { cache: "no-store", signal: controller.signal });
      return res.ok ? await res.json() : null;
    } catch {
      return null; // 確かめられないときは今の版のまま遊ぶ
    } finally {
      clearTimeout(timer);
    }
  };
  const openBuild = (build) => {
    const next = new URL(location.href);
    next.searchParams.set("v", build);
    location.replace(next.href);
  };

  // 遊んでいる途中で新しい版が出たら、勝手に読み直さず上に知らせるだけ（タブへ戻ったとき）
  let lastCheck = Date.now();
  const recheck = async (force = false) => {
    if (BUILD === "dev" || document.hidden || document.getElementById("update-note")) return;
    if (!force && Date.now() - lastCheck < 60000) return;
    lastCheck = Date.now();
    const info = await latest(8000);
    if (!info?.build || info.build === BUILD) return;
    const note = document.createElement("div");
    note.id = "update-note";
    const go = document.createElement("button");
    go.type = "button";
    go.className = "update-go";
    go.dataset.test = "update-go";
    go.textContent = "新しい版が出ています ── タップで更新（オートセーブから再開）";
    go.addEventListener("click", () => openBuild(info.build));
    const close = document.createElement("button");
    close.type = "button";
    close.className = "update-close";
    close.setAttribute("aria-label", "閉じる");
    close.textContent = "×";
    close.addEventListener("click", () => note.remove());
    note.append(go, close);
    document.body.append(note);
  };
  document.addEventListener("visibilitychange", () => recheck());
  window.addEventListener("pageshow", (event) => { if (event.persisted) recheck(true); });

  (async () => {
    const info = await latest(3000);
    // 新しい版の URL で開き直しても古いまま（配信の切り替え待ち）なら、繰り返さずにこの版で遊ぶ
    if (info?.build && info.build !== BUILD && new URLSearchParams(location.search).get("v") !== info.build) {
      openBuild(info.build);
      return;
    }
    const { boot } = await import("./js/main.js");
    await boot();
  })().then(() => clearTimeout(watchdog), fail);
})();
</script>
