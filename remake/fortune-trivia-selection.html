<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>占いトリビア候補の選別</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,sans-serif;background:#171922;color:#f4f0e8;margin:0;line-height:1.65}header{padding:24px max(16px,calc((100vw - 1100px)/2));background:#252838;border-bottom:1px solid #555}h1{margin:0;font-size:1.6rem}p{margin:.5em 0}main{max-width:1100px;margin:auto;padding:20px 16px 80px}button,select{font:inherit}button{cursor:pointer;border:1px solid #787d91;background:#33394c;color:#fff;border-radius:8px;padding:8px 12px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #efc879}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}nav button[aria-current=true]{background:#9b7335;color:#fff;border-color:#e2b56b}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tools select{background:#33394c;color:#fff;border:1px solid #787d91;border-radius:8px;padding:8px}.summary{font-weight:bold;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.card{background:#282b38;border:1px solid #505466;border-radius:12px;padding:16px}.card[data-status=採用]{border-color:#78c59a}.card[data-status=没]{opacity:.72}.meta{color:#c7c9d2;font-size:.88rem}.line{margin:.6em 0}.who{color:#efcb87;font-weight:bold}.choices{display:flex;gap:4px;flex-wrap:wrap;margin-top:15px}.choices label{cursor:pointer;border:1px solid #74798b;border-radius:8px;padding:6px 9px}.choices label:has(input:checked){background:#725633;border-color:#e5b76e}.choices input{accent-color:#efc879}#message{min-height:1.5em;color:#efcb87}a{color:#efcb87}small{color:#c7c9d2}
</style>
</head>
<body>
<header>
<h1>占いトリビア候補の選別</h1>
<p>キャラごとに候補を見て、採用・保留・没を選んでください。選択はこのブラウザに自動保存されます。最終目標は各キャラ採用10本です。</p>
<p><small>候補は未確定です。ゲーム本編のトリビアには選別後の別工程で反映します。同じ端末・ブラウザで開いてください。別端末へ移す場合は選別結果を保存して読み込んでください。</small></p>
</header>
<main>
<div class="tools">
<label>表示 <select id="filter"><option value="all">すべて</option><option value="unrated">未判定</option><option value="採用">採用</option><option value="保留">保留</option><option value="没">没</option></select></label>
<button id="export" type="button">選別結果を保存</button>
<button id="import" type="button">選別結果を読み込む</button><input id="import-file" type="file" accept="application/json,.json" hidden>
</div>
<p id="message" role="status"></p>
<nav id="characters" aria-label="キャラクター"></nav>
<p class="summary" id="summary"></p>
<div class="grid" id="cards"></div>
</main>
<script type="module">
const names={sumi:'スミさん',naru:'なる',adam:'アダム',minto:'みんと',tsumugi:'つむぎ',rio:'凛想',hiyori:'ひより',samechan:'サメちゃん',ageha:'あげは',kumicho:'組長',rei:'レヰ',saku:'朔',steve:'スティーブ',volk:'フォルク',mashiro:'ましろ',mukai_master:'ムカイさん',da_silva:'ダ・シルバ',sheikh:'シェイク',master_hookah:'王煙楼',noor:'ヌール'};
const key='shisha-fortune-trivia-selection-2749-v1';
const statuses=['採用','保留','没'];
const message=document.querySelector('#message');
let groups={}, current='', votes={};
try { const saved=JSON.parse(localStorage.getItem(key)||'{}'); if(saved&&typeof saved==='object'&&!Array.isArray(saved))votes=saved; } catch { message.textContent='保存済みの選別結果を読めませんでした。'; }
function save(){try{localStorage.setItem(key,JSON.stringify(votes));message.textContent='選別結果を自動保存しました';}catch{message.textContent='自動保存できませんでした。「選別結果を保存」でファイルを残してください';}}
function count(entries,status){return entries.filter(e=>votes[e.id]===status).length;}
function render(){
 const nav=document.querySelector('#characters');nav.replaceChildren();
 for(const [id,entries] of Object.entries(groups)){
  const button=document.createElement('button');button.type='button';button.textContent=`${names[id]||id} ${count(entries,'採用')}/${entries.length}`;button.setAttribute('aria-current',String(id===current));button.onclick=()=>{current=id;render()};nav.append(button);
 }
 const entries=groups[current]||[];const filter=document.querySelector('#filter').value;
 document.querySelector('#summary').textContent=`${names[current]||current}：候補${entries.length}本／採用${count(entries,'採用')}本／保留${count(entries,'保留')}本／没${count(entries,'没')}本／未判定${entries.filter(e=>!statuses.includes(votes[e.id])).length}本`;
 const cards=document.querySelector('#cards');cards.replaceChildren();
 for(const e of entries){const status=votes[e.id];if(filter==='unrated'&&statuses.includes(status)||filter!=='all'&&filter!=='unrated'&&filter!==status)continue;
  const card=document.createElement('article');card.className='card';card.dataset.status=status||'';
  const meta=document.createElement('div');meta.className='meta';meta.textContent=e.id+(e.extra?' · 今回の追加候補':' · 既存在庫');card.append(meta);
  for(const [who,text] of [['占い師',e.teller],['はじめ',e.reaction]]){const p=document.createElement('p');p.className='line';const strong=document.createElement('span');strong.className='who';strong.textContent=who+'「';p.append(strong,document.createTextNode(text+'」'));card.append(p)}
  const choices=document.createElement('div');choices.className='choices';choices.setAttribute('role','group');choices.setAttribute('aria-label',e.id+' の判定');
  for(const value of statuses){const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name=e.id;input.value=value;input.checked=status===value;input.onchange=()=>{votes[e.id]=value;save();render()};label.append(input,document.createTextNode(value));choices.append(label)}card.append(choices);cards.append(card);
 }
}
async function load(){try{
 const [baseResponse,extraResponse]=await Promise.all([fetch('./data/fortune-trivia.json'),fetch('./data/fortune-trivia-selection.json')]);
 if(!baseResponse.ok||!extraResponse.ok)throw Error('候補JSONを取得できません');
 const base=await baseResponse.json(),extra=await extraResponse.json();
 for(const [id,entries] of Object.entries(base.characters)){groups[id]=[...entries.map(e=>({...e,extra:false})),...(extra.characters[id]||[]).map(e=>({...e,extra:true}))]}
 for(const [id,entries] of Object.entries(extra.characters))if(!groups[id])groups[id]=entries.map(e=>({...e,extra:true}));
 current=Object.keys(groups)[0];render();
 }catch(error){message.textContent=`候補を読み込めませんでした（${error.message}）。ローカルでは remake/ の親フォルダで python3 -m http.server 8000 を起動してください。`}}
document.querySelector('#filter').onchange=render;
document.querySelector('#export').onclick=()=>{const file=new Blob([JSON.stringify({issue:2749,format:1,decisions:votes},null,2)+'\n'],{type:'application/json'});const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download='fortune-trivia-selection-2749.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.querySelector('#import').onclick=()=>document.querySelector('#import-file').click();
document.querySelector('#import-file').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.issue!==2749||data.format!==1||!data.decisions||typeof data.decisions!=='object'||Array.isArray(data.decisions))throw Error('形式が違います');const ids=new Set(Object.values(groups).flat().map(e=>e.id));for(const [id,value] of Object.entries(data.decisions))if(!ids.has(id)||!statuses.includes(value))throw Error('候補IDか判定が不正です');votes={...data.decisions};save();render();message.textContent='選別結果を読み込み、自動保存しました';}catch(error){message.textContent=`読み込み失敗：${error.message}`}event.target.value=''};
load();
</script>
</body>
</html>
