<!DOCTYPE html>
<html lang="ja" data-ui-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="suien-build" content="dev" data-built="">
  <title>TRPG・本棚と招集の試遊｜水煙前線</title>
  <link rel="icon" href="../icon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/trpg.css">
  <link rel="stylesheet" href="css/ui-paper.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/phone-density.css">
  <link rel="stylesheet" href="css/store-logos.css">
  <link rel="stylesheet" href="css/side-area.css">
  <style>
    /* 横持ち試遊の設立画面で、台詞と2つの返事を画面内に収める。 */
    html[data-density="phone"] .trpg-club-proposal:not(.trpg-club-founded) {
      width: 100%;
      max-width: 1020px;
    }
    html[data-density="phone"] .trpg-club-proposal:not(.trpg-club-founded) > .trpg-button {
      min-height: calc(var(--phone-tap) + 1px);
    }
    html[data-density="phone"] .trpg-club-proposal:not(.trpg-club-founded) > .trpg-button + .trpg-button {
      margin-inline-start: var(--phone-gap);
    }
  </style>
</head>
<body class="trpg-preview">
  <div id="viewport"><div id="stage"><main id="trpg-app" tabindex="-1"></main></div></div>
  <script src="js/page-boot.js" data-page="js/trpg/campaign-preview.js"></script>
</body>
</html>
