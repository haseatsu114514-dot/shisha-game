<html lang="ja">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="../icon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/vn.css">
  <link rel="stylesheet" href="css/craft.css">
  <link rel="stylesheet" href="css/craft-rank.css">
  <link rel="stylesheet" href="css/ui-art.css">
  <link rel="stylesheet" href="css/ui-inner.css">
  <link rel="stylesheet" href="css/steam.css">
  <link rel="stylesheet" href="css/worker-scenes.css">
  <link rel="stylesheet" href="css/craft-header.css">
  <link rel="stylesheet" href="css/tournament.css">
  <link rel="stylesheet" href="css/motions.css">
  <link rel="stylesheet" href="css/craft-preview.css">
  <link rel="stylesheet" href="css/craft-water-pour.css">
  <!-- 蒸らし・吸い出し・ランク・大会の小窓・結果の札も、本編（index.html）と同じ順で読む（CRN・P0） -->
  <!-- 本編と同じスマホ横持ちの補正（#2862。これが無いと試遊ページだけ文字が小さく見える） -->
  <link rel="stylesheet" href="css/result.css">
  <link rel="stylesheet" href="css/ui-paper.css">
  <link rel="stylesheet" href="css/craft-landscape.css">
  <link rel="stylesheet" href="css/flavor-guide.css">
  <link rel="stylesheet" href="css/craft-paper.css">
  <link rel="stylesheet" href="css/phone-density.css">
  <link rel="stylesheet" href="css/wide-craft.css">
  <link rel="stylesheet" href="css/phone-layout.css">
  <link rel="stylesheet" href="css/side-area.css">
  <link rel="stylesheet" href="css/craft-stage.css">
</head>
<body>
  <nav class="craft-preview-nav" aria-label="試遊する工程">
    <b>制作ミニゲーム</b>
    <a href="craft-preview.html" data-preview-step="pack">詰め方を見比べる</a>
    <a href="craft-preview.html?step=holes" data-preview-step="holes">穴あけで遊ぶ</a>
    <a href="craft-preview.html?step=heat" data-preview-step="heat">炭焼きで遊ぶ</a>
    <a href="craft-preview.html?step=water" data-preview-step="water">水入れで遊ぶ</a>
    <a href="craft-preview.html?step=steam" data-preview-step="steam">蒸らし</a>
    <a href="craft-preview.html?step=pull" data-preview-step="pull">吸い出し</a>
    <a href="craft-preview.html?step=care" data-preview-step="care">調整</a>
    <a href="craft-preview.html?step=full" data-preview-step="full">通しで一台</a>
    <a href="craft-preview.html?loading=comic">漫画付きロード</a>
    <small>本編のセーブに影響しない試遊です</small>
  </nav>
  <div id="viewport"><div id="backdrop" aria-hidden="true"></div><div id="stage">
    <div id="bg"></div><div id="screen"></div><div id="vn"></div><div id="hud"></div>
    <div id="fx"></div><div id="toasts"></div><div id="banners"></div>
    <div id="wipe"><i></i><i></i><i></i><i></i><i></i><i></i></div><div id="modal"></div>
    <div id="craft-preview-loading" role="status">作業台を準備しています…</div>
  </div></div>
  <div id="rotate-hint"><div>スマホは横向きでお楽しみください</div></div>
  <noscript>この試遊には JavaScript が必要です。</noscript>
  <script type="module">
    const loading = document.getElementById("craft-preview-loading");
    const timer = setTimeout(() => { loading.textContent = "読み込みに時間がかかっています。通信を確認してページを再読み込みしてください。"; }, 30000);
    import("./js/craft/preview.js").then(m => m.boot()).then(() => clearTimeout(timer)).catch(error => {
      clearTimeout(timer); loading.textContent = "読み込めませんでした。通信を確認してページを再読み込みしてください。";
      loading.hidden = false; console.error(error);
    });
  </script>
</body>
</html>
