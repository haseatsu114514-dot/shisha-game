<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CONTINUE演出 プレビュー — 水煙前線 -EN:CODE-</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/daily.css">
<link rel="stylesheet" href="css/continue.css">
<style>
#preview-tools { position:fixed; top:8px; left:12px; right:12px; z-index:200;
 display:flex; align-items:center; flex-wrap:wrap; justify-content:center; gap:8px; padding:10px 14px;
 background:#0c1021ef; border:1px solid #f2b86688; border-radius:10px; font:700 14px var(--font);
 box-shadow:0 8px 26px #000a; }
#preview-tools select,#preview-tools button { border:1px solid #e2b97f99; border-radius:6px; padding:6px 10px;
 background:#1b1e31; color:#fff; cursor:pointer; }
#preview-tools button { background:#b88325; color:#080910; font-weight:900; }
#preview-tools small { color:#b7c4d7; }
#preview-tools label { display:flex; align-items:center; gap:4px; white-space:nowrap; }
#preview-error { position:fixed; inset:auto 5% 5px; z-index:201; color:#c8bdc3; text-align:center; font-size:12px; pointer-events:none; }
@media(max-width:900px) { #preview-tools { gap:5px; padding:6px; font-size:12px; } #preview-tools select { max-width:175px; } }
</style>
</head>
<body>
<div id="preview-tools">
 <label for="character">演出プレビュー</label>
 <select id="character" aria-label="出演キャラクター">
 <option value="0" selected>スミさん① 共同責任</option>
 <option value="1">スミさん② 世界の終わり</option>
 <option value="2">スミさん③ 反対多数</option>
 <option value="premium:tsumugi">つむぎ（プレミア）</option>
 <option value="premium:minto">栞／みんと（第2章以降）</option>
 <option value="premium:rin">凛（プレミア）</option>
 <option value="premium:ageha">アゲハ（プレミア）</option>
 <option value="premium:mashiro">ましろ（プレミア）</option>
 <option value="premium:samechan">サメちゃん（プレミア）</option>
 </select>
 <label for="preview-layout">配置</label>
 <select id="preview-layout" aria-label="コンティニューの配置">
 <option value="neon" selected>筆文字・円形HUD（採用中）</option>
 <option value="bottom">王道・下にボタン（比較）</option>
 <option value="bottom-back-count">王道＋迫る背面カウント（実験）</option>
 <option value="top">上にボタン（実験）</option>
 <option value="back-count">上ボタン＋背面カウント（実験）</option>
 </select>
 <label for="preview-background">背景</label>
 <select id="preview-background" aria-label="コンティニューの背景">
 <option value="stage" selected>暗いステージ（採用中）</option>
 <option value="purple">紫の煙（比較）</option>
 </select>
 <label>敗因<select id="reason"><option value="rank">順位</option><option value="burnt">焦げ</option><option value="cold">冷え</option><option value="leaf">葉切れ</option></select></label>
 <label>順位<input id="rank" type="number" min="1" max="4" value="2"></label>
 <label>弱点<select id="weak"><option value="">不明</option><option>holes</option><option>heat</option><option>shisha</option><option>care1</option><option>care2</option></select></label>
 <label>敗北回数<input id="loss" type="number" min="1" value="1"></label>
 <label>章<input id="chapter" type="number" min="1" max="3" value="1"></label>
 <button type="button" id="preview-play">▶ 再生する</button>
 <button type="button" id="preview-retry" disabled>戻る反応</button>
 <button type="button" id="preview-quit" disabled>諦める反応</button>
 <label><input type="checkbox" id="preview-se" checked>SE ON</label>
 <label><input type="checkbox" id="preview-bgm" checked>BGM ON</label>
 <label><input type="checkbox" id="preview-motion">動きを減らす</label>
</div>
<div id="viewport"><div id="stage"><div id="bg"></div><div id="screen"></div></div></div>
<div id="preview-error" role="status"></div>
<script type="module">
import { loadAll } from "./js/core/data.js";
import { buildGameOver } from "./js/chapters/gameover.js";
import { unlockAudio, applyVolumes } from "./js/core/audio.js";
import { config, loadConfig } from "./js/core/state.js";
const stage = document.getElementById("stage"), screen = document.getElementById("screen"),
  msg = document.getElementById("preview-error"), btn = document.getElementById("preview-play"),
  selector = document.getElementById("character"), layout = document.getElementById("preview-layout"),
  background = document.getElementById("preview-background"),
  tools = document.getElementById("preview-tools"),
  se = document.getElementById("preview-se"), bgm = document.getElementById("preview-bgm"),
  motion = document.getElementById("preview-motion"), retry = document.getElementById("preview-retry"),
  quit = document.getElementById("preview-quit");
const params = new URLSearchParams(location.search);
if (["neon", "bottom", "top", "back-count", "bottom-back-count"].includes(params.get("layout"))) layout.value = params.get("layout");
if (["purple", "stage"].includes(params.get("background"))) background.value = params.get("background");
function fit() {
 const top = tools.offsetHeight + 22;
 document.getElementById("viewport").style.top = top + "px";
 stage.style.setProperty("--k", String(Math.max(.05, Math.min(innerWidth/1280,(innerHeight-top-22)/720))));
}
addEventListener("resize", fit); new ResizeObserver(fit).observe(tools); fit();
let ready = false, root = null;
loadConfig();
const musicVolume = config.bgmVolume;
bgm.checked = musicVolume > 0;
btn.textContent = "読み込み中…"; btn.disabled = true;
try { await loadAll(); ready = true; btn.textContent = "▶ 再生する"; btn.disabled = false; }
catch (e) { msg.textContent = "ゲーム素材を読み込めません: " + e.message; btn.textContent = "素材エラー"; }
function show() {
 if (!ready) return;
 unlockAudio();
 root?.cleanupContinue?.();
 const val = selector.value;
 msg.textContent = Number(document.getElementById("loss").value) === 1
   ? "声なし・初回は時間制限なし。BGM：BGMer「EMGコール」"
   : "声なし・20秒でGAME OVER。BGM：BGMer「EMGコール」";
 retry.disabled = quit.disabled = false;
 root = buildGameOver({
   context: { chapter: Number(document.getElementById("chapter").value), reason: document.getElementById("reason").value,
     rank: Number(document.getElementById("rank").value), lossOrdinal: Number(document.getElementById("loss").value),
     sameReasonOrdinal: Number(document.getElementById("loss").value),
     parts: { [document.getElementById("weak").value]: 40 }, completedParts: [document.getElementById("weak").value] },
   variant:val.startsWith("premium:")?val:Number(val),
   soundEffects:se.checked, reducedMotion:motion.checked, layout:layout.value, background:background.value,
   onRetry:()=>complete("retry"), onTitle:()=>complete("quit")
 });
 screen.replaceChildren(root);
}
function complete(choice) {
 root.classList.remove("go-leaving"); root.dataset.phase="preview-ended";
 retry.disabled = quit.disabled = true;
 msg.textContent = choice === "retry" ? "戻る反応のプレビュー完了。本編では大会の最初へ戻ります。"
   : root.dataset.timedOut === "true" ? "20秒でGAME OVER。本編ではタイトルへ戻ります。"
   : "諦める反応のプレビュー完了。本編ではタイトルへ戻ります。";
 btn.focus();
}
btn.addEventListener("click", show);
selector.addEventListener("change", show);
layout.addEventListener("change", show);
background.addEventListener("change", show);
retry.addEventListener("click", ()=>root?.querySelector('[data-test="retry"]')?.click());
quit.addEventListener("click", ()=>root?.querySelector('[data-test="game-over-title"]')?.click());
se.addEventListener("change", ()=>root?.setContinueSoundEffects?.(se.checked));
bgm.addEventListener("change", ()=>{ config.bgmVolume=bgm.checked ? musicVolume || .5 : 0; applyVolumes(); });
motion.addEventListener("change", show);
addEventListener("pagehide", ()=>root?.cleanupContinue?.());
msg.textContent="キャラクターを選び、再生ボタンを押してください。";
</script>
</body>
</html>
